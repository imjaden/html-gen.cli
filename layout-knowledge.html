<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="https://www.jaden.tech/static/img/favicon.png?=20260706" type="image/png">
<title><!--TITLE--></title>
<link rel="stylesheet" href="style-guide.css">
<style>
/* ── Layout ── */
.kw-wrapper { display: flex; height: 100vh; overflow: hidden; }

/* ── Sidebar ── */
.kw-sidebar {
  width: 260px; min-width: 260px;
  background: var(--surface-900);
  border-right: 1px solid #2a2a3e;
  display: flex; flex-direction: column;
  overflow-y: auto;
  transition: width 0.25s, min-width 0.25s;
}
.kw-sidebar.collapsed { width: 48px; min-width: 48px; }
.kw-sidebar.collapsed .kw-sidebar-header,
.kw-sidebar.collapsed .kw-sections,
.kw-sidebar.collapsed .kw-sidebar-footer { display: none; }
.kw-sidebar-icon { display: none; font-size: 1.2rem; justify-content: center; padding: 14px 0 8px; }
.kw-sidebar.collapsed .kw-sidebar-icon { display: flex; }
.kw-sidebar-header {
  padding: 14px 16px 10px;
  border-bottom: 1px solid #2a2a3e;
  flex-shrink: 0;
}
.kw-sidebar-header .sidebar-title { font-size: 0.82rem; font-weight: 700; color: var(--cobalt-400); cursor: pointer; }
.kw-sidebar-header .sidebar-title:hover { color: var(--cobalt-300); }
.kw-sidebar-header .sub { font-size: 0.7rem; color: #6b7280; margin-top: 2px; }
.kw-sections { flex: 1; overflow-y: auto; padding: 6px 0; display: none; }
.kw-sections.active { display: block; }
.kw-section-title {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 16px 4px; font-size: 0.7rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.06em;
  color: #6b7280; cursor: pointer; user-select: none;
}
.kw-section-title:hover { color: #e0e0e0; }
.kw-section-title.active { color: var(--cobalt-400); }
.kw-section-title .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.kw-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 16px 8px 28px; cursor: pointer; transition: all 0.12s;
  border-left: 3px solid transparent; color: #9ca3af; font-size: 0.82rem;
}
.kw-item:hover { background: rgba(79,70,229,0.04); color: #e0e0e0; }
.kw-item.active { background: rgba(79,70,229,0.08); color: var(--cobalt-400); border-left-color: var(--cobalt-600); }
.kw-item .kw-item-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kw-item .kw-item-badge { font-size: 0.62rem; padding: 1px 6px; border-radius: 8px; font-weight: 600; letter-spacing: 0.02em; flex-shrink: 0; }

/* ── Sidebar Footer ── */
.kw-sidebar-footer { padding: 8px 12px; border-top: 1px solid #2a2a3e; display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.kw-sidebar-footer .sb-btn { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 6px; border: 1px solid #2a2a3e; background: transparent; color: #6b7280; cursor: pointer; font-size: 0.7rem; transition: all 0.15s; font-family: inherit; }
.kw-sidebar-footer .sb-btn:hover { background: rgba(79,70,229,0.1); color: #e0e0e0; }

/* ── Sidebar Search ── */
.kw-search-wrap { display: none; padding: 6px 12px; border-bottom: 1px solid #2a2a3e; }
.kw-search-wrap.active { display: block; }
.kw-search-wrap input { width: 100%; box-sizing: border-box; padding: 6px 10px; border: 1px solid #2a2a3e; border-radius: 6px; background: #0d0d1a; color: #e0e0e0; font-size: 0.72rem; outline: none; font-family: inherit; }
.kw-search-wrap input:focus { border-color: var(--cobalt-600); }
.kw-search-wrap input::placeholder { color: #555; }
.kw-item.filtered-out { display: none; }
.kw-section-title.filtered-out { display: none; }

/* ── Sidebar Resize ── */
.kw-sidebar { position: relative; }
.kw-sidebar-resize {
  position: absolute; right: -4px; top: 0; bottom: 0; width: 8px;
  cursor: col-resize; z-index: 20; transition: background 0.15s;
}
.kw-sidebar-resize:hover, .kw-sidebar-resize.active { background: var(--cobalt-600); opacity: 0.4; }

/* ── Top-Right Toolbar ── */
.kw-toolbar { position: fixed; top: 12px; right: 16px; z-index: 900; display: flex; align-items: center; gap: 2px; background: rgba(17,17,27,0.88); backdrop-filter: blur(12px); border: 1px solid #2a2a3e; border-radius: 28px; padding: 3px 5px; }
:root.light .kw-toolbar { background: rgba(255,255,255,0.88); border-color: #ddd; }
.kw-tb-btn { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; border: none; background: transparent; color: #9ca3af; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; font-family: inherit; }
.kw-tb-btn:hover { background: rgba(79,70,229,0.15); color: #e0e0e0; }
.kw-tb-btn.active { background: var(--cobalt-600); color: #fff; }
.kw-tb-divider { width: 1px; height: 18px; background: #2a2a3e; margin: 0 3px; }

/* ── Light Theme ── */
:root.light { --surface-950: #f5f5f5; --surface-900: #ffffff; --surface-850: #f0f0f0; --surface-800: #e8e8e8; --cobalt-950: #eef2ff; --cobalt-600: #6366f1; }
:root.light body { color: #333; background: #f5f5f5; }
:root.light .kw-sidebar { background: #fff; border-color: #e5e5e5; }
:root.light .kw-sidebar-header { border-color: #e5e5e5; }
:root.light .kw-sidebar-footer { border-color: #e5e5e5; }
:root.light .kw-sidebar-header .sidebar-title { color: #333; }
:root.light .kw-sidebar-header .sub { color: #999; }
:root.light .kw-item { color: #555; }
:root.light .kw-item:hover { background: rgba(79,70,229,0.03); color: #333; }
:root.light .kw-item.active { background: rgba(79,70,229,0.06); color: var(--cobalt-600); }
:root.light .kw-tab-bar { background: #fff; border-color: #e5e5e5; }
:root.light .kw-tab { color: #666; }
:root.light .kw-tab:hover { color: #333; }
:root.light .kw-tab.active { color: var(--cobalt-600); }
:root.light .kw-content { background: #f5f5f5; }
:root.light .kw-search-wrap { border-color: #e5e5e5; }
:root.light .kw-search-wrap input { background: #f5f5f5; border-color: #ddd; color: #333; }
:root.light .kw-welcome .w-title { color: #333; }

/* ── Main ── */
.kw-main { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }

/* ── Tab Bar (aligned with sidebar title) ── */
.kw-tab-bar {
  height: 48px; min-height: 48px;
  display: flex; align-items: stretch;
  background: var(--surface-900);
  border-bottom: 1px solid #2a2a3e;
  overflow-x: auto; overflow-y: hidden;
  flex-shrink: 0;
}
.kw-tab-bar::-webkit-scrollbar { height: 0; }
.kw-tab {
  display: flex; align-items: center; gap: 6px;
  padding: 0 20px; cursor: pointer; white-space: nowrap;
  font-size: 0.82rem; font-weight: 500;
  color: #9ca3af; border-bottom: 2px solid transparent;
  transition: all 0.15s; flex-shrink: 0; user-select: none;
}
.kw-tab:hover { background: rgba(79,70,229,0.04); color: #e0e0e0; }
.kw-tab.active { color: var(--cobalt-400); border-bottom-color: var(--cobalt-600); }
.kw-tab .kw-tab-icon { font-size: 0.9rem; }

/* ── Content area ── */
.kw-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--surface-950); }
.kw-body { flex: 1; overflow-y: auto; padding: 24px 32px; }

/* ── Welcome ── */
.kw-welcome { display: none; flex: 1; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 40px 20px; text-align: center; }
.kw-welcome.active { display: flex; }
.kw-welcome .w-title { font-size: 1.3rem; font-weight: 700; color: #e0e0e0; }
.kw-welcome .w-sub { font-size: 0.85rem; color: #6b7280; max-width: 440px; line-height: 1.7; }
.kw-welcome .w-legend { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
.kw-welcome .w-legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.78rem; color: #9ca3af; }
.kw-welcome .w-legend-item .ldot { width: 8px; height: 8px; border-radius: 50%; }

/* ── Content iframe ── */
.kw-frame-wrap { display: none; flex: 1; flex-direction: column; }
.kw-frame-wrap.active { display: flex; }
.kw-frame-wrap iframe { width: 100%; flex: 1; border: none; background: var(--surface-950); }

@media (max-width: 768px) {
  .kw-sidebar { display: none; position: fixed; top: 0; left: 0; width: 260px; height: 100vh; z-index: 100; }
  .kw-sidebar.open { display: flex; box-shadow: 4px 0 20px rgba(0,0,0,0.5); }
  .kw-body { padding: 16px; }
}

@media print {
  .kw-sidebar, .kw-tab-bar, .kw-toolbar { display: none !important; }
  .kw-body { color: #000; }
  .kw-welcome { display: none !important; }
  body { background: #fff; }
}
.kw-sidebar::-webkit-scrollbar { width: 4px; }
.kw-sidebar::-webkit-scrollbar-thumb { background: #2a2a3e; border-radius: 2px; }
</style>
</head>
<body>
<!-- Top-Right Toolbar -->
<div class="kw-toolbar" id="kwToolbar">
  <button class="kw-tb-btn active" id="kwLangZh" onclick="setKwLang('zh')" title="中文">🇨🇳</button>
  <button class="kw-tb-btn" id="kwLangEn" onclick="setKwLang('en')" title="English">🇺🇸</button>
  <span class="kw-tb-divider"></span>
  <button class="kw-tb-btn" id="kwThemeBtn" onclick="toggleKwTheme()" title="切换主题">🌙</button>
</div>

<div class="kw-wrapper">

  <aside class="kw-sidebar" id="kwSidebar">
    <div class="kw-sidebar-resize" id="kwSbResize"></div>
    <div class="kw-sidebar-icon" onclick="toggleSidebar()" title="展开侧边栏">📚</div>
    <div class="kw-sidebar-header">
      <div class="sidebar-title" title="<!--TITLE-->">📚 <!--TITLE--></div>
      <div class="sub"><!--SUBTITLE--></div>
    </div>
    <div id="kwSectionsContainer"></div>
    <!-- Sidebar Search -->
    <div class="kw-search-wrap" id="kwSearchWrap">
      <input type="text" id="kwSearchInput" placeholder="搜索...">
    </div>
    <div class="kw-sidebar-footer">
      <button class="sb-btn" id="kwSearchBtn" onclick="toggleKwSearch()" title="搜索">🔍</button>
      <span style="flex:1"></span>
      <button class="sb-btn" id="collapseBtn" onclick="toggleSidebar()" title="折叠侧边栏">◀◀</button>
    </div>
  </aside>

  <div class="kw-main">
    <div class="kw-tab-bar" id="kwTabBar"></div>
    <div class="kw-content">
      <div class="kw-welcome active" id="welcomePanel">
        <div class="w-title">📚 <!--TITLE--></div>
        <div class="w-sub"><!--WELCOME_TEXT--></div>
        <div class="w-legend" id="wLegend"></div>
      </div>
      <div class="kw-frame-wrap" id="frameWrap">
        <iframe id="contentFrame" src="about:blank" style="width:100%;flex:1;border:none;background:var(--surface-950);display:none;"></iframe>
        <div class="kw-body" id="kwBody"></div>
      </div>
    </div>
  </div>

</div>

<script>
(function() {
  const GROUPS = <!--GROUPS-->;  // [{key, label, icon}]
  const ITEMS  = <!--ITEMS-->;   // [{title, group, section?, badge?, url?, desc?}]

  let activeGroup = GROUPS.length > 0 ? GROUPS[0].key : '';
  let activeItem = null;
  const COLORS = ['#38bdf8','#34d399','#c084fc','#fb923c','#f472b6','#fbbf24','#818cf8'];
  const BADGE_COLORS = {
    '知道':{bg:'rgba(56,189,248,0.12)',color:'#38bdf8',border:'rgba(56,189,248,0.25)'},
    '理解':{bg:'rgba(52,211,153,0.12)',color:'#34d399',border:'rgba(52,211,153,0.25)'},
    '能讲':{bg:'rgba(192,132,252,0.12)',color:'#c084fc',border:'rgba(192,132,252,0.25)'},
    '能输出':{bg:'rgba(251,146,60,0.12)',color:'#fb923c',border:'rgba(251,146,60,0.25)'},
  };

  /* ═══════ i18n & Theme ═══════ */
  var _kwLang = (function() { try { var v = localStorage.getItem('html-gen:kw_lang'); return (v === 'zh' || v === 'en') ? v : 'zh'; } catch(e) { return 'zh'; } })();
  document.getElementById('kwLangZh').classList.toggle('active', _kwLang === 'zh');
  document.getElementById('kwLangEn').classList.toggle('active', _kwLang === 'en');

  window.setKwLang = function(lang) {
    if (lang !== 'zh' && lang !== 'en') return;
    _kwLang = lang;
    try { localStorage.setItem('html-gen:kw_lang', lang); } catch(e) {}
    document.getElementById('kwLangZh').classList.toggle('active', lang === 'zh');
    document.getElementById('kwLangEn').classList.toggle('active', lang === 'en');
    updateSub();
  };

  var _kwTheme = (function() { try { return localStorage.getItem('html-gen:kw_theme') || 'dark'; } catch(e) { return 'dark'; } })();
  if (_kwTheme === 'light') document.documentElement.classList.add('light');
  document.getElementById('kwThemeBtn').textContent = _kwTheme === 'light' ? '☀️' : '🌙';

  window.toggleKwTheme = function() {
    var r = document.documentElement;
    var isLight = !r.classList.contains('light');
    r.classList.toggle('light', isLight);
    try { localStorage.setItem('html-gen:kw_theme', isLight ? 'light' : 'dark'); } catch(e) {}
    document.getElementById('kwThemeBtn').textContent = isLight ? '☀️' : '🌙';
  };

  function updateSub() {
    var sub = document.querySelector('.kw-sidebar-header .sub');
    if (sub) {
      var base = (sub.textContent || '').replace(/\s*共\s+\d+\s*条目.*/, '').trim();
      var label = _kwLang === 'en' ? ' items' : ' 条目';
      sub.textContent = (base ? base + ' · ' : '') + '共 ' + ITEMS.length + label;
    }
  }
  updateSub();

  // Title click → copy path
  document.querySelector('.kw-sidebar-header .sidebar-title').addEventListener('click', function() {
    var m = this.title.match(/路径:\s*(.+)/);
    var path = m ? m[1].trim() : window.location.href.split('?')[0];
    if (/^(https?:|\/|~\/)/.test(path)) {
      try { navigator.clipboard.writeText(path).catch(function(){}); } catch(e) {}
      showKwToast('已复制: ' + path);
    }
  });

  function showKwToast(msg) {
    var el = document.getElementById('kwToast');
    if (!el) { el = document.createElement('div'); el.id = 'kwToast'; el.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:8px 20px;background:var(--cobalt-950);color:#e0e0e0;border-radius:8px;font-size:0.78rem;z-index:9999;border:1px solid var(--cobalt-700);opacity:0;transition:opacity 0.2s;white-space:nowrap;pointer-events:none'; document.body.appendChild(el); }
    el.textContent = msg; el.style.opacity = '1';
    clearTimeout(el._hide); el._hide = setTimeout(function() { el.style.opacity = '0'; }, 2500);
  }

  // ── Render tabs ──
  function renderTabs() {
    var bar = document.getElementById('kwTabBar');
    bar.innerHTML = (GROUPS || []).map(function(g, i) {
      var c = COLORS[i % COLORS.length];
      return '<div class="kw-tab' + (g.key === activeGroup ? ' active' : '') + '" data-key="' + g.key + '" onclick="switchGroup(\'' + g.key + '\')">' +
        (g.icon ? '<span class="kw-tab-icon">' + g.icon + '</span>' : '<span class="kw-tab-icon" style="color:' + c + '">●</span>') +
        g.label + '</div>';
    }).join('');
    renderSidebar();
  }

  window.switchGroup = function(key) {
    activeGroup = key;
    try { localStorage.setItem('html-gen:kw_group', key); } catch(e) {}
    document.querySelectorAll('.kw-tab').forEach(function(t) { t.classList.toggle('active', t.dataset.key === key); });
    renderSidebar();
    var firstItem = ITEMS.find(function(i) { return i.group === key; });
    if (firstItem) selectItem(activeGroup, firstItem.title);
  };

  // ── Render sidebar sections ──
  function renderSidebar() {
    var container = document.getElementById('kwSectionsContainer');
    var groupItems = ITEMS.filter(function(item) { return item.group === activeGroup; });
    var sections = {};
    groupItems.forEach(function(item) {
      var sec = item.section || item.group || 'default';
      if (!sections[sec]) sections[sec] = [];
      sections[sec].push(item);
    });
    var html = '';
    var keys = Object.keys(sections);
    keys.forEach(function(sec) {
      var ci = GROUPS.findIndex(function(g) { return g.key === activeGroup; });
      var c = COLORS[Math.max(0, ci) % COLORS.length];
      if (keys.length > 1) html += '<div class="kw-section-title" onclick="selectSection(\'' + activeGroup.replace(/'/g,"\\'") + '\',\'' + sec.replace(/'/g,"\\'") + '\')"><span class="dot" style="background:' + c + '"></span>' + sec + '</div>';
      // Single-item section matching section name: skip kw-item row (section title itself is the click target)
      var isSingleItem = sections[sec].length === 1 && sections[sec][0].title === sec;
      if (!isSingleItem) {
        sections[sec].forEach(function(item) {
        var badgeHtml = '';
        if (item.badge) {
          var bc = BADGE_COLORS[item.badge] || {bg:'rgba(255,255,255,0.04)',color:'#6b7280',border:'transparent'};
          badgeHtml = '<span class="kw-item-badge" style="background:'+bc.bg+';color:'+bc.color+';border:1px solid '+bc.border+'">'+item.badge+'</span>';
        }
        html += '<div class="kw-item" onclick="selectItem(\'' + activeGroup.replace(/'/g,"\\'") + '\',\'' + item.title.replace(/'/g,"\\'") + '\')"><span class="kw-item-text">' + item.title + '</span>' + badgeHtml + '</div>';
      });
      }
    });
    container.innerHTML = html || '<div style="padding:20px;text-align:center;color:#6b7280;font-size:0.78rem;">暂无内容</div>';
  }

  // ── Select section (click section title) ──
  window.selectSection = function(group, sec) {
    var item = ITEMS.find(function(i) { return i.group === group && i.section === sec; });
    if (!item) return;
    selectItem(group, item.title);
  };

  // ── Select item ──
  window.selectItem = function(group, title) {
    activeItem = title;
    try { localStorage.setItem('html-gen:kw_item', title); } catch(e) {}
    document.querySelectorAll('.kw-item').forEach(function(el) { el.classList.toggle('active', el.querySelector('.kw-item-text').textContent === title); });
    var item = ITEMS.find(function(i) { return i.group === group && i.title === title; });
    if (!item) return;
    document.getElementById('welcomePanel').classList.remove('active');
    document.getElementById('frameWrap').classList.add('active');
    var body = document.getElementById('kwBody'), frame = document.getElementById('contentFrame');
    if (item.url) { body.style.display = 'none'; frame.style.display = 'block'; frame.src = item.url + (item.url.indexOf('?') !== -1 ? '&' : '?') + 'sidebar=0&toolbar=0&t=' + Date.now(); }
    else if (item.desc) { frame.style.display = 'none'; body.style.display = 'block'; body.innerHTML = '<div style="color:#e0e0e0;line-height:1.8;font-size:0.88rem;">' + item.desc.replace(/\n/g,'<br>') + '</div>'; }
    else { frame.style.display = 'none'; body.style.display = 'block'; body.innerHTML = '<div style="color:#6b7280;text-align:center;padding:40px;">请配置 desc 内容</div>'; }
  };

  function renderLegend() {
    var el = document.getElementById('wLegend');
    el.innerHTML = (GROUPS || []).map(function(g, i) { var c = COLORS[i % COLORS.length]; return '<span class="w-legend-item"><span class="ldot" style="background:' + c + '"></span> ' + g.label + '</span>'; }).join('');
  }

  // Restore last state
  var savedGroup = localStorage.getItem('html-gen:kw_group');
  var savedItem = localStorage.getItem('html-gen:kw_item');
  if (savedGroup && savedItem) {
    var exists = ITEMS.some(function(i) { return i.group === savedGroup && i.title === savedItem; });
    if (exists) { activeGroup = savedGroup; renderTabs(); setTimeout(function() { selectItem(savedGroup, savedItem); }, 50); return; }
  }
  renderTabs();
  renderLegend();

  /* ═══════ Sidebar Collapse ═══════ */
  var _collapsed = false;
  window.toggleSidebar = function() {
    _collapsed = !_collapsed;
    var sb = document.getElementById('kwSidebar'), btn = document.getElementById('collapseBtn');
    if (sb) sb.classList.toggle('collapsed', _collapsed);
    if (btn) btn.textContent = _collapsed ? '▶▶' : '◀◀';
    try { localStorage.setItem('html-gen:kw:collapsed', _collapsed); } catch(e) {}
  };
  try { if (localStorage.getItem('html-gen:kw:collapsed') === 'true') toggleSidebar(); } catch(e) {}

  document.addEventListener('keydown', function(e) {
    if (e.key === '[' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA' && document.activeElement.tagName !== 'IFRAME') {
      if (!e.metaKey && !e.ctrlKey) { e.preventDefault(); toggleSidebar(); }
    }
  });

  /* ── Sidebar Search ── */
  var _kwSearchActive = false, _kwSearchTimer;
  window.toggleKwSearch = function() {
    _kwSearchActive = !_kwSearchActive;
    var wrap = document.getElementById('kwSearchWrap');
    var input = document.getElementById('kwSearchInput');
    var btn = document.getElementById('kwSearchBtn');
    if (wrap) wrap.classList.toggle('active', _kwSearchActive);
    if (btn) btn.style.color = _kwSearchActive ? 'var(--cobalt-400)' : '';
    if (_kwSearchActive) {
      setTimeout(function() { input.focus(); input.select(); }, 50);
    } else {
      input.value = '';
      doKwFilter('');
    }
  };

  function doKwFilter(q) {
    var items = document.querySelectorAll('.kw-item');
    var titles = document.querySelectorAll('.kw-section-title');
    var hasMatch = false;
    items.forEach(function(el) {
      var text = (el.querySelector('.kw-item-text') || {}).textContent || '';
      var match = q.length < 2 || text.toLowerCase().indexOf(q) !== -1;
      el.classList.toggle('filtered-out', !match);
      if (match) hasMatch = true;
    });
    // Hide section titles if all their items are filtered out
    titles.forEach(function(title) {
      var next = title.nextElementSibling;
      var allHidden = true;
      while (next && !next.classList.contains('kw-section-title')) {
        if (!next.classList.contains('filtered-out')) { allHidden = false; break; }
        next = next.nextElementSibling;
      }
      title.classList.toggle('filtered-out', allHidden);
    });
  }

  document.getElementById('kwSearchInput').addEventListener('input', function() {
    var q = this.value.toLowerCase().trim();
    clearTimeout(_kwSearchTimer);
    _kwSearchTimer = setTimeout(function() { doKwFilter(q); }, 150);
  });

  document.getElementById('kwSearchInput').addEventListener('keydown', function(e) {
    if (e.key === 'Escape') { _kwSearchActive = true; toggleKwSearch(); }
    else if (e.key === 'Enter') {
      var firstVisible = document.querySelector('.kw-item:not(.filtered-out)');
      if (firstVisible) firstVisible.click();
      _kwSearchActive = true; toggleKwSearch();
    }
  });

  // Click away to close
  document.addEventListener('click', function(e) {
    if (_kwSearchActive && !e.target.closest('.kw-search-wrap') && e.target !== document.getElementById('kwSearchBtn')) {
      _kwSearchActive = true; toggleKwSearch();
    }
  });

  /* ── Sidebar Resize ── */
  (function() {
    var sb = document.getElementById('kwSidebar');
    var handle = document.getElementById('kwSbResize');
    var dragging = false;
    handle.addEventListener('mousedown', function(e) {
      e.preventDefault();
      dragging = true;
      handle.classList.add('active');
    });
    document.addEventListener('mousemove', function(e) {
      if (!dragging) return;
      var w = e.clientX;
      w = Math.max(200, Math.min(400, w));
      sb.style.width = w + 'px';
      sb.style.minWidth = w + 'px';
    });
    document.addEventListener('mouseup', function() {
      if (dragging) {
        dragging = false;
        handle.classList.remove('active');
        try { localStorage.setItem('html-gen:kw:sidebar-width', sb.style.width); } catch(e) {}
      }
    });
    try { var sw = localStorage.getItem('html-gen:kw:sidebar-width'); if (sw) { sb.style.width = sw; sb.style.minWidth = sw; } } catch(e) {}
  })();
})();
</script>
</body>
</html>
