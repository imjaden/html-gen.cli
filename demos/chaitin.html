:root.light .kw-spot-desc { color: #777; }
:root.light .kw-spot-hint { border-color: #eee; color: #999; }
:root.light .kw-welcome .w-title { color: #333; }

/* ── Main ── */
.kw-main { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }

/* ── Tab Bar (aligned with sidebar title) ── */
.kw-tab-bar {
  height: 48px; min-height: 48px;
  display: flex; align-items: stretch;
  background: var(--surface-900);
  border-bottom: 1px solid #2a2a3e;
  overflow-x: auto; overflow-y: hidden;
  flex-shrink: 0;
}
.kw-tab-bar::-webkit-scrollbar { height: 0; }
.kw-tab {
  display: flex; align-items: center; gap: 6px;
  padding: 0 20px; cursor: pointer; white-space: nowrap;
  font-size: 0.82rem; font-weight: 500;
  color: #9ca3af; border-bottom: 2px solid transparent;
  transition: all 0.15s; flex-shrink: 0; user-select: none;
}
.kw-tab:hover { background: rgba(79,70,229,0.04); color: #e0e0e0; }
.kw-tab.active { color: var(--cobalt-400); border-bottom-color: var(--cobalt-600); }
.kw-tab .kw-tab-icon { font-size: 0.9rem; }

/* ── Content area ── */
.kw-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--surface-950); }
.kw-body { flex: 1; overflow-y: auto; padding: 24px 32px; }

/* ── Welcome ── */
.kw-welcome { display: none; flex: 1; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 40px 20px; text-align: center; }
.kw-welcome.active { display: flex; }
.kw-welcome .w-title { font-size: 1.3rem; font-weight: 700; color: #e0e0e0; }
.kw-welcome .w-sub { font-size: 0.85rem; color: #6b7280; max-width: 440px; line-height: 1.7; }
.kw-welcome .w-legend { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
.kw-welcome .w-legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.78rem; color: #9ca3af; }
.kw-welcome .w-legend-item .ldot { width: 8px; height: 8px; border-radius: 50%; }

/* ── Content iframe ── */
.kw-frame-wrap { display: none; flex: 1; flex-direction: column; }
.kw-frame-wrap.active { display: flex; }
.kw-frame-wrap iframe { width: 100%; flex: 1; border: none; background: var(--surface-950); }

@media (max-width: 768px) {
  .kw-sidebar { display: none; position: fixed; top: 0; left: 0; width: 260px; height: 100vh; z-index: 100; }
  .kw-sidebar.open { display: flex; box-shadow: 4px 0 20px rgba(0,0,0,0.5); }
  .kw-body { padding: 16px; }
}

@media print {
  .kw-sidebar, .kw-tab-bar, .kw-toolbar, .github-corner, .github-corner-hit, .home-link { display: none !important; }
  .kw-body { color: #000; }
  .kw-welcome { display: none !important; }
  body { background: #fff; }
}

/* ── GitHub Corner ── */
.github-corner { position: fixed; top: 0; right: 0; z-index: 950; color: #9ca3af; pointer-events: none; }
.github-corner-hit { position: fixed; top: 36px; right: 0; width: 36px; height: 36px; z-index: 951; cursor: pointer; }
.github-corner:hover .octo-arm { animation: octocat-wave 560ms ease-in-out; }
@keyframes octocat-wave { 0%,100%{transform:rotate(0)} 20%,60%{transform:rotate(-25deg)} 40%,80%{transform:rotate(10deg)} }
  .home-link { position: fixed; top: 84px; right: 12px; z-index: 949; width: 36px; height: 36px; border-radius: 8px; background: rgba(0,0,0,0.41); display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 1rem; }
  .home-link:hover { background: rgba(0,0,0,0.6); }
  
.kw-sidebar::-webkit-scrollbar { width: 4px; }
.kw-sidebar::-webkit-scrollbar-thumb { background: #2a2a3e; border-radius: 2px; }
</style>

<script>
(function() {
  const GROUPS = [{"key": "公司概况", "label": "公司概况", "icon": "🏢"}, {"key": "产品体系", "label": "产品体系", "icon": "🧩"}, {"key": "经营分析", "label": "经营分析", "icon": "📊"}, {"key": "开源生态", "label": "开源生态", "icon": "🔧"}];  // [{key, label, icon}]
  const ITEMS  = [{"title": "公司画像", "group": "公司概况", "section": "概述", "badge": "概览", "url": "chaitin/company-profile.html"}, {"title": "发展历程", "group": "公司概况", "section": "概述", "badge": "深度", "url": "chaitin/company-history.html"}, {"title": "市场估值", "group": "公司概况", "section": "概述", "badge": "数据", "url": "chaitin/market-valuation.html"}, {"title": "产品矩阵", "group": "产品体系", "section": "产品", "badge": "概览", "url": "chaitin/product-matrix.html"}, {"title": "产品架构", "group": "产品体系", "section": "产品", "badge": "深度", "url": "chaitin/product-architecture.html"}, {"title": "产品清单", "group": "产品体系", "section": "产品", "badge": "深度", "url": "chaitin/product-list.html"}, {"title": "商业模式", "group": "经营分析", "section": "经营能力", "badge": "深度", "url": "chaitin/business-model.html"}, {"title": "竞争格局", "group": "经营分析", "section": "经营能力", "badge": "对比", "url": "chaitin/competitive-landscape.html"}, {"title": "发展前景", "group": "经营分析", "section": "经营能力", "badge": "深度", "url": "chaitin/development-outlook.html"}, {"title": "开源概览", "group": "开源生态", "section": "开源影响力", "badge": "深度", "url": "chaitin/open-source-overview.html"}, {"title": "项目清单", "group": "开源生态", "section": "开源影响力", "badge": "数据", "url": "chaitin/top-projects.html"}, {"title": "社区生态", "group": "开源生态", "section": "开源影响力", "badge": "概览", "url": "chaitin/community-placeholder.html"}];   // [{title, group, section?, badge?, url?, desc?, page_title?}]  page_title = 侧栏 tooltip 全名（缺省用 title）

  let activeGroup = GROUPS.length > 0 ? GROUPS[0].key : '';
  let activeItem = null;
  const COLORS = ['#38bdf8','#34d399','#c084fc','#fb923c','#f472b6','#fbbf24','#818cf8'];
  const BADGE_COLORS = {
    '知道':{bg:'rgba(56,189,248,0.12)',color:'#38bdf8',border:'rgba(56,189,248,0.25)'},
    '理解':{bg:'rgba(52,211,153,0.12)',color:'#34d399',border:'rgba(52,211,153,0.25)'},
    '能讲':{bg:'rgba(192,132,252,0.12)',color:'#c084fc',border:'rgba(192,132,252,0.25)'},
    '能输出':{bg:'rgba(251,146,60,0.12)',color:'#fb923c',border:'rgba(251,146,60,0.25)'},
  };

  /* ═══════ i18n & Theme ═══════ */
  var _kwLang = (function() { try { var v = localStorage.getItem('html-gen:kw_lang'); return (v === 'zh' || v === 'en') ? v : 'zh'; } catch(e) { return 'zh'; } })();
  document.getElementById('kwLangZh').classList.toggle('active', _kwLang === 'zh');
  document.getElementById('kwLangEn').classList.toggle('active', _kwLang === 'en');

  window.setKwLang = function(lang) {
    if (lang !== 'zh' && lang !== 'en') return;
    _kwLang = lang;
    try { localStorage.setItem('html-gen:kw_lang', lang); } catch(e) {}
    document.getElementById('kwLangZh').classList.toggle('active', lang === 'zh');
    document.getElementById('kwLangEn').classList.toggle('active', lang === 'en');
    updateSub();
  };

  var _kwTheme = (function() { try { return localStorage.getItem('html-gen:kw_theme') || 'dark'; } catch(e) { return 'dark'; } })();
  if (_kwTheme === 'light') document.documentElement.classList.add('light');
  document.getElementById('kwThemeBtn').textContent = _kwTheme === 'light' ? '☀️' : '🌙';

  window.toggleKwTheme = function() {
    var r = document.documentElement;
    var isLight = !r.classList.contains('light');
    r.classList.toggle('light', isLight);
    try { localStorage.setItem('html-gen:kw_theme', isLight ? 'light' : 'dark'); } catch(e) {}
    document.getElementById('kwThemeBtn').textContent = isLight ? '☀️' : '🌙';
  };

  function updateSub() {
    var sub = document.querySelector('.kw-sidebar-header .sub');
    if (sub) {
      var base = (sub.textContent || '').replace(/\s*共\s+\d+\s*条目.*/, '').trim();
      var label = _kwLang === 'en' ? ' items' : ' 条目';
      sub.textContent = (base ? base + ' · ' : '') + '共 ' + ITEMS.length + label;
    }
  }
  updateSub();

  // CL047: 标题点击 → 回知识库根页（复制路径迁到 ⧉ 按钮）
  document.querySelector('.kw-sidebar-header .sidebar-title').addEventListener('click', function() {
    kwGoRoot();
  });
  // 复制页面路径（CL047：标题点击改为回根页，复制迁到 ⧉ 按钮；保留 D10 的路径闸门与 toast 解析链）
  var _copyBtn = document.getElementById('kwCopyPathBtn');
  if (_copyBtn) _copyBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    var el = document.querySelector('.kw-sidebar-header .sidebar-title');
    var m = el && el.title ? el.title.match(/路径:\s*(.+)/) : null;
    var target = m ? m[1].trim() : decodeURI(window.location.href);
    if (/^(https?:|\/|~\/|[\w.\- ]+$)/.test(target)) {
      copyText(target, '已复制: ' + target);
    }
  });

  function showKwToast(msg) {
    var el = document.getElementById('kwToast');
    if (!el) { el = document.createElement('div'); el.id = 'kwToast'; el.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:8px 20px;background:var(--cobalt-950);color:#e0e0e0;border-radius:8px;font-size:0.78rem;z-index:9999;border:1px solid var(--cobalt-700);opacity:0;transition:opacity 0.2s;white-space:nowrap;pointer-events:none'; document.body.appendChild(el); }
    el.textContent = msg; el.style.opacity = '1';
    clearTimeout(el._hide); el._hide = setTimeout(function() { el.style.opacity = '0'; }, 2500);
  }

  /* ═══════ html-gen:clipboard-copy v1 BEGIN —— canonical, 四模板逐字节一致, 守卫测试锁定 ═══════ */
  function copyText(text, okMsg, failMsg, onOk) {
    var _toast = (typeof showToast === 'function') ? showToast
      : (typeof showKwToast === 'function') ? showKwToast
      : function (m) { try { console.log('[html-gen] ' + m); } catch (e) {} };
    var done = function () { if (onOk) onOk(); if (okMsg) _toast(okMsg); };
    var fail = function () { _toast(failMsg || '复制失败，请手动选中文本复制'); };
    var fallback = function () {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:-1000px;left:-1000px;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      if (ok) { done(); } else { fail(); }
    };
    if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done).catch(fallback);
    } else {
      fallback();                       /* 非安全上下文 ⇒ 直接回退, 不得依赖 catch */
    }
  }
  /* ═══════ html-gen:clipboard-copy v1 END ═══════ */

  // ── Render tabs ──
  function renderTabs() {
    var bar = document.getElementById('kwTabBar');
    bar.innerHTML = (GROUPS || []).map(function(g, i) {
      var c = COLORS[i % COLORS.length];
      return '<div class="kw-tab' + (g.key === activeGroup ? ' active' : '') + '" data-key="' + g.key + '" onclick="switchGroup(\'' + g.key + '\')">' +
        (g.icon ? '<span class="kw-tab-icon">' + g.icon + '</span>' : '<span class="kw-tab-icon" style="color:' + c + '">●</span>') +
        g.label + '</div>';
    }).join('');
    renderSidebar();
  }

  // CL047: 页签切换只切类目并回根页（不再自动选首条，否则根页地图永远看不到）
  window.switchGroup = function(key) { activateGroup(key); kwGoRoot(); };

  // 只切类目（面板结果跨组跳转复用，不触发回根页）
  function activateGroup(key) {
    if (!key || key === activeGroup) return;
    activeGroup = key;
    try { localStorage.setItem('html-gen:kw_group', key); } catch(e) {}
    document.querySelectorAll('.kw-tab').forEach(function(t) { t.classList.toggle('active', t.dataset.key === key); });
    renderSidebar();
  }

  // ── Render sidebar sections ──
  // 侧栏条目文本是 ellipsis 单行：超宽名字只剩前缀 ⇒ 用 title 属性兜住全名（悬停可见）。
  // 值优先取 page_title（消费方可给「全名/短名」两套），缺省回退 title。
  function escAttr(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/"/g, '&quot;')
      .replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function renderSidebar() {
    var container = document.getElementById('kwSectionsContainer');
    var groupItems = ITEMS.filter(function(item) { return item.group === activeGroup; });
    var sections = {};
    groupItems.forEach(function(item) {
      var sec = item.section || item.group || 'default';
      if (!sections[sec]) sections[sec] = [];
      sections[sec].push(item);
    });
    var html = '';
    var keys = Object.keys(sections);
    keys.forEach(function(sec) {
      var ci = GROUPS.findIndex(function(g) { return g.key === activeGroup; });
      var c = COLORS[Math.max(0, ci) % COLORS.length];
      if (keys.length > 1) {
        var secIcon = sections[sec][0] && sections[sec][0].section_icon;
        html += '<div class="kw-section-title" onclick="selectSection(\'' + activeGroup.replace(/'/g,"\\'") + '\',\'' + sec.replace(/'/g,"\\'") + '\')">' +
          (secIcon ? '<span class="kw-section-icon">' + secIcon + '</span>' : '<span class="dot" style="background:' + c + '"></span>') + sec + '</div>';
      }
      // Single-item section matching section name: skip kw-item row (section title itself is the click target)
      var isSingleItem = sections[sec].length === 1 && sections[sec][0].title === sec;
      if (!isSingleItem) {
        sections[sec].forEach(function(item) {
        var badgeHtml = '';
        if (item.badge) {
          var bc = BADGE_COLORS[item.badge] || {bg:'rgba(255,255,255,0.04)',color:'#6b7280',border:'transparent'};
          badgeHtml = '<span class="kw-item-badge" style="background:'+bc.bg+';color:'+bc.color+';border:1px solid '+bc.border+'">'+item.badge+'</span>';
        }
        html += '<div class="kw-item" onclick="selectItem(\'' + activeGroup.replace(/'/g,"\\'") + '\',\'' + item.title.replace(/'/g,"\\'") + '\')"><span class="kw-item-text" title="' + escAttr(item.page_title || item.title) + '">' + item.title + '</span>' + badgeHtml + '</div>';
      });
      }
    });
    container.innerHTML = html || '<div style="padding:20px;text-align:center;color:#6b7280;font-size:0.78rem;">暂无内容</div>';
  }

  // ── Select section (click section title) ──
  window.selectSection = function(group, sec) {
    var item = ITEMS.find(function(i) { return i.group === group && i.section === sec; });
    if (!item) return;
    selectItem(group, item.title);
  };

  // ── Select item ──
  // URL 参数同步（拷贝 URL 可定位指定页签/条目）
  function syncUrl() {
    try {
      var u = new URL(window.location.href);
      if (activeGroup) u.searchParams.set('group', activeGroup);
      else u.searchParams.delete('group');
      if (activeItem && ITEMS.some(function(i){ return i.group === activeGroup && i.title === activeItem; }))
        u.searchParams.set('item', activeItem);
      else u.searchParams.delete('item');
      history.replaceState(null, '', u.toString());
    } catch(e) {}
  }

  window.selectItem = function(group, title) {
    activeItem = title;
    try { localStorage.setItem('html-gen:kw_item', title); } catch(e) {}
    document.querySelectorAll('.kw-item').forEach(function(el) { el.classList.toggle('active', el.querySelector('.kw-item-text').textContent === title); });
    var item = ITEMS.find(function(i) { return i.group === group && i.title === title; });
    if (!item) return;
    // 高亮所属 section（section-as-menu 单 item 模式无 kw-item 行，靠 section-title 呈现）
    var secName = item.section || item.title;
    document.querySelectorAll('.kw-section-title').forEach(function(el) {
      el.classList.toggle('active', el.textContent.indexOf(secName) !== -1);
    });
    document.getElementById('welcomePanel').classList.remove('active');
    document.getElementById('frameWrap').classList.add('active');
    var body = document.getElementById('kwBody'), frame = document.getElementById('contentFrame');
    if (item.url) { body.style.display = 'none'; frame.style.display = 'block';
      // CL018: 条目级宽度声明 width=narrow|medium|wide（缺省 medium；url 含 overview 时默认 wide）
      var _rxW = (item.width === 'narrow' || item.width === 'medium' || item.width === 'wide') ? item.width
               : (item.url.indexOf('overview') !== -1 ? 'wide' : '');
      frame.src = item.url + (item.url.indexOf('?') !== -1 ? '&' : '?') + (_rxW ? 'width=' + _rxW + '&' : '') + 'sidebar=0&toolbar=0&t=' + Date.now(); }
    else if (item.desc) { frame.style.display = 'none'; body.style.display = 'block'; body.innerHTML = '<div style="color:#e0e0e0;line-height:1.8;font-size:0.88rem;">' + item.desc.replace(/\n/g,'<br>') + '</div>'; }
    else { frame.style.display = 'none'; body.style.display = 'block'; body.innerHTML = '<div style="color:#6b7280;text-align:center;padding:40px;">请配置 desc 内容</div>'; }
    syncUrl();
  };

  function renderLegend() {
    var el = document.getElementById('wLegend');
    el.innerHTML = (GROUPS || []).map(function(g, i) { var c = COLORS[i % COLORS.length]; return '<span class="w-legend-item"><span class="ldot" style="background:' + c + '"></span> ' + g.label + '</span>'; }).join('');
  }

  // Restore last state: URL 参数优先 > localStorage > 默认
  var urlParams = new URLSearchParams(location.search);
  var savedGroup = urlParams.get('group') || localStorage.getItem('html-gen:kw_group');
  var savedItem = urlParams.get('item') || localStorage.getItem('html-gen:kw_item');
  var forceRoot = urlParams.get('view') === 'root';       // CL047: 显式要求根页
  var groupValid = savedGroup && GROUPS.some(function(g) { return g.key === savedGroup; });
  var itemValid = savedItem && ITEMS.some(function(i) { return i.group === savedGroup && i.title === savedItem; });
  if (groupValid) {
    activeGroup = savedGroup; renderTabs();
    if (itemValid && !forceRoot) { setTimeout(function() { selectItem(savedGroup, savedItem); }, 50); }
    else { renderSidebar(); renderLegend(); }  // 仅恢复页签（根页）
  } else {
    renderTabs();
    renderLegend();
  }
  renderMap();                                   // CL047: 根页菜单地图

  /* ═══════ Sidebar Collapse ═══════ */
  var _collapsed = false;
  window.toggleSidebar = function() {
    _collapsed = !_collapsed;
    var sb = document.getElementById('kwSidebar'), btn = document.getElementById('collapseBtn');
    if (sb) sb.classList.toggle('collapsed', _collapsed);
    if (btn) btn.textContent = _collapsed ? '▶▶' : '◀◀';
    try { localStorage.setItem('html-gen:kw:collapsed', _collapsed); } catch(e) {}
  };
  try { if (localStorage.getItem('html-gen:kw:collapsed') === 'true') toggleSidebar(); } catch(e) {}

  document.addEventListener('keydown', function(e) {
    if (e.key === '[' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA' && document.activeElement.tagName !== 'IFRAME') {
      if (!e.metaKey && !e.ctrlKey) { e.preventDefault(); toggleSidebar(); }
    }
  });

  /* ═══════ CL047: 根页状态机 ═══════ */
  window.kwGoRoot = function() {
    activeItem = null;
    try { localStorage.removeItem('html-gen:kw_item'); } catch(e) {}
    document.querySelectorAll('.kw-item').forEach(function(el) { el.classList.remove('active'); });
    document.querySelectorAll('.kw-section-title').forEach(function(el) { el.classList.remove('active'); });
    var wp = document.getElementById('welcomePanel');
    if (wp) wp.classList.add('active');
    var fw = document.getElementById('frameWrap');
    if (fw) fw.classList.remove('active');
    var body = document.getElementById('kwBody'), frame = document.getElementById('contentFrame');
    if (body) { body.style.display = 'none'; body.innerHTML = ''; }
    if (frame) { frame.style.display = 'none'; frame.src = 'about:blank'; }
    syncUrl();
  };

  /* ═══════ CL047: 根页菜单地图（列 = 页签，行 = section） ═══════ */
  function escHtml(s) { return escAttr(s); }

  function renderMap() {
    var el = document.getElementById('kwMap');
    if (!el) return;
    var groups = GROUPS || [];
    if (!groups.length || !ITEMS.length) { el.innerHTML = ''; return; }
    var rows = [], cell = {}, i, j;
    for (i = 0; i < ITEMS.length; i++) {
      var sec0 = ITEMS[i].section || ITEMS[i].group || 'default';
      if (rows.indexOf(sec0) === -1) rows.push(sec0);
    }
    for (j = 0; j < ITEMS.length; j++) {
      var it = ITEMS[j];
      var sec = it.section || it.group || 'default';
      if (!cell[sec]) cell[sec] = {};
      if (!cell[sec][it.group]) cell[sec][it.group] = [];
      cell[sec][it.group].push(it);
    }
    var html = '<table class="kw-map-table"><thead><tr><th>章节 \\ 类目</th>';
    groups.forEach(function(g) {
      html += '<th>' + (g.icon ? '<span class="kw-map-gicon">' + escHtml(g.icon) + '</span>' : '') +
        escHtml(g.label || g.key) + '</th>';
    });
    html += '</tr></thead><tbody>';
    rows.forEach(function(rowSec) {
      html += '<tr><th>' + escHtml(rowSec) + '</th>';
      groups.forEach(function(g) {
        var list = (cell[rowSec] || {})[g.key] || [];
        if (!list.length) { html += '<td class="kw-map-empty">—</td>'; return; }
        html += '<td>' + list.map(function(it2) {
          var b = '';
          if (it2.badge) {
            var bc = BADGE_COLORS[it2.badge] || {bg:'rgba(255,255,255,0.04)',color:'#6b7280',border:'transparent'};
            b = '<span class="kw-item-badge" style="background:' + bc.bg + ';color:' + bc.color +
                ';border:1px solid ' + bc.border + '">' + escHtml(it2.badge) + '</span>';
          }
          return '<button type="button" class="kw-map-item" data-group="' + escAttr(g.key) +
                 '" data-title="' + escAttr(it2.title) + '">' + escHtml(it2.title) + b + '</button>';
        }).join('') + '</td>';
      });
      html += '</tr>';
    });
    html += '</tbody></table>';
    el.innerHTML = html;
    el.querySelectorAll('.kw-map-item').forEach(function(btn) {
      btn.addEventListener('click', function() {
        activateGroup(this.dataset.group);
        selectItem(this.dataset.group, this.dataset.title);
      });
    });
    var wp = document.getElementById('welcomePanel');
    if (wp) wp.classList.add('has-map');
  }

  /* ═══════ CL047: 统一搜索面板（Spotlight，与 tool-nav-manager 同构） ═══════
     入口 = ⌘/Ctrl+K 与 🔍 按钮；**不拦 ⌘F**（浏览器原生查找保留）。
     匹配面 = 条目标题 / 副标题(section) / 描述(desc) / 全名(page_title) / 分组。 */
  var _spotOpen = false, _spotSel = -1, _spotList = [];

  function spotRow(it) {
    var g = (GROUPS || []).filter(function(x) { return x.key === it.group; })[0] || {};
    return { title: it.title || '', group: it.group || '', section: it.section || '',
             desc: it.desc || '', page_title: it.page_title || '',
             groupLabel: g.label || it.group || '', badge: it.badge || '' };
  }

  function querySpot(q) {
    if (!q) return [];
    var out = [];
    ITEMS.forEach(function(it, i) {
      var r = spotRow(it);
      var t = r.title.toLowerCase(), s = r.section.toLowerCase(), d = r.desc.toLowerCase(),
          p = r.page_title.toLowerCase(), gtxt = (r.groupLabel + ' ' + r.group).toLowerCase();
      var score = 0;
      if (t.indexOf(q) === 0) score = 100;                       // 标题前缀
      else if (t.indexOf(q) !== -1) score = 80;                  // 标题包含
      else if (p.indexOf(q) !== -1) score = 60;                  // 全名/tooltip
      else if (s.indexOf(q) !== -1) score = 40;                  // 副标题
      else if (gtxt.indexOf(q) !== -1) score = 20;                  // 分组
      else if (d.indexOf(q) !== -1) score = 10;                  // 描述
      if (score) out.push({ r: r, score: score, i: i });
    });
    out.sort(function(a, b) { return b.score - a.score || a.i - b.i; });
    return out.map(function(x) { return x.r; });
  }

  // 命中片段高亮：先转义再插 <mark>，禁止 innerHTML 直插原文
  function hl(text, q) {
    var s = String(text == null ? '' : text);
    if (!q) return escAttr(s);
    var at = s.toLowerCase().indexOf(q);
    if (at < 0) return escAttr(s);
    return escAttr(s.slice(0, at)) + '<mark class="kw-mark">' +
           escAttr(s.slice(at, at + q.length)) + '</mark>' + escAttr(s.slice(at + q.length));
  }

  function spotBadge(badge) {
    if (!badge) return '';
    var bc = BADGE_COLORS[badge] || {bg:'rgba(255,255,255,0.04)',color:'#6b7280',border:'transparent'};
    return '<span class="kw-item-badge" style="background:' + bc.bg + ';color:' + bc.color +
           ';border:1px solid ' + bc.border + ';margin-left:6px;">' + escHtml(badge) + '</span>';
  }

  function renderSpot(q) {
    var box = document.getElementById('kwSpotResults');
    if (!box) return;
    if (!q) {
      _spotList = []; _spotSel = -1;
      box.innerHTML = '<div class="kw-spot-empty">输入关键词开始搜索<br>范围：条目标题 · 副标题 · 描述 · 分组</div>';
      return;
    }
    _spotList = querySpot(q);
    if (!_spotList.length) {
      _spotSel = -1;
      box.innerHTML = '<div class="kw-spot-empty">没有匹配的条目<br>试试更短的关键词</div>';
      return;
    }
    _spotSel = 0;
    box.innerHTML = _spotList.map(function(r, i) {
      var meta = r.groupLabel + (r.section ? ' · ' + r.section : '');
      return '<button type="button" class="kw-spot-item" data-group="' + escAttr(r.group) +
        '" data-title="' + escAttr(r.title) + '"' + (i === 0 ? ' data-sel="1"' : '') + '>' +
        '<div class="kw-spot-title">' + hl(r.title, q) + spotBadge(r.badge) + '</div>' +
        '<div class="kw-spot-meta">' + hl(meta, q) + '</div>' +
        (r.desc ? '<div class="kw-spot-desc">' + hl(r.desc, q) + '</div>' : '') +
        '</button>';
    }).join('');
    box.querySelectorAll('.kw-spot-item').forEach(function(btn) {
      btn.addEventListener('click', function() { openSpotResult(this.dataset.group, this.dataset.title); });
    });
  }

  function moveSpot(delta) {
    var box = document.getElementById('kwSpotResults');
    if (!box || !_spotList.length) return;
    var n = _spotList.length;
    _spotSel = ((_spotSel < 0 ? 0 : _spotSel) + delta + n) % n;
    var els = box.querySelectorAll('.kw-spot-item');
    els.forEach(function(el, i) { if (i === _spotSel) el.setAttribute('data-sel', '1'); else el.removeAttribute('data-sel'); });
    if (els[_spotSel] && els[_spotSel].scrollIntoView) els[_spotSel].scrollIntoView({ block: 'nearest' });
  }

  function openSpotResult(group, title) {
    closeSpot();
    activateGroup(group);
    selectItem(group, title);
  }

  function openSpot() {
    var ov = document.getElementById('kwSpotOverlay'), inp = document.getElementById('kwSpotInput');
    if (!ov) return;
    _spotOpen = true;
    ov.classList.add('active');
    if (inp) { inp.value = ''; }
    renderSpot('');
    setTimeout(function() { if (inp) inp.focus(); }, 50);
  }

  function closeSpot() {
    var ov = document.getElementById('kwSpotOverlay');
    _spotOpen = false; _spotSel = -1; _spotList = [];
    if (ov) ov.classList.remove('active');
  }

  window.toggleKwSpot = function() { if (_spotOpen) closeSpot(); else openSpot(); };

  (function bindSpot() {
    var ov = document.getElementById('kwSpotOverlay');
    var inp = document.getElementById('kwSpotInput');
    var closeBtn = document.getElementById('kwSpotClose');
    if (!ov || !inp) return;
    var timer = null;
    inp.addEventListener('input', function() {
      var q = this.value.toLowerCase().trim();
      clearTimeout(timer);
      timer = setTimeout(function() { renderSpot(q); }, 120);
    });
    if (closeBtn) closeBtn.addEventListener('click', closeSpot);
    ov.addEventListener('click', function(e) { if (e.target === ov) closeSpot(); });
    document.addEventListener('keydown', function(e) {
      // ⌘/Ctrl+K 开关面板（不拦 ⌘F ⇒ 原生查找照旧可用）
      if ((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K')) {
        e.preventDefault(); toggleKwSpot(); return;
      }
      if (!_spotOpen) return;
      if (e.key === 'Escape') { e.preventDefault(); closeSpot(); }
      else if (e.key === 'ArrowDown' || e.key === 'ArrowRight') { e.preventDefault(); moveSpot(1); }
      else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') { e.preventDefault(); moveSpot(-1); }
      else if (e.key === 'Enter') {
        e.preventDefault();
        var r = _spotList[_spotSel >= 0 ? _spotSel : 0];
        if (r) openSpotResult(r.group, r.title);
      }
    });
  })();

  /* ── Sidebar Resize ── */
  (function() {
    var sb = document.getElementById('kwSidebar');
    var handle = document.getElementById('kwSbResize');
    var dragging = false;
    handle.addEventListener('mousedown', function(e) {
      e.preventDefault();
      dragging = true;
      handle.classList.add('active');
    });
    document.addEventListener('mousemove', function(e) {
      if (!dragging) return;
      var w = e.clientX;
      w = Math.max(200, Math.min(400, w));
      sb.style.width = w + 'px';
      sb.style.minWidth = w + 'px';
    });
    document.addEventListener('mouseup', function() {
      if (dragging) {
        dragging = false;
        handle.classList.remove('active');
        try { localStorage.setItem('html-gen:kw:sidebar-width', sb.style.width); } catch(e) {}
      }
    });
    try { var sw = localStorage.getItem('html-gen:kw:sidebar-width'); if (sw) { sb.style.width = sw; sb.style.minWidth = sw; } } catch(e) {}
  })();
})();
</script>
</body>
</html>
