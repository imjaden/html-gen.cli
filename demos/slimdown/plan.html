<!DOCTYPE html>
<html lang="zh-CN" data-theme="ember">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12100e">
<title>薄肌减脂 · 训练方案 · slimdown</title>
<link rel="icon" href="https://www.jaden.tech/static/img/favicon.png" type="image/png">
<script>
/* 首屏防闪烁：CSS 生效前先把记忆里的配色与视图写到 <html>，避免先赤金再变墨绿 */
(function(){try{var o=JSON.parse(localStorage.getItem('slimdown:ui:v2')||'{}')||{};
if(o.theme)document.documentElement.setAttribute('data-theme',o.theme);
if(o.view)document.documentElement.setAttribute('data-view',o.view);}catch(e){}})();
</script>
<style>/* slimdown 训练方案页 v1.2 —— 深色暖调 + 成套主题色（data-theme）+ 统一面板
   与 archive 的 base.css 分离：本文件只服务 plan.html。 */

/* ═══════ 1. 主题变量层（四套；整套换，避免只换主色的违和） ═══════ */
:root{
  --bg:#12100e; --bg-2:#0b0a09; --glow:rgba(200,52,31,.10);
  --card:#262019; --card-2:#1b1714;
  --edge:#3d3128; --edge-soft:#2e2620;
  --ink:#f5ece4; --muted:#b9a89c; --faint:#8a7a6e;
  --acc:#c8341f; --acc-2:#e8542a; --acc-deep:#8f2113;
  --gold:#e8b86a; --gold-soft:#5a4636;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --radius:14px; --ease:cubic-bezier(.22,.61,.36,1);
  --stack-offset:30px; --stagger:120ms;
}
[data-theme="forest"]{
  --bg:#0b1512; --bg-2:#070f0c; --glow:rgba(31,122,77,.12);
  --card:#17251f; --card-2:#101a16;
  --edge:#2c4038; --edge-soft:#22332c;
  --ink:#eaf4ee; --muted:#a9bdb2; --faint:#7d9186;
  --acc:#1f7a4d; --acc-2:#2f9e63; --acc-deep:#0f4a2e;
  --gold:#d8c07a; --gold-soft:#4a5236;
}
[data-theme="indigo"]{
  --bg:#0d1120; --bg-2:#080b17; --glow:rgba(74,111,212,.14);
  --card:#1a2033; --card-2:#12172a;
  --edge:#2f3a55; --edge-soft:#232c42;
  --ink:#e9edf8; --muted:#a7b1c9; --faint:#7d87a0;
  --acc:#2f4fa8; --acc-2:#4a6fd4; --acc-deep:#1b2f6b;
  --gold:#cbb06a; --gold-soft:#44405f;
}
[data-theme="amber"]{
  --bg:#1a1008; --bg-2:#120b05; --glow:rgba(196,106,18,.16);
  --card:#2b1c10; --card-2:#20140b;
  --edge:#4a3420; --edge-soft:#3a2818;
  --ink:#fbf0e2; --muted:#c8b39a; --faint:#9a8570;
  --acc:#c46a12; --acc-2:#e08a25; --acc-deep:#8a4708;
  --gold:#f0c169; --gold-soft:#5c4526;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  min-height:100vh; overflow-x:hidden;
  background:radial-gradient(1100px 500px at 50% -10%, var(--glow), transparent 60%), var(--bg);
  color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  font-size:14px; line-height:1.6;
  -webkit-text-size-adjust:100%;
  transition:background-color .35s var(--ease);
}
a{color:var(--gold);text-decoration:none;}
a:hover{text-decoration:underline;}

/* ═══════ 2. 页头 ═══════ */
.sheet{max-width:none;margin:0 auto;padding:0 16px 48px;}
.masthead{text-align:center;padding:34px 0 22px;}
.masthead .kicker{font-size:12px;letter-spacing:.35em;color:var(--gold);margin-bottom:10px;}
.masthead h1{
  margin:0;font-size:clamp(24px,3.6vw,38px);font-weight:900;letter-spacing:.12em;
  font-family:"Songti SC","Noto Serif SC",SimSun,serif;
  background:linear-gradient(180deg,#fff 30%,var(--gold) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.masthead .sub{margin-top:8px;font-size:13px;color:var(--muted);letter-spacing:.05em;}
.masthead .sub::before,.masthead .sub::after{content:"——";color:var(--gold-soft);margin:0 10px;}

/* ═══════ 3. 主题切换（左上角，玻璃底） ═══════ */
.theme-bar{position:fixed;top:16px;left:16px;z-index:40;display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.08);border:1px solid var(--edge-soft);border-radius:9px;
  padding:5px 9px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
.theme-bar .ic{font-size:12px;line-height:1;}
.theme-bar select{appearance:none;-webkit-appearance:none;font:inherit;font-size:12px;color:var(--ink);
  background:transparent;border:0;outline:none;cursor:pointer;padding:2px 12px 2px 0;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 6px) 52%,calc(100% - 2px) 52%;
  background-size:4px 4px,4px 4px;background-repeat:no-repeat;}
.theme-bar select option{background:var(--card);color:var(--ink);}

/* ═══════ 4. 周视图：七卡横排 + 百叶窗展开 ═══════ */
#weekRow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:stretch;position:relative;width:100%;}
.day-card{
  --i:0;position:relative;display:flex;flex-direction:column;min-width:0;
  background:linear-gradient(180deg,var(--card) 0%,var(--card-2) 100%);
  border:1px solid var(--edge-soft);border-radius:var(--radius);overflow:hidden;
  box-shadow:var(--shadow);cursor:pointer;
  transition:transform .35s var(--ease),opacity .3s ease,box-shadow .2s ease,border-color .2s ease;
}
/* 收拢（层叠）态：只有 JS 打开了动效闸门才生效，脚本失败时卡片始终正常可见 */
.anim-in #weekRow:not(.expanded) .day-card{
  transform:translateX(calc(var(--i) * var(--stack-offset)));opacity:.45;z-index:calc(10 - var(--i));
  transition-delay:calc(var(--i) * var(--stagger));
}
#weekRow.expanded .day-card{transform:translateX(0);opacity:1;z-index:1;}
#weekRow.expanded .day-card:hover{transform:translateY(-6px);border-color:var(--gold-soft);
  box-shadow:0 18px 40px rgba(0,0,0,.55),0 0 0 1px var(--gold-soft);}
.day-card.today{border-color:var(--gold);}
.day-card.dragging{opacity:.35;}
.day-card.drop-target{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold);}

/* 卡片：三行刀旗 */
.d-banner{margin:16px 12px 0;padding:11px 10px;display:flex;flex-direction:column;align-items:center;gap:5px;
  text-align:center;background:linear-gradient(135deg,var(--acc-deep) 0%,var(--acc) 55%,var(--acc-2) 100%);
  clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,14px 100%,0 50%);}
.d-banner .b-day{font-size:17px;font-weight:800;letter-spacing:.12em;color:#fff;line-height:1.2;}
.d-banner .b-tag{font-size:10.5px;letter-spacing:.04em;color:#fff;background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.28);border-radius:6px;padding:2px 9px;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.d-banner .b-time{font-size:10.5px;letter-spacing:.06em;color:rgba(255,255,255,.82);}

/* 卡片：组数 chip / 动作清单 / 口号 */
.d-chip{margin:12px 12px 0;text-align:center;font-size:11px;color:var(--gold);
  border:1px dashed var(--gold-soft);border-radius:8px;padding:5px 6px;letter-spacing:.04em;white-space:nowrap;}
.d-list{list-style:none;margin:10px 12px 0;padding:0;display:flex;flex-direction:column;gap:3px;}
.d-list li{display:flex;align-items:center;gap:5px;height:35px;padding:0 2px;border-radius:5px;
  font-size:12.5px;color:var(--ink);min-width:0;transition:background .12s;}
.d-list li:hover{background:rgba(255,255,255,.045);}
.d-list .idx{flex:none;width:11px;color:var(--faint);font-size:10px;font-variant-numeric:tabular-nums;}
/* 名称两行：中文 + 英文斜体；纯中文动作只占一行并垂直居中 */
.d-list .nm{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;justify-content:center;line-height:1.25;}
.d-list .nm .cn{font-size:11.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.d-list .nm .en{font-size:10px;font-style:italic;color:var(--muted);letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.d-list .badge{flex:none;min-width:56px;width:auto;padding:3px 6px;text-align:center;background:linear-gradient(135deg,var(--acc-2),var(--acc));
  color:#fff;font-weight:700;font-size:10.5px;border-radius:4px;
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);}
.d-foot{margin-top:auto;padding:11px 12px;border-top:1px dashed var(--edge-soft);text-align:center;}
.d-foot .s2{font-size:12.5px;font-weight:700;color:var(--gold);letter-spacing:.02em;
  display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* 拖拽手柄 / 今天标 */
.drag{position:absolute;top:2px;left:50%;transform:translateX(-50%);z-index:3;
  cursor:grab;touch-action:none;color:var(--faint);font-size:12px;line-height:1.2;
  padding:3px 14px;border-radius:6px;user-select:none;opacity:.7;transition:opacity .15s,color .15s;}
.drag:hover{color:var(--gold);opacity:1;}
.drag:active{cursor:grabbing;}
.today-chip{position:absolute;top:16px;right:15px;z-index:3;font-size:10px;color:var(--bg);
  background:var(--gold);border-radius:4px;padding:1px 7px;font-weight:700;}
.drag-ghost{position:fixed;pointer-events:none;z-index:80;opacity:.94;transform:rotate(-1.5deg);
  box-shadow:0 10px 28px rgba(0,0,0,.45);}

/* ═══════ 5. FAB ═══════ */
.fab-group{position:fixed;right:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:45;
  display:flex;flex-direction:column;gap:10px;}
.fab{width:48px;height:48px;border-radius:50%;border:1px solid var(--edge);cursor:pointer;
  background:rgba(38,32,25,.82);color:var(--ink);font-size:19px;line-height:1;
  display:grid;place-items:center;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 8px 24px rgba(0,0,0,.45);transition:transform .18s var(--ease),border-color .18s,color .18s;}
.fab:hover{transform:translateY(-2px);border-color:var(--gold);color:var(--gold);}
.fab:active{transform:scale(.95);}

/* ═══════ 6. 统一面板（编辑 / 预览 双视图） ═══════ */
.panel-mask{position:fixed;inset:0;z-index:60;background:rgba(8,7,6,.72);
  display:none;align-items:center;justify-content:center;padding:20px;
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);}
.panel-mask.open{display:flex;}
.panel{width:min(980px,100%);max-height:90vh;display:flex;flex-direction:column;
  background:var(--card-2);border:1px solid var(--edge);border-radius:16px;overflow:hidden;
  box-shadow:0 24px 70px rgba(0,0,0,.6);}
.p-head{display:flex;align-items:center;gap:12px;padding:15px 20px;border-bottom:1px solid var(--edge-soft);}
.p-head h2{margin:0;min-width:0;flex:0 1 auto;font-size:15px;font-weight:700;font-family:"Songti SC",SimSun,serif;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.p-head .p-x{margin-left:auto;appearance:none;border:0;background:none;color:var(--muted);
  font-size:22px;line-height:1;cursor:pointer;padding:0 4px;}
.p-head .p-x:hover{color:var(--ink);}

.p-tabs{display:flex;gap:6px;padding:10px 20px;border-bottom:1px solid var(--edge-soft);overflow-x:auto;}
.p-tab{appearance:none;font:inherit;font-size:12.5px;padding:5px 12px;border-radius:8px;cursor:pointer;
  border:1px solid var(--edge-soft);background:transparent;color:var(--muted);white-space:nowrap;flex:none;}
.p-tab:hover{color:var(--ink);border-color:var(--edge);}
.p-tab.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700;}
.p-tab .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--gold);
  margin-left:5px;vertical-align:middle;}

.p-seg{display:inline-flex;gap:0;border:1px solid var(--edge-soft);border-radius:9px;overflow:hidden;flex:none;margin-left:6px;}
.p-seg button{appearance:none;font:inherit;font-size:12.5px;padding:6px 14px;border:0;cursor:pointer;
  background:transparent;color:var(--muted);}
.p-seg button.on{background:var(--edge);color:var(--ink);font-weight:700;}

.p-body{flex:1;overflow:auto;padding:16px 20px;}
.view{display:none;}
.view.on{display:block;}

/* 编辑视图 */
.edit-grid{display:grid;grid-template-columns:300px 1fr;gap:14px;align-items:start;}
.picker{border:1px solid var(--edge-soft);border-radius:10px;display:flex;flex-direction:column;max-height:52vh;overflow:hidden;}
.picker .p-tools{padding:8px;border-bottom:1px solid var(--edge-soft);display:flex;gap:6px;flex-wrap:wrap;}
.picker input[type=search]{flex:1;min-width:110px;font:inherit;font-size:12px;padding:5px 9px;
  border:1px solid var(--edge);border-radius:6px;background:var(--card);color:var(--ink);outline:none;}
.picker input[type=search]:focus{border-color:var(--gold);}
.picker ul{list-style:none;margin:0;padding:4px 0;overflow:auto;}
.picker li{display:flex;align-items:center;gap:8px;padding:5px 10px;font-size:12px;}
.picker li:hover{background:rgba(255,255,255,.05);}
.picker li .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.picker li .sub{color:var(--faint);font-size:10.5px;}
.chip{appearance:none;font:inherit;font-size:11.5px;padding:3px 9px;border-radius:6px;cursor:pointer;
  border:1px solid var(--edge-soft);background:transparent;color:var(--muted);}
.chip:hover{color:var(--ink);}
.chip.on{background:var(--edge);border-color:var(--edge);color:var(--ink);}
.btn{appearance:none;font:inherit;font-size:12.5px;padding:6px 12px;border-radius:8px;cursor:pointer;
  border:1px solid var(--edge);background:transparent;color:var(--ink);}
.btn:hover{border-color:var(--gold);color:var(--gold);}
.btn.mini{padding:2px 8px;font-size:11.5px;line-height:1.4;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

.plan-box{border:1px solid var(--edge-soft);border-radius:10px;overflow:hidden;}
.plan-box .p-head2{display:flex;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--edge-soft);font-size:12px;flex-wrap:wrap;}
.plan-box .p-head2 b{font-family:"Songti SC",SimSun,serif;font-size:13.5px;}
.plan-row{display:grid;grid-template-columns:1fr 58px 104px 28px 28px;gap:6px;align-items:center;
  padding:6px 12px;border-bottom:1px dashed var(--edge-soft);font-size:12.5px;}
.plan-row:last-child{border-bottom:none;}
.plan-row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.plan-row input{font:inherit;font-size:12px;width:100%;padding:3px 5px;border-radius:5px;
  border:1px solid var(--edge);background:var(--card);color:var(--ink);text-align:center;outline:none;}
.plan-row input:focus{border-color:var(--gold);}
.plan-empty{padding:18px;color:var(--muted);font-size:12px;}
.note{font-size:11px;color:var(--muted);}

/* 预览视图 */
.preview-host{display:flex;justify-content:center;}
.card-wrap{max-width:100%;}

/* 出图卡（深色，与页面同源） */
.card{width:720px;max-width:100%;background:var(--card);color:var(--ink);
  border:1px solid var(--edge);border-radius:16px;overflow:hidden;font-size:14px;}
.card .c-banner{background:linear-gradient(135deg,var(--acc-deep) 0%,var(--acc) 55%,var(--acc-2) 100%);
  padding:22px 30px 20px;color:#fff;}
.card .c-banner .k{font-size:10.5px;letter-spacing:.3em;opacity:.85;}
.card .c-banner h2{margin:6px 0 4px;font-size:26px;line-height:1.2;font-weight:900;
  font-family:"Songti SC","Noto Serif SC",SimSun,serif;letter-spacing:.04em;}
.card .c-banner .m{font-size:12px;opacity:.9;letter-spacing:.04em;}
.card .c-body{padding:16px 30px 6px;}
.c-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--edge-soft);}
.c-row:last-child{border-bottom:none;}
.c-row .i{flex:none;width:16px;color:var(--faint);font-size:11px;font-variant-numeric:tabular-nums;}
.c-row .n{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;line-height:1.3;}
.c-row .n .cn{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.c-row .n .en{font-size:11px;font-style:italic;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.c-row .s{flex:none;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap;}
.c-row .b{flex:none;min-width:70px;text-align:center;background:var(--acc);color:#fff;font-weight:700;
  font-size:11.5px;padding:3px 8px;border-radius:4px;font-variant-numeric:tabular-nums;white-space:nowrap;}
.card .c-foot{display:flex;justify-content:space-between;gap:12px;align-items:center;
  padding:14px 30px 18px;border-top:1px solid var(--edge-soft);margin-top:8px;}
.card .c-foot .sl{font-size:12.5px;font-weight:700;color:var(--gold);}
.card .c-foot .dt{font-size:11px;color:var(--faint);white-space:nowrap;}
.card .c-sum{padding:0 30px;font-size:11.5px;color:var(--muted);}

.p-foot{display:flex;align-items:center;gap:10px;padding:13px 20px;border-top:1px solid var(--edge-soft);flex-wrap:wrap;}
.p-foot .p-note{flex:1 1 120px;min-width:0;font-size:11px;color:var(--muted);}
.p-links{margin-left:auto;display:flex;gap:12px;align-items:center;}
.p-actions{display:flex;gap:8px;align-items:center;}
.p-btn{appearance:none;font:inherit;font-size:13px;padding:8px 18px;border-radius:9px;cursor:pointer;
  border:1px solid var(--edge);background:transparent;color:var(--ink);font-weight:600;}
.p-btn:hover:not(:disabled){border-color:var(--gold);color:var(--gold);}
.p-btn.primary{background:var(--acc);border-color:var(--acc);color:#fff;}
.p-btn.primary:hover:not(:disabled){opacity:.9;color:#fff;}
.p-btn:disabled{opacity:.4;cursor:not-allowed;}
.p-link{appearance:none;border:0;background:none;font:inherit;font-size:12px;color:var(--muted);
  text-decoration:underline;cursor:pointer;padding:4px 2px;}
.p-link:hover{color:var(--gold);}

/* 分享弹层（沿用） */
.mask{position:fixed;inset:0;background:rgba(8,7,6,.72);display:none;align-items:center;justify-content:center;
  padding:16px;z-index:70;}
.mask.open{display:flex;}
.share-panel{background:var(--card);border:1px solid var(--edge);border-radius:14px;padding:22px;
  width:560px;max-width:100%;max-height:86vh;overflow:auto;}
.share-panel h2{margin:0 0 6px;font-family:"Songti SC",SimSun,serif;font-size:19px;}
.share-panel textarea{width:100%;height:92px;font:12px/1.5 ui-monospace,Menlo,monospace;padding:8px;
  border:1px solid var(--edge);border-radius:8px;background:var(--card-2);color:var(--ink);resize:vertical;outline:none;}
.share-panel .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center;}

.p-link:disabled{opacity:.4;cursor:not-allowed;text-decoration:none;}

/* 页脚 */
.foot{margin-top:28px;padding-top:12px;border-top:1px solid var(--edge-soft);display:flex;
  justify-content:space-between;gap:14px;font-size:11px;color:var(--faint);flex-wrap:wrap;}

/* toast */
#__toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:rgba(12,10,9,.94);
  color:#fff;font-size:12.5px;padding:9px 16px;border-radius:8px;opacity:0;transition:opacity .18s;
  z-index:99;pointer-events:none;max-width:80vw;text-align:center;border:1px solid rgba(255,255,255,.12);}

/* ═══════ 7. 响应式 ═══════ */
@media (max-width:1100px){
  #weekRow{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
    padding-bottom:8px;gap:8px;}
  #weekRow .day-card{flex:0 0 200px;scroll-snap-align:start;}
  :root{--stack-offset:14px;}
  .edit-grid{grid-template-columns:1fr;}
  .picker{max-height:34vh;}
}
@media (max-width:760px){
  .panel-mask{padding:0;align-items:flex-end;}
  .panel{max-height:94vh;border-radius:16px 16px 0 0;width:100%;}
  .p-head,.p-tabs,.p-body,.p-foot{padding-left:14px;padding-right:14px;}

@media (max-width:520px){

}

/* ═══════ 8. 打印（强制浅色，忽略主题） ═══════ */
@media print{
  /* 打印只翻底色与文字色，保留当前主题的强调色（横幅仍是主题色） */
  :root, [data-theme]{
    --bg:#fff; --bg-2:#fff; --card:#fff; --card-2:#fff;
    --edge:#bbb; --edge-soft:#ddd; --ink:#111; --muted:#555; --faint:#777;
    --shadow:none;
  }
  body{background:#fff;color:#000;}
  .theme-bar,.fab-group,.panel-mask,.mask{display:none!important;}
  #weekRow{display:grid;grid-template-columns:repeat(3,1fr);}
  #weekRow .day-card{transform:none!important;opacity:1!important;break-inside:avoid;page-break-inside:avoid;}
  .d-banner{background:var(--acc);-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  /* 打印：标题在纸上不可见（渐变字），去掉 masthead + chip + 抓握条，3 列 × 3 排压在一页内 */
  .masthead,.d-chip,.drag{display:none;}
  .d-list{gap:1px;margin-top:8px;}
  .d-list li{height:26px;}
  .d-list .nm .cn{font-size:10px;}
  .d-list .nm .en{font-size:9px;}
  .d-list .badge{min-width:44px;width:auto;font-size:9px;padding:2px 4px;}
}
@media (prefers-reduced-motion:reduce){
  .day-card,.fab{transition:none!important;}
  .anim-in #weekRow:not(.expanded) .day-card{transform:none;opacity:1;}
}

/* ═══════ 9. 卡片模式（?card=day|week|theme）：只留卡本身，方便截图 ═══════ */
body.cardonly{background:var(--bg);}
body.cardonly > .sheet,body.cardonly > .fab-group,body.cardonly > .theme-bar{display:none;}
body.cardonly #standalone{display:flex;justify-content:center;align-items:flex-start;padding:22px 12px;min-height:100vh;}

/* ═══════ 10. v1.3：视图分段 + 方案预设（按星期 / 按主题） ═══════ */
.view-bar{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:2px 0 14px;}
.v-seg{display:inline-flex;border:1px solid var(--edge-soft);border-radius:10px;overflow:hidden;background:rgba(255,255,255,.03);}
.v-seg button{appearance:none;font:inherit;font-size:12.5px;padding:7px 16px;border:0;cursor:pointer;
  background:transparent;color:var(--muted);letter-spacing:.04em;transition:background .15s,color .15s;}
.v-seg button:hover{color:var(--ink);}
.v-seg button.on{background:var(--acc);color:#fff;font-weight:700;}
.preset-pick{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);
  border:1px solid var(--edge-soft);border-radius:9px;padding:5px 9px;}
.preset-pick[hidden]{display:none;}
.preset-pick .lbl{font-size:10.5px;color:var(--faint);letter-spacing:.08em;}
.preset-pick select{appearance:none;-webkit-appearance:none;font:inherit;font-size:12px;color:var(--ink);
  background:transparent;border:0;outline:none;cursor:pointer;padding-right:2px;}
.preset-pick select option{background:var(--card);color:var(--ink);}

/* 分享态提示条 */
.shared-bar{margin:0 0 12px;padding:7px 12px;border:1px dashed var(--gold-soft);border-radius:9px;
  display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--gold);}
.shared-bar[hidden]{display:none;}
.shared-bar .btn{margin-left:auto;}

/* hidden 属性优先于布局 display（#weekRow/.p-tabs/#themeRow 都显式设了 display） */
#weekRow[hidden],#themeRow[hidden],.p-tabs[hidden],.p-seg button[hidden],#btnDownloadEach[hidden]{display:none!important;}

/* ═══════ 11. v1.3：动作行第三段（目标肌群） / 恢复日清单 / 打卡 ═══════ */
.d-list .nm .mt{font-size:9.5px;color:var(--gold);letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.r-list{list-style:none;margin:12px 12px 0;padding:0;display:flex;flex-direction:column;gap:10px;}
.r-list li{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink);min-width:0;}
.r-ic{flex:none;width:26px;height:26px;border:1px solid var(--gold);border-radius:50%;
  display:grid;place-items:center;color:var(--gold);font-size:11px;}
.r-list .rt{flex:1;min-width:0;}
.day-card .d-foot{position:relative;padding-right:30px;}
.day-card .chk{position:absolute;right:8px;bottom:8px;z-index:4;width:24px;height:24px;padding:0;
  border-radius:50%;border:1px solid var(--edge);background:rgba(0,0,0,.25);color:var(--faint);
  font-size:12px;line-height:1;cursor:pointer;display:grid;place-items:center;
  opacity:.55;transition:opacity .15s,border-color .15s,color .15s,background .15s;}
.day-card .chk:hover{opacity:1;border-color:var(--gold);color:var(--gold);}
.day-card .chk[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--bg);opacity:1;}
.day-card.done{opacity:.82;}
.day-card.done .d-foot .s2{color:var(--gold);}

/* ═══════ 12. v1.3：主题跟练卡（按主题视图） ═══════ */
#themeRow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:stretch;}
#themeRow[hidden]{display:none;}
.theme-card{--i:0;position:relative;display:flex;flex-direction:column;min-width:0;
  background:linear-gradient(180deg,var(--card) 0%,var(--card-2) 100%);
  border:1px solid var(--edge-soft);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);
  transition:transform .35s var(--ease),box-shadow .2s ease,border-color .2s ease;}
.theme-card:hover{transform:translateY(-4px);border-color:var(--gold-soft);}
.theme-card .d-banner{margin:12px 12px 0;padding:11px 10px;}
.theme-card .d-banner .b-head{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;}
.theme-card .d-banner .b-day{font-size:14px;font-weight:800;letter-spacing:.03em;color:#fff;line-height:1.3;}
.theme-card .d-banner .b-pace{font-size:10px;letter-spacing:.03em;color:rgba(255,255,255,.82);text-align:center;}
.d-list.tall{margin:10px 12px 0;gap:2px;}
.d-list.tall li{height:auto;min-height:34px;align-items:flex-start;gap:7px;padding:3px 2px;}
.d-list.tall .nm{display:block;}
.d-list.tall .nm b{display:block;font-size:12px;font-weight:600;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.d-list.tall .nm .en{display:block;font-size:9.5px;font-style:italic;color:var(--faint);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.d-list.tall .nm .note{display:block;font-size:9.5px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.d-list .m-badge{flex:none;width:52px;text-align:center;font-size:9.5px;color:var(--gold);
  border:1px solid var(--gold-soft);border-radius:4px;padding:2px 0;margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.t-foot{margin-top:auto;padding:10px 12px;border-top:1px dashed var(--edge-soft);}
.video-link{display:flex;align-items:center;gap:8px;color:var(--gold);font-size:11px;line-height:1.4;}
.video-link:hover{color:#fff;text-decoration:none;}
.video-link .v-ico,.no-video .v-ico{flex:none;width:22px;height:22px;border:1px solid var(--gold-soft);
  border-radius:50%;display:grid;place-items:center;font-size:9.5px;color:var(--gold);}
.video-link .v-title{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.video-link .v-arrow{flex:none;color:var(--faint);font-size:10.5px;}
.no-video{display:flex;align-items:center;gap:8px;color:var(--faint);font-size:11px;}

/* ═══════ 13. v1.3：出图宿主与主题长图/逐张 ═══════ */
.shot-host{position:fixed;left:-10000px;top:0;width:720px;pointer-events:none;z-index:-1;}
.shot-sheet{width:720px;display:flex;flex-direction:column;gap:14px;padding:18px;
  background:var(--bg);border-radius:16px;}
.preview-stack{display:flex;flex-direction:column;gap:14px;align-items:center;max-width:100%;}
.preview-stack .card{max-width:100%;}
.card.tcard .c-row .mb{flex:none;width:66px;text-align:center;font-size:10.5px;color:var(--gold);
  border:1px solid var(--gold-soft);border-radius:4px;padding:2px 0;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;}
.card.tcard .c-row .note{font-size:10.5px;color:var(--muted);}
.card.tcard .c-row{align-items:flex-start;}

<script>/* slimdown 状态层 —— 一份 JSON 管所有点击态（配色 / 视图 / 预设 / 页签 / 筛选 / 打卡）
   设计取舍：
   - 单键 slimdown:ui:v2（多键分散会双源、清理漏）；
   - 首次读时把旧键（slimdownPlanTheme / slimdownPlanFx）搬进来并删除，之后只认新键；
   - 打卡按日期存，只保留最近 28 天，跨周自动滚；不上传、不进分享链接。 */
window.SB = window.SB || {};
(function (SB) {
  'use strict';

  var KEY = 'slimdown:ui:v2';
  var LEGACY = [['theme', 'slimdownPlanTheme'], ['fx', 'slimdownPlanFx']];
  var DEFAULTS = {
    v: 2,
    view: 'week',        /* week | theme */
    preset: '',          /* 由页面按数据默认值补齐 */
    theme: 'ember',      /* 配色皮肤 */
    fx: 0,               /* 百叶窗动效是否已播过 */
    day: '',             /* 上一次选中的日签 */
    panelView: 'edit',   /* 面板分段：edit | prev */
    exFilter: 'all',     /* 编辑左栏器材筛选 */
    exQuery: '',         /* 编辑左栏搜索词 */
    themeCard: 0,        /* 预览里的主题序号 */
    checkin: {}          /* {'2026-11-23': ['mon','wed']} */
  };
  var KEEP_DAYS = 28;
  var mem = null;

  function read() {
    if (mem) return mem;
    var o = {};
    try { o = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { o = {}; }
    if (!o.v) {
      for (var i = 0; i < LEGACY.length; i++) {
        try {
          var v = localStorage.getItem(LEGACY[i][1]);
          if (LEGACY[i][0] === 'fx') { if (v === '1') o.fx = 1; } else if (v) { o[LEGACY[i][0]] = v; }
        } catch (e) {}
      }
      o.v = 2;
    }
    for (var k in DEFAULTS) if (!(k in o)) o[k] = DEFAULTS[k];
    if (!o.checkin || typeof o.checkin !== 'object') o.checkin = {};
    mem = o;
    return mem;
  }

  function flush() {
    try {
      localStorage.setItem(KEY, JSON.stringify(mem));
      for (var i = 0; i < LEGACY.length; i++) localStorage.removeItem(LEGACY[i][1]);
    } catch (e) {}
  }

  function get(k) { return read()[k]; }

  function set(k, v) {
    var o = read();
    if (o[k] === v) return v;
    o[k] = v;
    flush();
    return v;
  }

  function dayKey(d) {
    var t = d || new Date();
    return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' +
      String(t.getDate()).padStart(2, '0');
  }

  function prune(o) {
    var now = new Date();
    var cut = new Date(now.getTime() - KEEP_DAYS * 86400000);
    var floor = dayKey(cut);
    var next = {};
    for (var d in o) if (d >= floor) next[d] = o[d];
    return next;
  }

  /* 打卡：以「今天」为记账日，记下今天练的是哪一天（可补练） */
  function isDone(dayId) {
    var list = read().checkin[dayKey()] || [];
    return list.indexOf(dayId) >= 0;
  }

  function toggleDone(dayId) {
    var o = read();
    var k = dayKey();
    var list = (o.checkin[k] || []).slice();
    var i = list.indexOf(dayId);
    if (i >= 0) list.splice(i, 1); else list.push(dayId);
    o.checkin[k] = list;
    o.checkin = prune(o.checkin);
    flush();
    return i < 0;
  }

  function clear() {
    try { localStorage.removeItem(KEY); } catch (e) {}
    mem = null;
  }

  SB.ui = { get: get, set: set, all: read, clear: clear,
            dayKey: dayKey, isDone: isDone, toggleDone: toggleDone };
})(window.SB);

/* slimdown 出图层 —— DOM → PNG（零依赖：foreignObject + canvas），周视图与主题视图共用
   设计取舍（沿用 v1.2 已实测口径）：
   - 1x：PNG 宽 = 节点 CSS 宽（出图卡固定 720），不做 2x；
   - 克隆前把主题变量内联到克隆根，保证 PNG 与屏幕同色；

      '" viewBox="0 0 ' + w + ' ' + h + '">' +
      '<foreignObject width="100%" height="100%">' +
      '<div xmlns="http://www.w3.org/1999/xhtml"><style><![CDATA[' + css + ']]></style>' +

        var cn = e.name_cn || e.name, en = e.name_en || '';
        return '<div class="plan-row">' +
          '<span class="nm" title="' + esc(cn + (en ? ' · ' + en : '')) + '">' + esc(cn) + '</span>' +
          '<input data-i="' + i + '" data-k="sets" value="' + esc(it.sets == null ? '' : it.sets) +
            '" inputmode="numeric" aria-label="组数" placeholder="—">' +
          '<input data-i="' + i + '" data-k="reps" value="' + esc(it.reps) + '" aria-label="次数">' +
          '<button class="btn mini" type="button" data-act="up" data-i="' + i + '" title="上移">↑</button>' +
          '<button class="btn mini" type="button" data-act="del" data-i="' + i + '" title="删除">×</button>' +
          '</div>';
      }).join('');
      box.querySelectorAll('input').forEach(function (inp) {
        inp.addEventListener('change', function () {
          var i = +inp.getAttribute('data-i');
          var k = inp.getAttribute('data-k');
          if (k === 'sets') {
            var n = parseInt(inp.value, 10);
            if (n) d.items[i].sets = n; else delete d.items[i].sets;
          } else {
            d.items[i].reps = inp.value;
          }
          markDirty(); renderWeek(); renderEdit();
        });
      });
      box.querySelectorAll('button[data-act]').forEach(function (b) {
        b.addEventListener('click', function () {
          var i = +b.getAttribute('data-i');
          var act = b.getAttribute('data-act');
          if (act === 'del') d.items.splice(i, 1);
          if (act === 'up' && i > 0) {
            var t = d.items[i - 1]; d.items[i - 1] = d.items[i]; d.items[i] = t;
          }
          markDirty(); renderWeek(); renderEdit();
        });
      });
    }
    renderPicker();
  }

  function renderPicker() {
    var exFilter = ui.get('exFilter'), exQuery = ui.get('exQuery');
    var chips = ['all'].concat(EX.map(function (e) { return e.equip; })
      .filter(function (v, i, a) { return a.indexOf(v) === i; }));
    $('exChips').innerHTML = chips.map(function (c) {
      return '<button type="button" class="chip' + (c === exFilter ? ' on' : '') +
        '" data-e="' + esc(c) + '">' + (c === 'all' ? '全部' : esc(c)) + '</button>';
    }).join('');
    $('exChips').querySelectorAll('.chip').forEach(function (b) {
      b.addEventListener('click', function () {
        ui.set('exFilter', b.getAttribute('data-e'));
        renderPicker();
      });
    });
    var q = exQuery.toLowerCase();
    var list = EX.filter(function (e) {
      if (exFilter !== 'all' && e.equip !== exFilter) return false;
      if (!q) return true;
      return (e.name + ' ' + (e.alias || '')).toLowerCase().indexOf(q) >= 0;
    });
    var d = dayBy(activeKey);
    var has = {};
    (d.items || []).forEach(function (it) { has[it.id] = true; });
    $('exList').innerHTML = list.map(function (e) {
      return '<li><span class="grow"><b>' + esc(e.name) + '</b>' +
        '<span class="sub"> ' + esc(e.muscle) + ' · ' + esc(e.sets) + '×' + esc(e.reps) + '</span></span>' +
        '<button type="button" class="btn mini" data-add="' + esc(e.id) + '"' +
        (has[e.id] ? ' disabled' : '') + '>+</button></li>';
    }).join('') || '<li class="note" style="padding:10px">没有匹配的动作</li>';
    $('exList').querySelectorAll('button[data-add]').forEach(function (b) {
      b.addEventListener('click', function () {
        var e = BYID[b.getAttribute('data-add')];
        if (!e) return;
        if (!d.items) d.items = [];
        var item = { id: e.id, reps: e.reps };
        if (d.setsHint == null && e.sets) item.sets = e.sets;
        d.items.push(item);
        markDirty(); renderWeek(); renderEdit();
      });
    });
  }
  var searchTimer = null;
  $('exSearch').addEventListener('input', function () {
    var v = this.value.trim();
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      ui.set('exQuery', v);
      renderPicker();
    }, 120);
  });

  /* ── 方案改动：改即自动存本机（按预设分开） ── */
  function markDirty() {
    EDITS.byPreset[cur.id] = clone(days);
    writeEdits();
    $('panelNote').textContent = '已自动保存到本机';
  }
  function saveLocal(silent) {
    if (!cur) return false;
    EDITS.byPreset[cur.id] = clone(days);
    writeEdits();
    if (!silent) {
      showToast('已保存到本机');
      $('panelNote').textContent = '已保存到本机 · ' + new Date().toLocaleTimeString();
    }
    return true;
  }
  $('btnSavePlan').addEventListener('click', function () { saveLocal(false); });
  $('btnResetDay').addEventListener('click', function () {
    var d = dayBy(activeKey);
    for (var i = 0; i < DEFAULTS.length; i++) {
      if (DEFAULTS[i].key === d.key) {
        var fresh = clone(DEFAULTS[i]);
        Object.keys(d).forEach(function (k) { if (!(k in fresh)) delete d[k]; });
        Object.keys(fresh).forEach(function (k) { d[k] = fresh[k]; });
        break;
      }
    }
    markDirty(); renderWeek(); renderEdit();
  });
  $('btnLoadDefault').addEventListener('click', function () {
    if (!confirm('还原成「' + cur.label + '」的默认七天方案？本机保存的改动会丢。')) return;
    days = clone(DEFAULTS);
    delete EDITS.byPreset[cur.id];
    writeEdits();
    renderWeek(); renderEdit();
    $('panelNote').textContent = '已还原默认方案';
    showToast('已还原默认方案');
  });
  $('btnClearMemory').addEventListener('click', function () {
    if (!confirm('清空本机的配色、视图、筛选、打卡与方案改动？页面会重新加载。')) return;
    ui.clear();
    try { localStorage.removeItem(EDITS_KEY); localStorage.removeItem(LEGACY_EDITS); } catch (e) {}
    location.reload();
  });

  /* ── 分享编码 v3：v3|预设|天号=主题!时长!动作表（动作 = 库内序号*sets~reps，sets 可空）
     解码兼容 v1（只带动作）/ v2（主题!时长!动作） */
  function numOf(id) { return parseInt(String(id).replace(/^ex/, ''), 10); }
  function idOf(n) { return 'ex' + (n < 10 ? '0' + n : String(n)); }
  function encodePlan() {
    return 'v3|' + cur.id + '|' + days.map(function (d, i) {
      var def = DEFAULTS[i] || {};
      var th = d.theme === def.theme ? '' : encodeURIComponent(d.theme);
      var du = d.duration === def.duration ? '' : encodeURIComponent(d.duration);
      return (i + 1) + '=' + th + '!' + du + '!' +
        (d.items || []).map(function (it) {
          return numOf(it.id) + '*' + (it.sets == null ? '' : it.sets) + '~' + encodeURIComponent(it.reps);
        }).join(',');
    }).join('|');
  }
  function decodePlan(str) {
    var out = [], unknown = 0;
    var segs = String(str).split('|');
    var ver = segs[0], preset = '';
    if (ver !== 'v1' && ver !== 'v2' && ver !== 'v3') return null;
    var body = segs.slice(1);
    if (ver === 'v3') preset = body.shift() || '';
    body.forEach(function (seg) {
      var p = seg.split('=');
      var d = days[parseInt(p[0], 10) - 1];
      if (!d) return;
      var theme = '', duration = '', itemsStr = p[1] || '';
      if (ver !== 'v1') {
        var parts = itemsStr.split('!');
        theme = decodeURIComponent(parts[0] || '');
        duration = decodeURIComponent(parts[1] || '');
        itemsStr = parts[2] || '';
      }
      var items = [];
      itemsStr.split(',').forEach(function (tok) {
        if (!tok) return;
        var m = /^(\d+)\*(\d*)~(.*)$/.exec(tok);
        if (!m) return;
        var id = idOf(parseInt(m[1], 10));
        if (!BYID[id]) { unknown++; return; }
        var item = { id: id, reps: decodeURIComponent(m[3]) };
        if (m[2]) item.sets = parseInt(m[2], 10);
        items.push(item);
      });
      out.push({ key: d.key, items: items, theme: theme, duration: duration });
    });
    return { days: out, unknown: unknown, preset: preset };
  }
  function buildShareUrl() {
    return location.href.split('#')[0] + '#p=' + encodePlan();
  }
  function planText() {
    var L = ['【' + (PLAN.title || '训练方案') + ' · ' + cur.label + '】', ''];
    days.forEach(function (d) {
      L.push(d.label + ' · ' + d.theme + '（' + d.duration + '）');
      if (d.rest) (d.recover || []).forEach(function (t) { L.push('  · ' + t); });
      (d.items || []).forEach(function (it, i) {
        var e = exName(it);
        var cn = e.name_cn || e.name, en = e.name_en || '';
        L.push('  ' + (i + 1) + '. ' + cn + (en ? ' ' + en : '') + ' ' +
          (it.sets ? it.sets + '×' : '') + it.reps);
      });
      L.push('');
    });
    if (cur.slogan) L.push(cur.slogan);
    return L.join('\n');
  }

  $('btnShare').addEventListener('click', function () {
    var url = buildShareUrl();
    $('shareUrl').value = url;
    $('shareLen').textContent = url.length + ' 字符';
    $('shareMask').classList.add('open');
    setTimeout(function () { $('shareUrl').select(); }, 50);
  });
  $('btnCloseShare').addEventListener('click', function () { $('shareMask').classList.remove('open'); });
  $('shareMask').addEventListener('click', function (e) {
    if (e.target === this) this.classList.remove('open');
  });
  $('btnCopyUrl').addEventListener('click', function () { copyText(buildShareUrl(), '链接已复制'); });
  $('btnCopyText').addEventListener('click', function () { copyText(planText(), '方案文本已复制'); });

  /* ═══════ html-gen:clipboard-copy v1 BEGIN —— canonical, 四模板逐字节一致, 守卫测试锁定 ═══════ */
  function copyText(text, okMsg, failMsg, onOk) {
    var _toast = (typeof showToast === 'function') ? showToast
      : (typeof showKwToast === 'function') ? showKwToast
      : function (m) { try { console.log('[html-gen] ' + m); } catch (e) {} };
    var done = function () { if (onOk) onOk(); if (okMsg) _toast(okMsg); };
    var fail = function () { _toast(failMsg || '复制失败，请手动选中文本复制'); };
    var fallback = function () {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:-1000px;left:-1000px;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      if (ok) { done(); } else { fail(); }
    };
    if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done).catch(fallback);
    } else {
      fallback();                       /* 非安全上下文 ⇒ 直接回退, 不得依赖 catch */
    }
  }
  /* ═══════ html-gen:clipboard-copy v1 END ═══════ */

  /* ── 出图卡（深色，与页面同主题） ── */
  function dateLine() {
    var d = new Date();
    var wk = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][d.getDay()];
    return d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' +
      String(d.getDate()).padStart(2, '0') + ' ' + wk;
  }
  function cardRows(d) {
    var rows = (d.items || []).map(function (it, i) {
      var e = exName(it);
      var cn = e.name_cn || e.name, en = e.name_en || '';
      var muscle = it.muscle || e.muscle || '';
      return '<div class="c-row"><span class="i">' + (i + 1) + '.</span>' +
        '<span class="n" title="' + esc(cn + (en ? ' · ' + en : '')) + '">' +
          '<span class="cn">' + esc(cn) + '</span>' +
          (muscle ? '<span class="en">' + esc(muscle) + '</span>' : '') +
        '</span>' +
        (it.sets ? '<span class="s">' + esc(it.sets) + ' 组</span>' : '') +
        '<span class="b">' + esc(it.reps) + '</span></div>';
    }).join('');
    if (!rows && d.rest) {
      rows = (d.recover || []).map(function (t, i) {
        return '<div class="c-row"><span class="i">' + (i + 1) + '.</span>' +
          '<span class="n"><span class="cn">' + esc(t) + '</span></span></div>';
      }).join('');
    }
    return rows || '<div class="c-row"><span class="n" style="color:var(--faint)">这一天没有安排</span></div>';
  }
  function buildDayCard(key) {
    var d = dayBy(key);
    var meta = d.rest
      ? '全天休息 · ' + (d.recover || []).length + ' 条恢复建议'
      : (esc(d.duration) + ' · ' + (d.items || []).length + ' 个动作' +
         (d.setsHint ? ' · 建议 ' + esc(d.setsHint) + ' 组' : ' · 共 ' + sumSets(d) + ' 组'));
    return '<div class="card" id="shareCard">' +
      '<div class="c-banner">' +
        '<div class="k">SLIMDOWN · ' + esc(d.label) + '</div>' +
        '<h2>' + esc(d.theme) + '</h2>' +
        '<div class="m">' + meta + '</div>' +
      '</div>' +
      '<div class="c-body">' + cardRows(d) + '</div>' +
      '<div class="c-foot"><span class="sl">' + esc(sloganOf(d)) + '</span>' +
      '<span class="dt">' + esc(dateLine()) + '</span></div>' +
      '</div>';
  }
  function buildWeekCard() {
    var body = days.map(function (d) {
      return '<div class="c-row"><span class="i">' + esc(d.short || '') + '</span>' +
        '<span class="n"><b>' + esc(d.theme) + '</b>　' + esc(d.rest
          ? (d.recover || []).join(' · ')
          : (d.items || []).map(function (it) {
              var e = exName(it);
              return (e.name_cn || e.name) + ' ' + (it.sets ? it.sets + '×' : '') + it.reps;
            }).join(' · ')) + '</span>' +
        '<span class="b">' + esc(d.duration) + '</span></div>';
    }).join('');
    return '<div class="card" id="shareCard">' +
      '<div class="c-banner"><div class="k">SLIMDOWN · 7-DAY</div>' +
      '<h2>' + esc(PLAN.title || '训练方案') + '</h2>' +
      '<div class="m">' + esc(cur.label + ' · ' + (cur.slogan || '')) + '</div></div>' +
      '<div class="c-body">' + body + '</div>' +
      '<div class="c-foot"><span class="sl">' + esc(cur.slogan || '') + '</span>' +
      '<span class="dt">' + esc(dateLine()) + '</span></div>' +
      '</div>';
  }
  function buildThemeCard(t) {
    return '<div class="card tcard">' +
      '<div class="c-banner"><div class="k">HOME WORKOUT · ' + esc(t.tag) + '</div>' +
      '<h2>' + esc(t.name) + '</h2>' +
      '<div class="m">' + esc(t.time) + ' · 建议 ' + esc(t.sets) + ' 组 · ' + esc(t.pace) + '</div></div>' +
      '<div class="c-body">' + (t.items || []).map(function (it, i) {
        return '<div class="c-row"><span class="i">' + (i + 1) + '.</span>' +
          '<span class="n"><span class="cn">' + esc(it.cn) + '</span>' +
          '<span class="en">' + esc(it.en) + '</span>' +
          (it.note ? '<span class="note">' + esc(it.note) + '</span>' : '') + '</span>' +
          '<span class="mb">' + esc(it.m) + '</span></div>';
      }).join('') + '</div>' +
      '<div class="c-foot"><span class="sl">' + esc(t.video ? t.video.title : '跟练视频待补充') + '</span>' +
      '<span class="dt">' + esc(dateLine()) + '</span></div>' +
      '</div>';
  }
  function renderPreview() {
    $('previewHost').innerHTML = buildDayCard(activeKey);
  }
  function renderThemePreview() {
    $('previewHost').innerHTML = '<div class="preview-stack">' +
      LAYOUTS.map(function (t) { return buildThemeCard(t); }).join('') + '</div>';
  }

  function shotHost(html) {
    var host = $('shotHost');
    host.innerHTML = html;
    return host.firstElementChild;
  }
  function pngName(tag) {
    return 'slimdown-' + tag + '-' + shot.stamp() + '.png';
  }
  function themeSheet() {
    return shotHost('<div class="shot-sheet">' +
      LAYOUTS.map(function (t) { return buildThemeCard(t); }).join('') + '</div>');
  }
  function exportEachTheme() {
    var i = 0, doneCount = 0;
    $('panelNote').textContent = '逐张生成中… 0/' + LAYOUTS.length;
    function step() {
      if (i >= LAYOUTS.length) {
        $('panelNote').textContent = '已下载 ' + doneCount + ' 张';
        shotHost('');
        return;
      }
      var node = shotHost(buildThemeCard(LAYOUTS[i]));
      shot.nodeToBlob(node, { maxH: 6000 }).then(function (r) {
        shot.download(r.blob, pngName('theme' + (i + 1)));
        doneCount++;
        i++;
        $('panelNote').textContent = '逐张生成中… ' + i + '/' + LAYOUTS.length;
        setTimeout(step, 260);
      }).catch(function (e) {
        $('panelNote').textContent = '第 ' + (i + 1) + ' 张失败：' + e.message;
        shotHost('');
      });
    }
    step();
  }
  $('btnDownloadImg').addEventListener('click', function () {
    var isTheme = panelState.scope === 'theme';
    var node = isTheme ? themeSheet() : shotHost(buildDayCard(activeKey));
    if (!node) return;
    $('panelNote').textContent = '生成中…';
    shot.nodeToBlob(node, { maxH: isTheme ? 6000 : 4000 }).then(function (r) {
      shot.download(r.blob, pngName(isTheme ? 'themes' : (activeKey || todayKey())));
      $('panelNote').textContent = '已下载 ' + r.w + '×' + r.h + (r.scaled ? '（长图已等比缩放）' : '');
      shotHost('');
    }).catch(function (e) {
      $('panelNote').textContent = '导出失败：' + e.message;
      shotHost('');
    });
  });
  $('btnDownloadEach').addEventListener('click', exportEachTheme);
  $('btnCopyImg').addEventListener('click', function () {
    var isTheme = panelState.scope === 'theme';
    var node = isTheme ? themeSheet() : ($('previewHost').querySelector('.card') || shotHost(buildDayCard(activeKey)));
    if (!node) return;
    $('panelNote').textContent = '生成中…';
    shot.nodeToBlob(node, { maxH: isTheme ? 6000 : 4000 }).then(function (r) {
      var blob = r.blob, size = r.w + '×' + r.h;
      if (window.isSecureContext && navigator.clipboard && window.ClipboardItem) {
        return navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
          .then(function () { $('panelNote').textContent = '已复制 · ' + size; })
          .catch(function () {
            shot.download(blob, pngName(activeKey || 'plan'));
            $('panelNote').textContent = '复制被拒绝，已下载 ' + size;
          });
      }
      shot.download(blob, pngName(activeKey || 'plan'));
      $('panelNote').textContent = '当前环境不支持复制图片，已下载 PNG ' + size;
    }).catch(function (e) {
      $('panelNote').textContent = '导出失败：' + e.message + '（可改用截图）';
    });
  });
  var btnPrint = $('btnPrint');
  if (btnPrint) btnPrint.addEventListener('click', function () { window.print(); });

  /* ── 卡片模式（?card=day|week|theme[&d=mon|&t=1]）：只留卡本身，方便截图 ── */
  function cardMode() {
    var q = new URLSearchParams(location.search);
    var kind = q.get('card');
    if (!kind) return false;
    document.body.classList.add('cardonly');
    var host = document.createElement('div');
    host.id = 'standalone';
    var k = q.get('d') || ui.get('day') || todayKey();
    if (kind === 'week') host.innerHTML = buildWeekCard();
    else if (kind === 'theme') {
      var idx = Math.max(0, (parseInt(q.get('t'), 10) || 1) - 1);
      host.innerHTML = buildThemeCard(LAYOUTS[idx] || LAYOUTS[0]);
    } else host.innerHTML = buildDayCard(k);
    document.body.appendChild(host);
    document.title = (kind === 'week' ? '七日方案' : kind === 'theme' ? '主题跟练' : dayBy(k).label) + ' · slimdown';
    return true;
  }

  /* ── 启动 ── */
  function applyHash() {
    var m = /#p=(.+)$/.exec(location.hash || '');
    if (!m) return false;
    var res = decodePlan(m[1]);
    if (!res || !res.days.length) { showToast('分享链接已损坏，已按本机方案显示'); return false; }
    if (res.preset && presetById(res.preset) && res.preset !== cur.id) loadPreset(res.preset);
    res.days.forEach(function (sd) {
      var d = dayBy(sd.key);
      if (!d) return;
      d.items = sd.items;
      if (sd.theme) d.theme = sd.theme;
      if (sd.duration) d.duration = sd.duration;
    });
    shared = true;
    if (res.unknown) showToast('已忽略 ' + res.unknown + ' 个未知动作');
    return true;
  }
  $('btnUnshare').addEventListener('click', function () {
    days = clone(EDITS.byPreset[cur.id] || DEFAULTS);
    shared = false;
    $('sharedBar').hidden = true;
    if (history.replaceState) history.replaceState(null, '', location.pathname + location.search);
    renderWeek();
    showToast('已恢复我的方案');
  });

  initSkins();
  initPresetSel();
  loadPreset(ui.get('preset') || PLAN.defaultPreset);
  applyHash();
  activeKey = ui.get('day') || todayKey();
  setPageView(ui.get('view'));
  $('sharedBar').hidden = !shared;
  if (!cardMode()) {
    var animate = shouldAnimate();
    if (animate) document.documentElement.classList.add('anim-in');
    renderWeek();
    renderThemes();
    startReveal(animate);
  }
})();
</script>
