<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>薄肌减脂 · 训练方案 · slimdown</title>
<link rel="icon" href="https://www.jaden.tech/static/img/favicon.png" type="image/png">
<style>/* slimdown 案例公共样式（plan / archive 共用；纸上质感，深色浏览器底衬托） */
:root{
  --paper:#FAF8F2; --ink:#1B1A17; --muted:#6B665C; --rule:#D8D2C4;
  --accent:#2F5D50; --accent-soft:#E7EEE9; --warn:#B45309; --warn-soft:#F3E8D8;
  --chip:#EFEAE0; --shadow:0 2px 18px rgba(0,0,0,.08);
}
*{box-sizing:border-box;}
html,body{margin:0;}
body{
  background:#E8E4DA; color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  font-size:14px; line-height:1.6;
  -webkit-text-size-adjust:100%;
}
a{color:var(--accent);}
.sheet{max-width:980px;margin:0 auto;background:var(--paper);box-shadow:var(--shadow);min-height:100vh;padding:0 28px 40px;}
@media (max-width:640px){.sheet{padding:0 16px 28px;}}

/* ── 顶部：标题 + 三页导航 ── */
.masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:22px 0 13px;border-bottom:3px double var(--ink);}
.masthead h1{margin:0;font-family:"Songti SC","Noto Serif SC",SimSun,serif;font-size:26px;font-weight:700;line-height:1.2;}
.masthead h1 .thin{display:block;font-size:.55em;font-weight:400;color:var(--accent);margin-top:4px;letter-spacing:.05em;}
.masthead .tag{text-align:right;font-size:11px;color:var(--muted);line-height:1.5;flex:none;}
.case-nav{display:flex;gap:0;border-bottom:1.5px solid var(--ink);overflow-x:auto;margin:0 0 4px;}
.case-nav a{padding:9px 16px;font-size:13.5px;font-weight:600;color:var(--muted);text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap;}
.case-nav a:hover{color:var(--ink);}
.case-nav a.on{color:var(--accent);border-bottom-color:var(--accent);}

/* ── 通用区块 ── */
.sec-head{display:flex;align-items:baseline;gap:11px;margin:26px 0 12px;border-bottom:1px solid var(--ink);padding-bottom:5px;}
.sec-head .no{font-family:"Songti SC",SimSun,serif;font-size:20px;font-weight:700;color:var(--accent);line-height:1;}
.sec-head h2{margin:0;font-size:15px;font-weight:700;}
.sec-head .hint{margin-left:auto;font-size:11px;color:var(--muted);text-align:right;}

table{width:100%;border-collapse:collapse;}
th,td{text-align:left;vertical-align:top;padding:7px 8px;border-bottom:1px solid var(--rule);font-size:12px;}
th{font-size:11px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--ink);padding-bottom:4px;}
b{font-weight:600;}
.warn{color:var(--warn);}
.note{font-size:11px;color:var(--muted);}
.foot{margin-top:26px;padding-top:10px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;gap:14px;font-size:10.5px;color:var(--muted);flex-wrap:wrap;}

/* ── 按钮 ── */
.btn{appearance:none;font:inherit;font-size:12.5px;padding:7px 14px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);cursor:pointer;border-radius:2px;}
.btn:hover{border-color:var(--accent);color:var(--accent);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.primary:hover{opacity:.9;color:#fff;}
.btn.ghost{border-color:transparent;color:var(--muted);}
.btn.mini{padding:2px 7px;font-size:11.5px;line-height:1.4;}

/* ── 周视图：七天一行，总宽 90vw（从 980 容器里居中溢出） ── */
#weekRow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;
  width:90vw;position:relative;left:50%;transform:translateX(-50%);align-items:stretch;}
.day-card{border:1px solid var(--rule);background:#fff;padding:12px 12px 10px;position:relative;
  display:flex;flex-direction:column;min-width:0;transition:border-color .15s,box-shadow .15s;}
.day-card:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(47,93,80,.10);}
.day-card.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);}
.day-card.dragging{opacity:.35;}
.day-card.drop-target{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent);}
.drag{flex:none;cursor:grab;touch-action:none;color:var(--muted);font-size:13px;line-height:1;
  padding:2px 3px;border-radius:2px;user-select:none;}
.drag:hover{color:var(--accent);background:var(--accent-soft);}
.day-card .d-top{display:flex;align-items:baseline;gap:6px;margin-bottom:1px;min-width:0;}
.day-card .d-label{font-family:"Songti SC",SimSun,serif;font-size:17px;font-weight:700;color:var(--accent);flex:none;}
.day-card h3{margin:0;font-size:12.5px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.day-card .d-meta{font-size:10.5px;color:var(--muted);margin-bottom:7px;}
.day-card ol{margin:0;padding:0;list-style:none;}
.day-card li{display:flex;gap:4px;font-size:11px;padding:1px 0;white-space:nowrap;overflow:hidden;}
.day-card li .nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;}
.day-card li .v{flex:0 0 auto;color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums;}
.day-card .d-foot{margin-top:auto;padding-top:6px;border-top:1px dashed var(--rule);
  display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--muted);white-space:nowrap;}
.d-acts{margin-left:auto;display:flex;gap:2px;}
.d-acts button{appearance:none;border:1px solid transparent;background:none;color:var(--muted);
  font-size:13px;line-height:1;padding:3px 4px;cursor:pointer;border-radius:2px;}
.d-acts button:hover{color:var(--accent);background:var(--accent-soft);border-color:var(--accent-soft);}
.day-card.today h3{padding-right:30px;}
.today-chip{position:absolute;top:10px;right:10px;font-size:9.5px;background:var(--accent);color:#fff;padding:1px 6px;border-radius:2px;}
.drag-ghost{position:fixed;pointer-events:none;z-index:80;opacity:.92;transform:rotate(-1.5deg);
  box-shadow:0 10px 28px rgba(0,0,0,.22);} 

/* ── 工具条 ── */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 4px;}
.toolbar .spacer{flex:1;}

/* ── 编辑器 ── */
.editor{display:none;margin-top:10px;border:1px solid var(--rule);background:#fff;padding:14px;}
.editor.open{display:block;}
.editor-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;}
.day-chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{appearance:none;font:inherit;font-size:12px;padding:4px 10px;border:1px solid var(--rule);background:var(--paper);color:var(--muted);cursor:pointer;border-radius:2px;}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.editor-body{display:grid;grid-template-columns:320px 1fr;gap:14px;}
@media (max-width:760px){.editor-body{grid-template-columns:1fr;}}
.picker{border:1px solid var(--rule);max-height:380px;display:flex;flex-direction:column;}
.picker .p-tools{padding:8px;border-bottom:1px solid var(--rule);display:flex;gap:6px;flex-wrap:wrap;}
.picker input[type=search]{flex:1;min-width:120px;font:inherit;font-size:12px;padding:4px 8px;border:1px solid var(--rule);background:var(--paper);}
.picker ul{list-style:none;margin:0;padding:4px 0;overflow:auto;}
.picker li{display:flex;align-items:center;gap:8px;padding:4px 10px;font-size:12px;}
.picker li:hover{background:var(--accent-soft);}
.picker li .grow{flex:1;min-width:0;}
.picker li .sub{color:var(--muted);font-size:10.5px;}
.plan-box{border:1px solid var(--rule);}
.plan-box .p-head{display:flex;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--rule);font-size:12px;}
.plan-row{display:grid;grid-template-columns:1fr 56px 96px 26px 26px;gap:6px;align-items:center;padding:5px 10px;border-bottom:1px dashed var(--rule);font-size:12.5px;}
.plan-row:last-child{border-bottom:none;}
.plan-row input{font:inherit;font-size:12px;width:100%;padding:2px 5px;border:1px solid var(--rule);background:var(--paper);text-align:center;}
.plan-row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.plan-empty{padding:16px;color:var(--muted);font-size:12px;}

/* ── 分享 / 卡片 ── */
.mask{position:fixed;inset:0;background:rgba(20,18,14,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50;}
.mask.open{display:flex;}
.share-panel{background:var(--paper);padding:22px;width:560px;max-width:100%;max-height:86vh;overflow:auto;}
.share-panel h2{margin:0 0 4px;font-family:"Songti SC",SimSun,serif;font-size:20px;}
.share-panel .note{margin-bottom:12px;}
.share-panel textarea{width:100%;height:92px;font:12px/1.5 ui-monospace,Menlo,monospace;padding:8px;border:1px solid var(--rule);background:#fff;resize:vertical;}
.share-panel .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}

/* 分享卡（也是出图源；屏上自适应，导出时固定 720px） */
.card-wrap{background:#fff;padding:0;max-width:100%;}
.card{width:720px;max-width:100%;background:var(--paper);color:var(--ink);padding:34px 38px 28px;position:relative;}
.card::before{content:"";position:absolute;inset:12px;border:1px solid var(--accent);pointer-events:none;}
.card h2{margin:0 0 6px;font-family:"Songti SC","Noto Serif SC",serif;font-size:clamp(20px,3.4vw,28px);line-height:1.25;}
.card .c-sub{font-size:12.5px;color:var(--accent);font-weight:700;letter-spacing:.02em;margin-bottom:4px;}
.card .c-meta{font-size:11px;color:var(--muted);margin-bottom:18px;}
.card table{margin-top:2px;table-layout:fixed;}
.card td.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card th{font-size:10.5px;}
.card td{font-size:13.5px;padding:8px 8px;}
.card .c-foot{margin-top:16px;padding-top:10px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;font-size:11px;color:var(--muted);}
.card .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
.card .reps{text-align:right;color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;}
.card.week{padding:34px 38px 26px;}
.card.week h2{font-size:24px;margin-bottom:10px;}
.card.week .w-day{margin:0 0 9px;padding:0 0 7px;border-bottom:1px solid var(--rule);}
.card.week .w-day:last-child{border-bottom:none;}
.card.week .w-day .t{font-size:13.5px;font-weight:700;}
.card.week .w-day .t .k{font-family:"Songti SC",serif;color:var(--accent);margin-right:6px;font-size:15px;}
.card.week .w-day .l{font-size:11.5px;color:var(--muted);margin-top:1px;}
.card.week .w-day .m{font-size:11px;color:var(--muted);float:right;}

/* 卡片预览浮层 */
.preview-mask{position:fixed;inset:0;background:rgba(20,18,14,.72);display:none;overflow:auto;z-index:60;padding:24px 12px;}
.preview-mask.open{display:block;}
.preview-inner{display:flex;flex-direction:column;align-items:center;gap:14px;}
.preview-bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%;max-width:720px;}
.preview-bar .btn:not(.primary){background:var(--paper);color:var(--ink);}
.preview-bar .btn.primary{box-shadow:0 2px 8px rgba(0,0,0,.25);}

/* 卡片模式（?card=day|week）：只留卡片本身，方便截图 */
body.cardonly{background:#E8E4DA;}
body.cardonly > .sheet{display:none;}
body.cardonly #standalone{display:flex;justify-content:center;align-items:flex-start;padding:22px 12px;min-height:100vh;}
@media (max-width:760px){
  body.cardonly #standalone{padding:10px 4px;}
}

/* ── 档案页 ── */
details{margin:2px 0;border-bottom:1px solid var(--rule);padding:7px 2px;}
summary{cursor:pointer;font-size:13px;font-weight:600;list-style:none;}
summary::-webkit-details-marker{display:none;}
summary::before{content:"›";display:inline-block;width:14px;color:var(--accent);transition:transform .15s;}
details[open] summary::before{transform:rotate(90deg);}
details p{margin:6px 0 8px 14px;font-size:12.5px;color:#3a3730;}
.base-table input{width:74px;font:inherit;font-size:12px;padding:2px 6px;border:1px solid var(--rule);background:var(--paper);}
.base-table input:focus{outline:1px solid var(--accent);}

/* ── 打印 ── */
@media print{
  body{background:#fff;}
  .sheet{box-shadow:none;max-width:none;padding:0;}
  .masthead,.case-nav,.toolbar,.editor,.foot,.today-chip{display:none!important;}
  #weekRow{display:grid;grid-template-columns:repeat(3,1fr);width:100%;left:0;transform:none;}
  .day-card{break-inside:avoid;page-break-inside:avoid;border-color:#999;}
  .day-card.today{box-shadow:none;}
}

/* ── <1100：七列改横向滚动，卡固定宽 ── */
@media (max-width:1100px){
  #weekRow{display:flex;overflow-x:auto;width:100%;left:0;transform:none;gap:10px;
    scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding-bottom:6px;}
  #weekRow .day-card{flex:0 0 168px;scroll-snap-align:start;}
}

/* ── 窄屏（放最后：覆盖上面的基础规则） ── */
@media (max-width:520px){
  .masthead{flex-direction:column;align-items:flex-start;gap:6px;padding-top:16px;}
  .masthead h1{font-size:22px;}
  .masthead .tag{text-align:left;}
  .sec-head{flex-wrap:wrap;}
  .sec-head .hint{margin-left:0;flex-basis:100%;text-align:left;}
  .toolbar .btn{flex:1 1 auto;}
  .plan-row{grid-template-columns:1fr 1fr 30px 30px;row-gap:4px;padding:8px 10px;}
  .plan-row .nm{grid-column:1 / -1;white-space:normal;line-height:1.35;}
  .plan-box .p-head{flex-wrap:wrap;row-gap:2px;}
  .plan-box .p-head .note:last-child{display:none;}
}
</style>
</head>
<body>
<div class="sheet" id="sheet">
  <header class="masthead">
    <h1>薄肌减脂 · 训练方案<span class="thin">slimdown · 七日活动方案</span></h1>
    <div class="tag">版本 v1.0 · 2026-11-12<br>《slimdown 案例》</div>
  </header>

  <section>
    <div class="sec-head">
      <span class="no">01</span><h2>七日节奏 · 打开就知道今天练什么</h2>
      <span class="hint">跑量 30 km/周 · 力量 4 次 · 核心每天 5 分钟</span>
    </div>
    <div class="toolbar">
      <button class="btn primary" id="btnEdit">✏️ 编辑方案</button>
      <button class="btn" id="btnShare">🔗 分享链接</button>
      <button class="btn" id="btnPrint">🖨 打印</button>
      <span class="spacer"></span>
      <span class="note" id="stateNote"></span>
    </div>
    <div class="week-grid" id="weekRow"></div>
  </section>

  <section class="editor" id="editor">
    <div class="editor-head">
      <b style="font-size:13px">编辑</b>
      <div class="day-chips" id="dayChips"></div>
      <span class="spacer" style="flex:1"></span>
      <button class="btn mini" id="btnResetDay">还原本日</button>
      <button class="btn mini" id="btnLoadDefault">还原全部</button>
      <button class="btn mini primary" id="btnSave">保存到本机</button>
      <button class="btn mini" id="btnCloseEdit">收起</button>
    </div>
    <div class="editor-body">
      <div class="picker">
        <div class="p-tools">
          <input type="search" id="exSearch" placeholder="搜动作 / 别名">
          <div class="day-chips" id="exChips"></div>
        </div>
        <ul id="exList"></ul>
      </div>
      <div class="plan-box">
        <div class="p-head">
          <b id="editDayLabel">周一</b>
          <span class="note" id="editDaySum"></span>
          <span style="flex:1"></span>
          <span class="note">组数 / 次数可改，↑↓ 调序</span>
        </div>
        <div id="planList"></div>
      </div>
    </div>
  </section>


  <footer class="foot">
    <div>slimdown · 训练方案 v1.0 · 2026-11-12</div>
    <div><a href="exercises.html">动作库</a> · <a href="archive.html">档案</a> · 主版本 +1 / 次版本 +0.1</div>
  </footer>
</div>

<div class="mask" id="shareMask">
  <div class="share-panel">
    <h2>分享这套方案</h2>
    <div class="note">链接里带的是当前这份方案（不含任何个人数据），对方打开即可查看并另存。</div>
    <textarea id="shareUrl" readonly></textarea>
    <div class="row">
      <button class="btn primary" id="btnCopyUrl">复制链接</button>
      <button class="btn" id="btnCopyText">复制纯文本</button>
      <button class="btn ghost" id="btnCloseShare">关闭</button>
      <span class="spacer" style="flex:1"></span>
      <span class="note" id="shareLen"></span>
    </div>
  </div>
</div>

<div class="preview-mask" id="previewMask">
  <div class="preview-inner">
    <div class="preview-bar">
      <button class="btn primary" id="btnCopyImg">📋 复制图片</button>
      <button class="btn" id="btnDownloadImg">⬇️ 下载 PNG</button>
      <button class="btn ghost" id="btnClosePreview">关闭</button>
      <span class="note" id="imgNote" style="align-self:center"></span>
    </div>
    <div class="card-wrap" id="previewHost"></div>
  </div>

<script>/* slimdown 训练方案页 —— 周视图 / 编辑 / 本机保存 / 分享链接 / 截图卡 / 复制图片 */
(function () {
  'use strict';

  var DATA = window.SLIMDOWN || {};
  var META = DATA.plan || {};
  var EX = (DATA.exercises || []).slice();
  var BYID = {};
  EX.forEach(function (e) { BYID[e.id] = e; });

  var LS_KEY = 'slimdown:v1';
  var DEFAULTS = JSON.parse(JSON.stringify(META.days || []));
  var days = JSON.parse(JSON.stringify(DEFAULTS));
  var activeKey = days.length ? days[0].key : '';
  var dirty = false;
  var shared = false;

  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  function showToast(msg) {
    var t = document.getElementById('__toast');
    if (!t) {
      t = document.createElement('div');
      t.id = '__toast';
      t.style.cssText = 'position:fixed;left:50%;bottom:26px;transform:translateX(-50%);' +
        'background:#1B1A17;color:#fff;font-size:12.5px;padding:8px 16px;border-radius:3px;' +
        'opacity:0;transition:opacity .18s;z-index:99;pointer-events:none;max-width:80vw;text-align:center';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = '1';
    clearTimeout(t.__t);
    t.__t = setTimeout(function () { t.style.opacity = '0'; }, 1800);
  }
  function todayKey() {
    var map = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
    return map[new Date().getDay()];
  }
  function dayBy(key) {
    for (var i = 0; i < days.length; i++) if (days[i].key === key) return days[i];
    return days[0];
  }
  function sumSets(d) {
    return d.items.reduce(function (n, it) { return n + (parseInt(it.sets, 10) || 0); }, 0);
  }

  /* ── 渲染：周视图（七天一行） ── */
  function renderWeek() {
    var host = $('weekRow');
    var tk = todayKey();
    host.innerHTML = days.map(function (d) {
      var isToday = d.key === tk;
      var items = d.items.map(function (it) {
        var e = BYID[it.id];
        if (!e) return '';
        return '<li><span class="nm" title="' + esc(e.name) + '">' + esc(e.name) + '</span>' +
          '<span class="v">' + esc(it.sets) + '×' + esc(it.reps) + '</span></li>';
      }).join('');
      return '<div class="day-card' + (isToday ? ' today' : '') + '" data-day="' + esc(d.key) + '" tabindex="0">' +
        (isToday ? '<span class="today-chip">今天</span>' : '') +
        '<div class="d-top"><span class="drag" data-drag="' + esc(d.key) + '" title="拖拽换位（也可 Alt+←/→）">⠿</span>' +
        '<span class="d-label">' + esc(d.short || d.label.slice(-1)) + '</span>' +
        '<h3 title="' + esc(d.theme) + '">' + esc(d.theme) + '</h3></div>' +
        '<div class="d-meta">' + esc(d.label) + ' · ' + esc(d.duration) + '</div>' +
        '<ol>' + (items || '<li class="note">空</li>') + '</ol>' +
        '<div class="d-foot"><span>' + d.items.length + ' 个动作 共 ' + sumSets(d) + ' 组</span>' +
        '<span class="d-acts">' +
        '<button type="button" data-act="edit" data-day="' + esc(d.key) + '" title="编辑方案" aria-label="编辑' + esc(d.label) + '方案">✎</button>' +
        '<button type="button" data-act="preview" data-day="' + esc(d.key) + '" title="预览卡片" aria-label="预览' + esc(d.label) + '卡片">▣</button>' +
        '</span></div>' +
        '</div>';
    }).join('');
    host.querySelectorAll('button[data-act]').forEach(function (b) {
      b.addEventListener('click', function (ev) {
        ev.stopPropagation();
        var key = b.getAttribute('data-day');
        if (b.getAttribute('data-act') === 'edit') openEditor(key);
        else openPreview('day', key);
      });
    });
    bindDrag(host);
    $('stateNote').textContent = shared ? '正在查看分享方案' : (dirty ? '未保存（仅本次浏览器）' : '');
  }

  /* ── 拖拽换位：只换「这两天练什么」，星期标签不动 ── */
  var dragState = null;
  function bindDrag(host) {
    host.querySelectorAll('.drag').forEach(function (h) {
      h.addEventListener('pointerdown', function (ev) {
        ev.preventDefault();
        var card = h.closest('.day-card');
        var ghost = card.cloneNode(true);
        var r = card.getBoundingClientRect();
        ghost.className = 'drag-ghost day-card';
        ghost.style.width = r.width + 'px';
        ghost.style.left = r.left + 'px';
        ghost.style.top = r.top + 'px';
        document.body.appendChild(ghost);
        card.classList.add('dragging');
        dragState = { from: card.getAttribute('data-day'), ghost: ghost, card: card,
                      dx: ev.clientX - r.left, dy: ev.clientY - r.top, over: null };
        try { h.setPointerCapture(ev.pointerId); } catch (e) {}
        h.addEventListener('pointermove', onDragMove);
        h.addEventListener('pointerup', onDragEnd);
        h.addEventListener('pointercancel', onDragCancel);
      });
    });
  }
  function onDragMove(ev) {
    if (!dragState) return;
    var g = dragState.ghost;
    g.style.left = (ev.clientX - dragState.dx) + 'px';
    g.style.top = (ev.clientY - dragState.dy) + 'px';
    var el = document.elementFromPoint(ev.clientX, ev.clientY);
    var card = el && el.closest ? el.closest('.day-card') : null;
    if (card === dragState.ghost) card = null;
    if (dragState.over && dragState.over !== card) dragState.over.classList.remove('drop-target');
    dragState.over = (card && card !== dragState.card) ? card : null;
    if (dragState.over) dragState.over.classList.add('drop-target');
  }
  function onDragEnd(ev) {
    if (!dragState) return;
    var st = dragState;
    cleanupDrag();
    if (st.over) swapItems(st.from, st.over.getAttribute('data-day'));
  }
  function onDragCancel() { if (dragState) cleanupDrag(); }
  function cleanupDrag() {
    var st = dragState;
    dragState = null;
    if (!st) return;
    st.ghost.remove();
    st.card.classList.remove('dragging');
    document.querySelectorAll('.drop-target').forEach(function (x) { x.classList.remove('drop-target'); });
    var h = st.card.querySelector('.drag');
    if (h) {
      h.removeEventListener('pointermove', onDragMove);
      h.removeEventListener('pointerup', onDragEnd);
      h.removeEventListener('pointercancel', onDragCancel);
    }
  }
  function swapItems(aKey, bKey) {
    if (!aKey || !bKey || aKey === bKey) return;
    var a = dayBy(aKey), b = dayBy(bKey);
    ['theme', 'duration', 'items'].forEach(function (k) {
      var t = a[k]; a[k] = b[k]; b[k] = t;
    });
    markDirty(); renderWeek();
    saveLocal();
    showToast('已交换 ' + a.label + ' ↔ ' + b.label);
  }
  /* 键盘：卡片聚焦后 Alt+←/→ 与相邻日交换 */
  document.addEventListener('keydown', function (ev) {
    if (!ev.altKey || (ev.key !== 'ArrowLeft' && ev.key !== 'ArrowRight')) return;
    var card = document.activeElement && document.activeElement.closest
      ? document.activeElement.closest('.day-card') : null;
    if (!card) return;
    var i = days.findIndex(function (d) { return d.key === card.getAttribute('data-day'); });
    var j = i + (ev.key === 'ArrowRight' ? 1 : -1);
    if (i < 0 || j < 0 || j >= days.length) return;
    ev.preventDefault();
    swapItems(days[i].key, days[j].key);
  });

  /* ── 编辑器 ── */
  function openEditor(key) {
    activeKey = key || activeKey;
    $('editor').classList.add('open');
    renderEditor();
    $('editor').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  function renderEditor() {
    var d = dayBy(activeKey);
    $('dayChips').innerHTML = days.map(function (x) {
      return '<button class="chip' + (x.key === activeKey ? ' on' : '') + '" data-k="' + esc(x.key) + '">' +
        esc(x.label) + '</button>';
    }).join('');
    $('dayChips').querySelectorAll('.chip').forEach(function (b) {
      b.addEventListener('click', function () { activeKey = b.getAttribute('data-k'); renderEditor(); });
    });
    $('editDayLabel').textContent = d.label + ' · ' + d.theme;
    $('editDaySum').textContent = d.items.length + ' 个动作 / 共 ' + sumSets(d) + ' 组 / ' + d.duration;
    var box = $('planList');
    if (!d.items.length) {
      box.innerHTML = '<div class="plan-empty">这一天还没有动作，从左侧点 + 添加。</div>';
    } else {
      box.innerHTML = d.items.map(function (it, i) {
        var e = BYID[it.id] || { name: '（未知动作 ' + it.id + '）' };
        return '<div class="plan-row">' +
          '<span class="nm" title="' + esc(e.name) + '">' + esc(e.name) + '</span>' +
          '<input data-i="' + i + '" data-k="sets" value="' + esc(it.sets) + '" inputmode="numeric">' +
          '<input data-i="' + i + '" data-k="reps" value="' + esc(it.reps) + '">' +
          '<button class="btn mini" data-act="up" data-i="' + i + '" title="上移">↑</button>' +
          '<button class="btn mini" data-act="del" data-i="' + i + '" title="删除">×</button>' +
          '</div>';
      }).join('');
      box.querySelectorAll('input').forEach(function (inp) {
        inp.addEventListener('change', function () {
          var i = +inp.getAttribute('data-i');
          var k = inp.getAttribute('data-k');
          d.items[i][k] = k === 'sets' ? (parseInt(inp.value, 10) || 0) : inp.value;
          markDirty(); renderWeek(); renderEditor();
        });
      });
      box.querySelectorAll('button[data-act]').forEach(function (b) {
        b.addEventListener('click', function () {
          var i = +b.getAttribute('data-i');
          var act = b.getAttribute('data-act');
          if (act === 'del') d.items.splice(i, 1);
          if (act === 'up' && i > 0) {
            var t = d.items[i - 1]; d.items[i - 1] = d.items[i]; d.items[i] = t;
          }
          markDirty(); renderWeek(); renderEditor();
        });
      });
    }
    renderPicker();
  }

  var exFilter = 'all', exQuery = '';
  function renderPicker() {
    var chips = ['all'].concat(EX.map(function (e) { return e.equip; }).filter(function (v, i, a) { return a.indexOf(v) === i; }));
    $('exChips').innerHTML = chips.map(function (c) {
      return '<button class="chip' + (c === exFilter ? ' on' : '') + '" data-e="' + esc(c) + '">' +
        (c === 'all' ? '全部器材' : esc(c)) + '</button>';
    }).join('');
    $('exChips').querySelectorAll('.chip').forEach(function (b) {
      b.addEventListener('click', function () { exFilter = b.getAttribute('data-e'); renderPicker(); });
    });
    var q = exQuery.toLowerCase();
    var list = EX.filter(function (e) {
      if (exFilter !== 'all' && e.equip !== exFilter) return false;
      if (!q) return true;
      return (e.name + ' ' + (e.alias || '')).toLowerCase().indexOf(q) >= 0;
    });
    var d = dayBy(activeKey);
    var has = {};
    d.items.forEach(function (it) { has[it.id] = true; });
    $('exList').innerHTML = list.map(function (e) {
      return '<li><span class="grow"><b>' + esc(e.name) + '</b>' +
        '<span class="sub"> ' + esc(e.muscle) + ' · ' + esc(e.sets) + '×' + esc(e.reps) + '</span></span>' +
        '<button class="btn mini" data-add="' + esc(e.id) + '"' + (has[e.id] ? ' disabled' : '') + '>+</button></li>';
    }).join('') || '<li class="note" style="padding:10px">没有匹配的动作</li>';
    $('exList').querySelectorAll('button[data-add]').forEach(function (b) {
      b.addEventListener('click', function () {
        var e = BYID[b.getAttribute('data-add')];
        if (!e) return;
        d.items.push({ id: e.id, sets: e.sets, reps: e.reps });
        markDirty(); renderWeek(); renderEditor();
      });
    });
  }
  $('exSearch').addEventListener('input', function () { exQuery = this.value.trim(); renderPicker(); });

  /* ── 状态 ── */
  function markDirty() { dirty = true; shared = false; $('stateNote').textContent = '未保存（仅本次浏览器）'; }
  function saveLocal() {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify({ v: 1, days: days }));
      dirty = false; shared = false;
      $('stateNote').textContent = '已保存到本机';
      showToast('已保存到本机');
      setTimeout(function () { if (!dirty) $('stateNote').textContent = ''; }, 1600);
    } catch (e) { showToast('保存失败：浏览器禁用了本地存储'); }
  }
  function loadLocal() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (!raw) return false;
      var o = JSON.parse(raw);
      if (!o || o.v !== 1 || !Array.isArray(o.days) || !o.days.length) return false;
      days = o.days; return true;
    } catch (e) { return false; }
  }
  $('btnSave').addEventListener('click', saveLocal);
  $('btnCloseEdit').addEventListener('click', function () { $('editor').classList.remove('open'); });
  $('btnEdit').addEventListener('click', function () {
    if ($('editor').classList.contains('open')) { $('editor').classList.remove('open'); return; }
    openEditor(todayKey());
  });
  $('btnResetDay').addEventListener('click', function () {
    var d = dayBy(activeKey);
    for (var i = 0; i < DEFAULTS.length; i++) {
      if (DEFAULTS[i].key === d.key) { d.items = JSON.parse(JSON.stringify(DEFAULTS[i].items)); break; }
    }
    markDirty(); renderWeek(); renderEditor();
  });
  $('btnLoadDefault').addEventListener('click', function () {
    if (!confirm('还原成默认的七天方案？本机未保存的改动会丢。')) return;
    days = JSON.parse(JSON.stringify(DEFAULTS));
    try { localStorage.removeItem(LS_KEY); } catch (e) {}
    dirty = false; shared = false;
    renderWeek(); renderEditor(); showToast('已还原默认方案');
  });

  /* ── 分享编码 ──
     格式: v1|1=18*4~8%2D10,19*3~10%2F%E8%85%BF|2=...
     day 从 1 起；动作用库内序号（十进制）；sets*sets~encodeURIComponent(reps) */
  function numOf(id) { return parseInt(String(id).replace(/^ex/, ''), 10); }
  function idOf(n) { return 'ex' + (n < 10 ? '0' + n : String(n)); }
  function encodePlan() {
    return 'v2|' + days.map(function (d, i) {
      var def = DEFAULTS[i] || {};
      var th = d.theme === def.theme ? '' : encodeURIComponent(d.theme);
      var du = d.duration === def.duration ? '' : encodeURIComponent(d.duration);
      return (i + 1) + '=' + th + '!' + du + '!' +
        d.items.map(function (it) {
          return numOf(it.id) + '*' + (parseInt(it.sets, 10) || 0) + '~' + encodeURIComponent(it.reps);
        }).join(',');
    }).join('|');
  }
  function decodePlan(str) {
    var out = [], unknown = 0;
    var segs = String(str).split('|');
    var ver = segs[0];
    if (ver !== 'v1' && ver !== 'v2') return null;
    segs.slice(1).forEach(function (seg) {
      var p = seg.split('=');
      var d = days[parseInt(p[0], 10) - 1];
      if (!d) return;
      var theme = '', duration = '', itemsStr = p[1] || '';
      if (ver === 'v2') {
        var parts = itemsStr.split('!');
        theme = decodeURIComponent(parts[0] || '');
        duration = decodeURIComponent(parts[1] || '');
        itemsStr = parts[2] || '';
      }
      var items = [];
      itemsStr.split(',').forEach(function (tok) {
        if (!tok) return;
        var m = /^(\d+)\*(\d+)~(.*)$/.exec(tok);
        if (!m) return;
        var id = idOf(parseInt(m[1], 10));
        if (!BYID[id]) { unknown++; return; }
        items.push({ id: id, sets: parseInt(m[2], 10), reps: decodeURIComponent(m[3]) });
      });
      out.push({ key: d.key, items: items, theme: theme, duration: duration });
    });
    return { days: out, unknown: unknown };
  }
  function buildShareUrl() {
    var base = location.href.split('#')[0];
    return base + '#p=' + encodePlan();
  }
  function planText() {
    var L = ['【' + (META.title || '训练方案') + '】', ''];
    days.forEach(function (d) {
      L.push(d.label + ' · ' + d.theme + '（' + d.duration + '）');
      d.items.forEach(function (it, i) {
        var e = BYID[it.id];
        L.push('  ' + (i + 1) + '. ' + (e ? e.name : it.id) + ' ' + it.sets + '×' + it.reps);
      });
      L.push('');
    });
    if (META.meta) L.push(META.meta.goal + ' · ' + META.meta.steps);
    return L.join('\n');
  }

  $('btnShare').addEventListener('click', function () {
    var url = buildShareUrl();
    $('shareUrl').value = url;
    $('shareLen').textContent = url.length + ' 字符';
    $('shareMask').classList.add('open');
    setTimeout(function () { $('shareUrl').select(); }, 50);
  });
  $('btnCloseShare').addEventListener('click', function () { $('shareMask').classList.remove('open'); });
  $('shareMask').addEventListener('click', function (e) {
    if (e.target === this) this.classList.remove('open');
  });
  $('btnCopyUrl').addEventListener('click', function () {
    copyText(buildShareUrl(), '链接已复制');
  });
  $('btnCopyText').addEventListener('click', function () {
    copyText(planText(), '方案文本已复制');
  });

  /* ── 剪贴板（文本复制走 canonical 块；图片剪贴板见 cardToBlob 调用点） ── */
  /* ═══════ html-gen:clipboard-copy v1 BEGIN —— canonical, 四模板逐字节一致, 守卫测试锁定 ═══════ */
  function copyText(text, okMsg, failMsg, onOk) {
    var _toast = (typeof showToast === 'function') ? showToast
      : (typeof showKwToast === 'function') ? showKwToast
      : function (m) { try { console.log('[html-gen] ' + m); } catch (e) {} };
    var done = function () { if (onOk) onOk(); if (okMsg) _toast(okMsg); };
    var fail = function () { _toast(failMsg || '复制失败，请手动选中文本复制'); };
    var fallback = function () {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:-1000px;left:-1000px;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      if (ok) { done(); } else { fail(); }
    };
    if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done).catch(fallback);
    } else {
      fallback();                       /* 非安全上下文 ⇒ 直接回退, 不得依赖 catch */
    }
  }
  /* ═══════ html-gen:clipboard-copy v1 END ═══════ */

  /* ── 分享卡 ── */
  function cardRows(d) {
    return d.items.map(function (it) {
      var e = BYID[it.id] || { name: it.id };
      return '<tr><td class="nm">' + esc(e.name) + '</td>' +
        '<td class="num">' + esc(it.sets) + '</td>' +
        '<td class="reps">' + esc(it.reps) + '</td></tr>';
    }).join('');
  }
  function dateLine() {
    var d = new Date();
    var wk = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][d.getDay()];
    return d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' +
      String(d.getDate()).padStart(2, '0') + ' ' + wk;
  }
  function buildDayCard(dayKey) {
    var d = dayBy(dayKey);
    return '<div class="card" id="shareCard">' +
      '<h2>' + esc(d.label + ' · ' + d.theme) + '</h2>' +
      '<div class="c-sub">' + esc((META.meta && META.meta.slogan) || '薄肌减脂 · 阶段一') + '</div>' +
      '<div class="c-meta">' + esc(dateLine()) + ' · ' + esc(d.duration) + ' · 共 ' + sumSets(d) + ' 组</div>' +
      '<table><colgroup><col style="width:62%"><col style="width:16%"><col style="width:22%"></colgroup>' +
      '<thead><tr><th>动作</th><th style="text-align:right">组数</th><th style="text-align:right">次数</th></tr></thead>' +
      '<tbody>' + cardRows(d) + '</tbody></table>' +
      '<div class="c-foot"><span>' + esc((META.meta && META.meta.goal) || '') + '</span><span>slimdown</span></div>' +
      '</div>';
  }
  function buildWeekCard() {
    var body = days.map(function (d) {
      return '<div class="w-day"><div class="t"><span class="k">' + esc(d.short || '') + '</span>' +
        esc(d.theme) + '<span class="m">' + esc(d.duration) + '</span></div>' +
        '<div class="l">' + d.items.map(function (it) {
          var e = BYID[it.id];
          return esc(e ? e.name : it.id) + ' ' + esc(it.sets) + '×' + esc(it.reps);
        }).join(' · ') + '</div></div>';
    }).join('');
    return '<div class="card week" id="shareCard">' +
      '<h2>' + esc((META.title || '七日活动方案')) + '</h2>' +
      '<div class="c-meta">' + esc((META.meta && META.meta.slogan) || '') + ' · ' +
      esc((META.meta && META.meta.goal) || '') + '</div>' + body +
      '<div class="c-foot"><span>' + esc((META.meta && META.meta.steps) || '') + '</span><span>slimdown</span></div>' +
      '</div>';
  }
  var previewScope = 'day', previewKey = '';
  function openPreview(scope, key) {
    previewScope = scope;
    previewKey = key || todayKey();
    $('previewHost').innerHTML = scope === 'week' ? buildWeekCard() : buildDayCard(previewKey);
    $('imgNote').textContent = '';
    $('previewMask').classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  $('btnClosePreview').addEventListener('click', function () {
    $('previewMask').classList.remove('open');
    document.body.style.overflow = '';
  });

  /* ── DOM → PNG（零依赖：foreignObject + canvas） ── */
  function collectCss() {
    var css = '';
    for (var i = 0; i < document.styleSheets.length; i++) {
      var rules;
      try { rules = document.styleSheets[i].cssRules; } catch (e) { continue; }
      for (var j = 0; j < rules.length; j++) css += rules[j].cssText + '\n';
    }
    return css;
  }
  /* 导出 = 预览的实际 CSS 宽 ×1：预览多宽，PNG 就多宽（不再有隐藏的 2x/720 重排） */
  function cardToBlob(node) {
    var w = node.offsetWidth, h = node.offsetHeight;
    var clone = node.cloneNode(true);
    clone.removeAttribute('id');
    var css = collectCss();
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h +
      '" viewBox="0 0 ' + w + ' ' + h + '">' +
      '<foreignObject width="100%" height="100%">' +
      '<div xmlns="http://www.w3.org/1999/xhtml"><style><![CDATA[' + css + ']]></style>' +
      new XMLSerializer().serializeToString(clone) + '</div></foreignObject></svg>';
    var url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () {
        var cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        var ctx = cv.getContext('2d');
        ctx.fillStyle = '#FAF8F2';
        ctx.fillRect(0, 0, cv.width, cv.height);
        ctx.drawImage(img, 0, 0, w, h);
        cv.toBlob(function (b) {
          b ? resolve({ blob: b, w: w, h: h }) : reject(new Error('toBlob failed'));
        }, 'image/png');
      };
      img.onerror = function () { reject(new Error('SVG rasterize failed')); };
      img.src = url;
    });
  }
  function download(blob, name) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  function fileName() {
    var d = new Date();
    return 'slimdown-' + (previewScope === 'week' ? 'week' : (previewKey || todayKey())) + '-' +
      d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') + '.png';
  }
  $('btnCopyImg').addEventListener('click', function () {
    var node = $('shareCard');
    if (!node) return;
    $('imgNote').textContent = '生成中…';
    cardToBlob(node).then(function (r) {
      var blob = r.blob, size = r.w + '×' + r.h;
      if (window.isSecureContext && navigator.clipboard && window.ClipboardItem) {
        return navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
          .then(function () { $('imgNote').textContent = '已复制 · ' + size; })
          .catch(function () { download(blob, fileName()); $('imgNote').textContent = '复制被拒绝，已下载 ' + size; });
      }
      download(blob, fileName());
      $('imgNote').textContent = '当前环境不支持复制图片，已下载 PNG ' + size;
    }).catch(function (e) {
      $('imgNote').textContent = '导出失败：' + e.message + '（可改用截图）';
    });
  });
  $('btnDownloadImg').addEventListener('click', function () {
    var node = $('shareCard');
    if (!node) return;
    cardToBlob(node).then(function (r) {
      download(r.blob, fileName());
      $('imgNote').textContent = '已下载 ' + r.w + '×' + r.h;
    }).catch(function (e) { $('imgNote').textContent = '导出失败：' + e.message; });
  });
  $('btnPrint').addEventListener('click', function () { window.print(); });

  /* ── 卡片模式（?card=day|week[&d=mon]）── */
  function cardMode() {
    var q = new URLSearchParams(location.search);
    var kind = q.get('card');
    if (!kind) return false;
    document.body.classList.add('cardonly');
    var host = document.createElement('div');
    host.id = 'standalone';
    var d = q.get('d');
    host.innerHTML = kind === 'week' ? buildWeekCard() : buildDayCard(d || todayKey());
    document.body.appendChild(host);
    document.title = (kind === 'week' ? '七日活动方案' : dayBy(d || todayKey()).label) + ' · slimdown';
    return true;
  }

  /* ── 启动 ── */
  function applyHash() {
    var m = /#p=(.+)$/.exec(location.hash || '');
    if (!m) return false;
    var res = decodePlan(m[1]);
    if (!res || !res.days.length) { showToast('分享链接已损坏，已按本机方案显示'); return false; }
    res.days.forEach(function (sd) {
      var d = dayBy(sd.key);
      if (!d) return;
      d.items = sd.items;
      if (sd.theme) d.theme = sd.theme;
      if (sd.duration) d.duration = sd.duration;
    });
    shared = true;
    if (res.unknown) showToast('已忽略 ' + res.unknown + ' 个未知动作');
    return true;
  }

  loadLocal();
  applyHash();
  if (!cardMode()) {
    renderWeek();
    $('stateNote').textContent = shared ? '正在查看分享方案（点「编辑 → 保存到本机」可存下）' : '';
  }
})();
</script>
</body>
</html>
