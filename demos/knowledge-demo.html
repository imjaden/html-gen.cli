<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>📚 HTML 技能知识库</title>
<style>
/* ═══════════════════════════════════════════
   style-guide.css
   Layer 1 — CSS 变量 + 基础组件
   来源：favorite-manager/index.html 深色主题
   版本：1.0(2026-07-01)
   ═══════════════════════════════════════════ */

:root {
  --cobalt-50: #eef2ff;
  --cobalt-100: #e0e7ff;
  --cobalt-400: #818cf8;
  --cobalt-500: #6366f1;
  --cobalt-600: #4f46e5;
  --cobalt-700: #4338ca;
  --cobalt-800: #3730a3;
  --cobalt-900: #312e81;
  --cobalt-950: #1e1b4b;
  --accent-400: #facc15;
  --accent-500: #eab308;
  --accent-600: #ca8a04;
  --surface-800: #1e1e2e;
  --surface-850: #181825;
  --surface-900: #11111b;
  --surface-950: #0a0a14;
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --radius-xl: 12px;
  --radius-full: 9999px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  background: var(--surface-950);
  color: #e0e0e0;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

h1 { font-size: 1.4rem; font-weight: 700; color: #f0f0f0; margin-bottom: 0.75rem; }
h2 { font-size: 1.15rem; font-weight: 600; color: #e0e0e0; margin: 1.25rem 0 0.5rem; }
h3 { font-size: 1rem; font-weight: 600; color: #d0d0d0; margin: 1rem 0 0.4rem; }
p  { margin-bottom: 0.6rem; }
a { color: var(--cobalt-400); text-decoration: none; }
a:hover { color: var(--cobalt-500); text-decoration: underline; }
code {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  background: rgba(255,255,255,0.06);
  padding: 2px 6px;
  border-radius: var(--radius-sm);
}
pre {
  background: #0d0d1a;
  border: 1px solid #2a2a3e;
  border-radius: var(--radius-md);
  padding: 12px 16px;
  overflow-x: auto;
  margin: 0.75rem 0;
}
pre code { background: none; padding: 0; }

/* ── Data Table ── */
.data-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
.data-table th {
  position: sticky; top: 0; z-index: 10;
  background: var(--surface-900);
  border-bottom: 1px solid #2a2a3e;
  padding: 8px 10px; text-align: left; font-size: 0.7rem; font-weight: 600;
  color: #9ca3af; text-transform: uppercase; letter-spacing: 0.05em;
  white-space: nowrap; user-select: none;
}
.data-table th.sortable { cursor: pointer; }
.data-table th.sortable::after { content: ' \25bc'; font-size: 10px; color: #555; }
.data-table th.sort-asc::after { content: ' \25b2'; color: var(--cobalt-400); }
.data-table th.sort-desc::after { content: ' \25bc'; color: var(--cobalt-400); }
.data-table td {
  padding: 8px 10px; border-bottom: 1px solid #1a1a2e;
  font-size: 0.8rem; vertical-align: middle;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.data-table tr { transition: background 0.15s; }
.data-table tbody tr:hover { background: rgba(79,70,229,0.08); }
.data-table tbody tr.selected { background: rgba(79,70,229,0.15); }

/* ── Badges ── */
.badge-red    { background: #3b1f1f; color: #f87171; }
.badge-yellow { background: #3b351f; color: #fbbf24; }
.badge-blue   { background: #1e3a5f; color: #60a5fa; }
.badge-black  { background: #1a1a1a; color: #9ca3af; border: 1px solid #333; }
.badge { display: inline-block; padding: 1px 8px; border-radius: var(--radius-full); font-size: 0.7rem; margin: 1px; }

/* ── Tag Pill ── */
.tag-pill {
  display: inline-block; padding: 1px 8px;
  border-radius: var(--radius-full);
  font-size: 0.7rem; margin: 1px;
  cursor: pointer; transition: opacity 0.15s;
}
.tag-pill:hover { opacity: 0.8; }

/* ── Input ── */
.input-dark {
  background: #0f0f1a;
  border: 1px solid #2a2a3e;
  color: #e0e0e0;
  padding: 6px 12px;
  border-radius: var(--radius-md);
  outline: none;
  font-size: 0.85rem;
  font-family: inherit;
}
.input-dark:focus { border-color: var(--cobalt-600); box-shadow: 0 0 0 2px rgba(79,70,229,0.2); }
.input-dark::placeholder { color: #555; }

/* ── Buttons ── */
.btn {
  padding: 6px 14px; border-radius: var(--radius-md);
  border: none; cursor: pointer; font-size: 0.8rem;
  font-family: inherit;
  transition: all 0.15s;
}
.btn-primary { background: var(--cobalt-600); color: white; }
.btn-primary:hover { background: var(--cobalt-700); }
.btn-danger { background: #dc2626; color: white; }
.btn-danger:hover { background: #b91c1c; }
.btn-ghost {
  background: transparent; color: #9ca3af;
  border: 1px solid #2a2a3e;
}
.btn-ghost:hover { color: #e0e0e0; border-color: #555; }
.btn-sm { padding: 3px 10px; font-size: 0.72rem; }

/* ── Pager ── */
.pager { display: flex; gap: 4px; justify-content: center; align-items: center; margin-top: 16px; }
.pager button { min-width: 32px; }

/* ── Batch Bar ── */
.batch-bar {
  display: none;
  background: var(--cobalt-950);
  border: 1px solid var(--cobalt-700);
  border-radius: var(--radius-lg);
  padding: 10px 16px; margin-bottom: 12px;
  align-items: center; gap: 12px;
}
.batch-bar.active { display: flex; }

/* ── Modal ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.6);
  display: none; align-items: center; justify-content: center;
  z-index: 100;
}
.modal-overlay.active { display: flex; }
.modal-box {
  background: var(--surface-900);
  border-radius: var(--radius-xl);
  padding: 20px 24px;
  width: 420px; max-width: 90vw;
  border: 1px solid #2a2a3e;
}
.modal-box h3 { font-size: 0.9rem; font-weight: 700; color: #f0f0f0; margin-bottom: 12px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

/* ── Utility ── */
.card { background: var(--surface-900); border: 1px solid #1a1a2e; border-radius: var(--radius-lg); overflow: hidden; }
.wrapper { max-width: 1400px; margin: 0 auto; padding: 16px 20px; }
.flex { display: flex; }
.flex-1 { flex: 1; }
.gap-2 { gap: 8px; }
.gap-3 { gap: 12px; }
.mb-3 { margin-bottom: 12px; }
.text-xs { font-size: 0.75rem; }
.text-gray { color: #9ca3af; }
.w-full { width: 100%; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #2a2a3e; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #3a3a5e; }

</style>
<style>
/* ── Layout ── */
.kw-wrapper { display: flex; height: 100vh; overflow: hidden; }
.kw-main { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }

/* ── Top Tab Bar ── */
.kw-tab-bar {
  height: 48px; min-height: 48px;
  display: flex; align-items: stretch;
  background: var(--surface-900);
  border-bottom: 1px solid #2a2a3e;
  overflow-x: auto; overflow-y: hidden;
  flex-shrink: 0;
}
.kw-tab-bar::-webkit-scrollbar { height: 0; }
.kw-tab {
  display: flex; align-items: center; gap: 6px;
  padding: 0 20px; cursor: pointer; white-space: nowrap;
  font-size: 0.82rem; font-weight: 500;
  color: #9ca3af; border-bottom: 2px solid transparent;
  transition: all 0.15s; flex-shrink: 0;
  user-select: none;
}
.kw-tab:hover { background: rgba(79,70,229,0.04); color: #e0e0e0; }
.kw-tab.active { color: var(--cobalt-400); border-bottom-color: var(--cobalt-600); }
.kw-tab .kw-tab-icon { font-size: 0.9rem; }

/* ── Sidebar ── */
.kw-sidebar {
  width: 240px; min-width: 240px;
  background: var(--surface-900);
  border-right: 1px solid #2a2a3e;
  display: flex; flex-direction: column;
  overflow-y: auto;
}
.kw-sidebar-header {
  padding: 14px 16px 10px;
  border-bottom: 1px solid #2a2a3e;
  flex-shrink: 0;
}
.kw-sidebar-header .logo { font-size: 0.82rem; font-weight: 700; color: var(--cobalt-400); }
.kw-sidebar-header .sub { font-size: 0.7rem; color: #6b7280; margin-top: 2px; }
.kw-sections { flex: 1; overflow-y: auto; padding: 6px 0; display: none; }
.kw-sections.active { display: block; }

.kw-section-title {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 16px 4px;
  font-size: 0.7rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.06em;
  color: #6b7280; cursor: default; user-select: none;
}
.kw-section-title .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

.kw-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 16px 8px 28px;
  cursor: pointer; transition: all 0.12s;
  border-left: 3px solid transparent;
  color: #9ca3af; font-size: 0.82rem;
}
.kw-item:hover { background: rgba(79,70,229,0.04); color: #e0e0e0; }
.kw-item.active { background: rgba(79,70,229,0.08); color: var(--cobalt-400); border-left-color: var(--cobalt-600); }
.kw-item .kw-item-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kw-item .kw-item-badge {
  font-size: 0.62rem; padding: 1px 6px; border-radius: 8px;
  font-weight: 600; letter-spacing: 0.02em; flex-shrink: 0;
}

/* ── Content area ── */
.kw-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--surface-950); }
.kw-toolbar {
  height: 44px; min-height: 44px;
  display: flex; align-items: center;
  padding: 0 20px; gap: 10px;
  background: var(--surface-900);
  border-bottom: 1px solid #2a2a3e;
  flex-shrink: 0;
}
.kw-toolbar .page-title { font-size: 0.85rem; font-weight: 600; color: #e0e0e0; }
.kw-toolbar .page-breadcrumb { font-size: 0.72rem; color: #6b7280; }
.kw-toolbar .page-badge { font-size: 0.65rem; padding: 2px 8px; border-radius: 4px; background: rgba(79,70,229,0.1); color: var(--cobalt-400); border: 1px solid rgba(79,70,229,0.2); margin-left: auto; }
.kw-body { flex: 1; overflow-y: auto; padding: 24px 32px; }

/* ── Welcome ── */
.kw-welcome {
  display: none; flex: 1; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 12px; padding: 40px 20px; text-align: center;
}
.kw-welcome.active { display: flex; }
.kw-welcome .w-title { font-size: 1.3rem; font-weight: 700; color: #e0e0e0; }
.kw-welcome .w-sub { font-size: 0.85rem; color: #6b7280; max-width: 440px; line-height: 1.7; }
.kw-welcome .w-legend { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
.kw-welcome .w-legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.78rem; color: #9ca3af; }
.kw-welcome .w-legend-item .ldot { width: 8px; height: 8px; border-radius: 50%; }

/* ── Content iframe ── */
.kw-frame-wrap { display: none; flex: 1; flex-direction: column; }
.kw-frame-wrap.active { display: flex; }
.kw-frame-wrap iframe { width: 100%; flex: 1; border: none; background: var(--surface-950); }

/* ── Responsive ── */
@media (max-width: 768px) {
  .kw-sidebar { display: none; position: fixed; top: 0; left: 0; width: 240px; height: 100vh; z-index: 100; }
  .kw-sidebar.open { display: flex; box-shadow: 4px 0 20px rgba(0,0,0,0.5); }
  .kw-body { padding: 16px; }
}

/* ── Scrollbar ── */
.kw-sidebar::-webkit-scrollbar { width: 4px; }
.kw-sidebar::-webkit-scrollbar-thumb { background: #2a2a3e; border-radius: 2px; }
</style>

<script>
(function() {
  // ══════ Data Injection ══════
  const GROUPS = [{"key": "Agent 能力", "label": "Agent 能力", "icon": ""}, {"key": "HTML 模板", "label": "HTML 模板", "icon": ""}, {"key": "hs CLI", "label": "hs CLI", "icon": ""}];
  const ITEMS  = [{"group": "Agent 能力", "title": "Codex CLI", "subtitle": "OpenAI", "badge": "能讲", "section": "能力对比", "desc": "OpenAI 的自主编码 Agent。95k⭐，Apache 2.0 开源，Rust 核心 + Node CLI。支持 ChatGPT Plus 登录，无需额外付费。四端覆盖：CLI / IDE 插件（VS Code/Cursor/Windsurf）/ 桌面 App / Web。"}, {"group": "Agent 能力", "title": "Claude Code", "subtitle": "Anthropic", "badge": "理解", "section": "能力对比", "desc": "Anthropic 的编码 Agent。深度优化 Claude 模型能力，工具调用/长上下文/agentic loop 为 Claude 量身定制。需 Pro/Max 订阅或 API Key。"}, {"group": "Agent 能力", "title": "OpenCode", "subtitle": "开源", "badge": "知道", "section": "能力对比", "desc": "Provider-agnostic 开源编码 Agent。已配置 DeepSeek V4 / OpenAI / Xiaomi 三个 provider。"}, {"group": "Agent 能力", "title": "Hermes Agent", "subtitle": "Nous Research", "badge": "能输出", "section": "框架", "desc": "个人 AI 助手框架。15 层级 Agent Loop、Memory/Skill/Session 管理、MCP 集成、多 Provider 切换。当前主力 Agent 框架。"}, {"group": "Agent 能力", "title": "Agent Loop 机制", "subtitle": "核心方法论", "badge": "能输出", "section": "框架", "desc": "Think → Act → Observe → Verify 闭环。已实现 LLM 接口 / ToolBase / Verifier / Budget / LoopState / Agent 主循环。内置 8 个工具：web_search、web_extract、read_file、write_file、run_python、html_gen_doc、html_gen_table、html_gen_cards。"}, {"group": "HTML 模板", "title": "A 型 · 数据表格", "subtitle": "layout-table.html", "badge": "完成", "section": "模板", "desc": "数据表格浏览模板。功能：搜索/排序/分页。CLI：html-gen table -d data.json"}, {"group": "HTML 模板", "title": "B 型 · 文档阅读", "subtitle": "layout-doc.html", "badge": "完成", "section": "模板", "desc": "单文档阅读模板。功能：TOC 侧边栏/代码复制/章节高亮。CLI：html-gen doc -i report.md"}, {"group": "HTML 模板", "title": "C 型 · 知识库", "subtitle": "layout-knowledge.html", "badge": "新增", "section": "模板", "desc": "知识库浏览模板。顶部类目 + 左侧章节 + 右侧内容。方案 A：顶部主导。CLI：html-gen knowledge -d data.json"}, {"group": "HTML 模板", "title": "style-guide.css", "subtitle": "Layer 1", "badge": "完成", "section": "样式基座", "desc": "深色主题 CSS 变量 + 14 个基础组件。零外部依赖。被所有 Layout 模板共享。"}, {"group": "HTML 模板", "title": "html-gen.py", "subtitle": "Layer 3", "badge": "完成", "section": "样式基座", "desc": "CLI 生成器。doc/table/knowledge 三个子命令。读取模板 → inline CSS → 注入数据 → 输出自包含 HTML。"}, {"group": "hs CLI", "title": "多端口 Kill", "subtitle": "hs kill 8085 8086", "badge": "完成", "section": "新增功能", "desc": "hs kill 支持多端口，紧凑输出一行一个。"}, {"group": "hs CLI", "title": "多端口 Status", "subtitle": "hs status 8080 8083", "badge": "完成", "section": "新增功能", "desc": "hs status 支持多端口查询，紧凑输出。"}, {"group": "hs CLI", "title": "info 别名", "subtitle": "hs info 8080", "badge": "完成", "section": "新增功能", "desc": "hs info 为 status 的别名。"}, {"group": "hs CLI", "title": "URL 含 Index 路径", "subtitle": "--index 时 URL 含路径", "badge": "完成", "section": "新增功能", "desc": "明确指定 index 时 URL 追加 /{index_page}。默认 index.html 为裸 URL。"}, {"group": "hs CLI", "title": "未注册端口探测", "subtitle": "lsof + ps", "badge": "完成", "section": "新增功能", "desc": "端口未被 hs 管理时，自动 lsof + ps 查进程信息。"}];

  // ══════ State ══════
  let activeGroup = GROUPS.length > 0 ? GROUPS[0].key : '';
  let activeItem = null;

  // ── Colors for groups ──
  const COLORS = ['#38bdf8','#34d399','#c084fc','#fb923c','#f472b6','#fbbf24','#818cf8'];

  // ── Badge colors ──
  const BADGE_COLORS = {
    '知道':   {bg: 'rgba(56,189,248,0.12)', color: '#38bdf8', border: 'rgba(56,189,248,0.25)'},
    '理解':   {bg: 'rgba(52,211,153,0.12)', color: '#34d399', border: 'rgba(52,211,153,0.25)'},
    '能讲':   {bg: 'rgba(192,132,252,0.12)', color: '#c084fc', border: 'rgba(192,132,252,0.25)'},
    '能输出':  {bg: 'rgba(251,146,60,0.12)', color: '#fb923c', border: 'rgba(251,146,60,0.25)'},
  };

  // ── Render top tabs ──
  function renderTabs() {
    var bar = document.getElementById('kwTabBar');
    bar.innerHTML = (GROUPS || []).map(function(g, i) {
      var c = COLORS[i % COLORS.length];
      return '<div class="kw-tab' + (g.key === activeGroup ? ' active' : '') + '" data-key="' + g.key + '" onclick="switchGroup(\'' + g.key + '\')">' +
        (g.icon ? '<span class="kw-tab-icon">' + g.icon + '</span>' : '<span class="kw-tab-icon" style="color:' + c + '">●</span>') +
        g.label + '</div>';
    }).join('');
    renderSidebar();
  }

  window.switchGroup = function(key) {
    activeGroup = key;
    activeItem = null;
    document.querySelectorAll('.kw-tab').forEach(function(t) {
      t.classList.toggle('active', t.dataset.key === key);
    });
    renderSidebar();
    showWelcome();
  };

  // ── Render sidebar ──
  function renderSidebar() {
    var container = document.getElementById('kwSectionsContainer');
    var groupItems = ITEMS.filter(function(item) { return item.group === activeGroup; });

    // Group by subcategory (section), or just list them
    var sections = {};
    groupItems.forEach(function(item) {
      var sec = item.section || item.group || 'default';
      if (!sections[sec]) sections[sec] = [];
      sections[sec].push(item);
    });

    var html = '';
    var keys = Object.keys(sections);
    keys.forEach(function(sec, si) {
      var ci = GROUPS.findIndex(function(g) { return g.key === activeGroup; });
      var c = COLORS[Math.max(0, ci) % COLORS.length];
      if (keys.length > 1) {
        html += '<div class="kw-section-title"><span class="dot" style="background:' + c + '"></span>' + sec + '</div>';
      }
      sections[sec].forEach(function(item) {
        var badgeHtml = '';
        if (item.badge) {
          var bc = BADGE_COLORS[item.badge] || {bg: 'rgba(255,255,255,0.04)', color: '#6b7280', border: 'transparent'};
          badgeHtml = '<span class="kw-item-badge" style="background:' + bc.bg + ';color:' + bc.color + ';border:1px solid ' + bc.border + '">' + item.badge + '</span>';
        }
        html += '<div class="kw-item" onclick="selectItem(\'' + item.title.replace(/'/g,"\\'") + '\')">' +
          '<span class="kw-item-text">' + item.title + '</span>' + badgeHtml + '</div>';
      });
    });

    container.innerHTML = html || '<div style="padding:20px;text-align:center;color:#6b7280;font-size:0.78rem;">暂无内容</div>';
  }

  // ── Select item ──
  window.selectItem = function(title) {
    activeItem = title;
    document.querySelectorAll('.kw-item').forEach(function(el) {
      el.classList.toggle('active', el.querySelector('.kw-item-text').textContent === title);
    });

    var item = ITEMS.find(function(i) { return i.title === title; });
    if (!item) return;

    document.getElementById('welcomePanel').classList.remove('active');
    document.getElementById('frameWrap').classList.add('active');

    var group = GROUPS.find(function(g) { return g.key === item.group; });
    document.getElementById('pageTitle').textContent = '📄 ' + item.title;
    document.getElementById('pageBreadcrumb').textContent = (group ? group.label : '') + ' · ' + (item.subtitle || '');
    var badgeEl = document.getElementById('pageBadge');
    if (item.badge) {
      badgeEl.textContent = item.badge;
      badgeEl.style.display = 'inline-block';
    } else {
      badgeEl.style.display = 'none';
    }

    var body = document.getElementById('kwBody');
    if (item.desc) {
      body.innerHTML = '<div style="color:#e0e0e0;line-height:1.8;font-size:0.88rem;">' +
        item.desc.replace(/\n/g, '<br>') + '</div>';
    } else {
      body.innerHTML = '<div style="color:#6b7280;text-align:center;padding:40px;">请配置 desc 内容</div>';
    }
  };

  function showWelcome() {
    document.getElementById('welcomePanel').classList.add('active');
    document.getElementById('frameWrap').classList.remove('active');
    document.getElementById('pageTitle').textContent = '📂 ' + (GROUPS.find(function(g) { return g.key === activeGroup; }) || {}).label || '';
    document.getElementById('pageBreadcrumb').textContent = '';
    document.getElementById('pageBadge').style.display = 'none';
  }

  // ── Legend ──
  function renderLegend() {
    var el = document.getElementById('wLegend');
    el.innerHTML = (GROUPS || []).map(function(g, i) {
      var c = COLORS[i % COLORS.length];
      return '<span class="w-legend-item"><span class="ldot" style="background:' + c + '"></span> ' + g.label + '</span>';
    }).join('');
  }

  renderTabs();
  renderLegend();
})();
</script>
</body>
</html>
