<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全球国家速查表（195 国）</title>
<style>
/* ═══════════════════════════════════════════
   style-guide.css
   Layer 1 — CSS 变量 + 基础组件
   来源：favorite-manager/index.html 深色主题
   版本：1.0(2026-07-01)
   ═══════════════════════════════════════════ */

:root {
  --cobalt-50: #eef2ff;
  --cobalt-100: #e0e7ff;
  --cobalt-400: #818cf8;
  --cobalt-500: #6366f1;
  --cobalt-600: #4f46e5;
  --cobalt-700: #4338ca;
  --cobalt-800: #3730a3;
  --cobalt-900: #312e81;
  --cobalt-950: #1e1b4b;
  --accent-400: #facc15;
  --accent-500: #eab308;
  --accent-600: #ca8a04;
  --surface-800: #1e1e2e;
  --surface-850: #181825;
  --surface-900: #11111b;
  --surface-950: #0a0a14;
  --text-primary: #f0f0f0;
  --text-body: #e0e0e0;
  --text-secondary: #9ca3af;
  --text-muted: #6b7280;
  --text-faint: #555555;
  --border-strong: #2a2a3e;
  --border-soft: #1a1a2e;
  --code-bg: #0d0d1a;
  --code-text: #b0b0c0;
  --code-cmd: #e0e0e0;
  --hero-title-from: #ffffff;
  --gh-corner-fill: rgba(0,0,0,0.41);
  --gh-octocat: var(--text-secondary);
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --radius-xl: 12px;
  --radius-full: 9999px;
}

/* ── Light Theme（浅色变量组；模板页另有局部覆盖，此处为基座） ── */
:root.light {
  --surface-950: #f5f5f5;
  --surface-900: #ffffff;
  --surface-850: #f0f0f0;
  --surface-800: #e8e8e8;
  --cobalt-950: #eef2ff;
  --cobalt-600: #6366f1;
  --cobalt-700: #4338ca;
  --cobalt-400: #6366f1;
  --cobalt-300: #818cf8;
  --text-primary: #1f2328;
  --text-body: #333333;
  --text-secondary: #57606a;
  --text-muted: #6e7681;
  --text-faint: #8b949e;
  --border-strong: #d0d7de;
  --border-soft: #e5e7eb;
  --code-bg: #f6f8fa;
  --code-text: #57606a;
  --code-cmd: #1f2328;
  --hero-title-from: #1f2328;
  --gh-corner-fill: rgba(0,0,0,0.75);
  --gh-octocat: #ffffff;
}
:root.light body { color: var(--text-body); background: var(--surface-950); }
:root.light h1 { color: var(--text-primary); }
:root.light h2 { color: var(--text-body); }
:root.light h3 { color: #333333; }
:root.light a { color: var(--cobalt-600); }
:root.light a:hover { color: var(--cobalt-700); }
:root.light code { background: rgba(0,0,0,0.06); color: #555555; }
:root.light pre { background: #f0f0f0; border-color: #dddddd; color: #333333; }

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  background: var(--surface-950);
  color: var(--text-body);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

h1 { font-size: 1.4rem; font-weight: 700; color: var(--text-primary); margin-bottom: 0.75rem; }
h2 { font-size: 1.15rem; font-weight: 600; color: var(--text-body); margin: 1.25rem 0 0.5rem; }
h3 { font-size: 1rem; font-weight: 600; color: #d0d0d0; margin: 1rem 0 0.4rem; }
p  { margin-bottom: 0.6rem; }
a { color: var(--cobalt-400); text-decoration: none; }
a:hover { color: var(--cobalt-500); text-decoration: underline; }
code {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  background: rgba(255,255,255,0.06);
  padding: 2px 6px;
  border-radius: var(--radius-sm);
}
pre {
  background: #0d0d1a;
  border: 1px solid #2a2a3e;
  border-radius: var(--radius-md);
  padding: 12px 16px;
  overflow-x: auto;
  margin: 0.75rem 0;
}
pre code { background: none; padding: 0; }

/* ── Data Table ── */
.data-table { width: 100%; border-collapse: collapse; }
.data-table th {
  position: sticky; top: 0; z-index: 10;
  background: var(--surface-900);
  border-bottom: 1px solid #2a2a3e;
  padding: 8px 10px; text-align: left; font-size: 0.7rem; font-weight: 600;
  color: #9ca3af; text-transform: uppercase; letter-spacing: 0.05em;
  white-space: nowrap; user-select: none;
}
.data-table th.sortable { cursor: pointer; }
.data-table th.sortable::after { content: ' \25bc'; font-size: 10px; color: #555; }
.data-table th.sort-asc::after { content: ' \25b2'; color: var(--cobalt-400); }
.data-table th.sort-desc::after { content: ' \25bc'; color: var(--cobalt-400); }
.data-table td {
  padding: 8px 10px; border-bottom: 1px solid #1a1a2e;
  font-size: 0.8rem; vertical-align: middle;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.data-table tr { transition: background 0.15s; }
.data-table tbody tr:hover { background: rgba(79,70,229,0.08); }
.data-table tbody tr.selected { background: rgba(79,70,229,0.15); }

/* ── Badges ── */
.badge-red    { background: #3b1f1f; color: #f87171; }
.badge-yellow { background: #3b351f; color: #fbbf24; }
.badge-blue   { background: #1e3a5f; color: #60a5fa; }
.badge-black  { background: #1a1a1a; color: #9ca3af; border: 1px solid #333; }
.badge { display: inline-block; padding: 1px 8px; border-radius: var(--radius-full); font-size: 0.7rem; margin: 1px; }

/* ── Tag Pill ── */
.tag-pill {
  display: inline-block; padding: 1px 8px;
  border-radius: var(--radius-full);
  font-size: 0.7rem; margin: 1px;
  cursor: pointer; transition: opacity 0.15s;
}
.tag-pill:hover { opacity: 0.8; }

/* ── Input ── */
.input-dark {
  background: #0f0f1a;
  border: 1px solid #2a2a3e;
  color: #e0e0e0;
  padding: 6px 12px;
  border-radius: var(--radius-md);
  outline: none;
  font-size: 0.85rem;
  font-family: inherit;
}
.input-dark:focus { border-color: var(--cobalt-600); box-shadow: 0 0 0 2px rgba(79,70,229,0.2); }
.input-dark::placeholder { color: #555; }

/* ── Buttons ── */
.btn {
  padding: 6px 14px; border-radius: var(--radius-md);
  border: none; cursor: pointer; font-size: 0.8rem;
  font-family: inherit;
  transition: all 0.15s;
}
.btn-primary { background: var(--cobalt-600); color: white; }
.btn-primary:hover { background: var(--cobalt-700); }
.btn-danger { background: #dc2626; color: white; }
.btn-danger:hover { background: #b91c1c; }
.btn-ghost {
  background: transparent; color: #9ca3af;
  border: 1px solid #2a2a3e;
}
.btn-ghost:hover { color: #e0e0e0; border-color: #555; }
.btn-sm { padding: 3px 10px; font-size: 0.72rem; }

/* ── Pager ── */
.pager { display: flex; gap: 4px; justify-content: center; align-items: center; margin-top: 16px; }
.pager button { min-width: 32px; }

/* ── Batch Bar ── */
.batch-bar {
  display: none;
  background: var(--cobalt-950);
  border: 1px solid var(--cobalt-700);
  border-radius: var(--radius-lg);
  padding: 10px 16px; margin-bottom: 12px;
  align-items: center; gap: 12px;
}
.batch-bar.active { display: flex; }

/* ── Modal ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.6);
  display: none; align-items: center; justify-content: center;
  z-index: 100;
}
.modal-overlay.active { display: flex; }
.modal-box {
  background: var(--surface-900);
  border-radius: var(--radius-xl);
  padding: 20px 24px;
  width: 420px; max-width: 90vw;
  border: 1px solid #2a2a3e;
}
.modal-box h3 { font-size: 0.9rem; font-weight: 700; color: #f0f0f0; margin-bottom: 12px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

/* ── Utility ── */
.card { background: var(--surface-900); border: 1px solid #1a1a2e; border-radius: var(--radius-lg); overflow: hidden; }
.wrapper { max-width: 1400px; margin: 0 auto; padding: 16px 20px; }
.flex { display: flex; }
.flex-1 { flex: 1; }
.gap-2 { gap: 8px; }
.gap-3 { gap: 12px; }
.mb-3 { margin-bottom: 12px; }
.text-xs { font-size: 0.75rem; }
.text-gray { color: #9ca3af; }
.w-full { width: 100%; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #2a2a3e; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #3a3a5e; }

</style>
<style>
/* ── Tabs ── */
.table-tabs { display:flex; gap:4px; margin-bottom:10px; overflow-x:auto; flex-wrap:nowrap; }
.table-tabs:empty { display:none; }
.tab-btn {
  padding:5px 14px; border-radius:6px 6px 0 0; cursor:pointer; font-size:0.72rem; font-weight:500;
  background:var(--surface-900); color:#6b7280; border:1px solid #1a1a2e; border-bottom:none;
  white-space:nowrap; transition:all 0.15s; user-select:none;
}
.tab-btn:hover { background:#1a1a2e; color:#d1d5db; }
.tab-btn.active { background:var(--cobalt-950); color:var(--cobalt-400); border-color:var(--cobalt-700); }
.tab-btn .count { display:inline-block; margin-left:4px; padding:1px 5px; border-radius:9999px;
  font-size:0.55rem; background:rgba(99,102,241,0.15); color:var(--cobalt-400); }
.tab-btn.active .count { background:rgba(99,102,241,0.25); }

/* ── Header bar ── */
.table-header { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
.table-header h1 { font-size:1rem; font-weight:700; margin:0; white-space:nowrap; }
.table-desc { margin:-4px 0 10px; font-size:0.78rem; line-height:1.7; color:#9ca3af; word-break:break-word; }
.table-desc:empty { display:none; }
.stat-pill { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:9999px;
  background:var(--surface-900); border:1px solid #1a1a2e; font-size:0.65rem; color:#9ca3af; white-space:nowrap; }
.stat-pill .num { font-weight:700; color:#e0e0e0; font-variant-numeric:tabular-nums; }
.filter-pill { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:6px;
  background:rgba(79,70,229,0.15); border:1px solid var(--cobalt-600); font-size:0.65rem; color:var(--cobalt-300); cursor:pointer; white-space:nowrap; }
.filter-pill:hover { background:rgba(79,70,229,0.25); }
.filter-pill .fp-close { font-weight:700; margin-left:2px; color:var(--cobalt-400); }
.data-table td.clickable-cell { cursor:pointer; }
.data-table td.clickable-cell:hover { background:rgba(79,70,229,0.08); }
.data-table .cell-pills { }
.data-table .cell-pill { display:inline-block; padding:0 6px; border-radius:9999px; font-size:0.7rem; line-height:1.5; vertical-align:middle; white-space:nowrap; background:rgba(79,70,229,0.12); color:var(--cobalt-400); border:1px solid rgba(79,70,229,0.2); margin:0 2px; }
.data-table .cell-pill.pill-clickable { cursor:pointer; }
.data-table .cell-pill.pill-clickable:hover { background:rgba(79,70,229,0.25); border-color:rgba(79,70,229,0.5); color:#fff; }
/* ── Videos 视频列 pill（独立类：max-width 不换行 + ellipsis 缩略） ── */
.data-table .video-pill { display:inline-block; max-width:180px; padding:0 6px; border-radius:9999px; font-size:0.7rem; line-height:1.5; vertical-align:middle; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; background:rgba(79,70,229,0.12); color:var(--cobalt-400); border:1px solid rgba(79,70,229,0.2); margin:1px 2px; cursor:pointer; }
.data-table .video-pill:hover { background:rgba(79,70,229,0.25); border-color:rgba(79,70,229,0.5); color:#fff; }
.data-table .video-pill.video-more { color:var(--cobalt-300); border-style:dashed; }
.data-table tr.keyboard-focus { outline:2px solid var(--cobalt-400); outline-offset:-2px; }

/* ── Batch toolbar ── */
.batch-bar { display:none; align-items:center; gap:8px; padding:6px 12px; background:rgba(79,70,229,0.12); border:1px solid var(--cobalt-600); border-radius:8px; margin-bottom:8px; }
.batch-bar.active { display:flex; }
.batch-bar .bb-text { font-size:0.72rem; color:var(--cobalt-300); font-weight:600; }
.batch-bar .bb-btn { padding:3px 10px; border-radius:4px; border:1px solid var(--cobalt-600); background:transparent; color:var(--cobalt-400); cursor:pointer; font-size:0.68rem; font-family:inherit; }
.batch-bar .bb-btn:hover { background:rgba(79,70,229,0.2); }

/* ── Fullscreen ── */
.wrapper.fullscreen { position:fixed; inset:0; z-index:999; background:var(--surface-950); padding:12px; overflow:auto; }
.fs-btn { padding:3px 10px; border-radius:4px; border:1px solid #2a2a3e; background:transparent; color:#6b7280; cursor:pointer; font-size:0.68rem; font-family:inherit; }
.fs-btn:hover { background:rgba(79,70,229,0.1); color:#e0e0e0; }

/* ── Ratio presets dropdown ── */
.ratio-dropdown { position:absolute; top:100%; right:0; background:var(--surface-900); border:1px solid #2a2a3e; border-radius:8px; z-index:50; min-width:130px; box-shadow:0 4px 16px rgba(0,0,0,0.4); margin-top:4px; display:none; }
.ratio-dropdown.show { display:block; }
.ratio-dropdown .ratio-opt { padding:6px 12px; cursor:pointer; font-size:0.72rem; color:#b0b0c0; white-space:nowrap; }
.ratio-dropdown .ratio-opt:hover { background:rgba(79,70,229,0.1); color:#e0e0e0; }
.ratio-dropdown .ratio-opt.active { color:var(--cobalt-400); font-weight:600; }
.ratio-wrap { position:relative; display:inline-block; }

@media print {
  .table-tabs, .table-header, .table-desc, .pager, .toast, .modal-overlay, .qs-overlay,
  .batch-bar, .col-toggle-wrap, .fs-btn, .split-drag, .split-preview { display: none !important; }
  .data-table th, .data-table td { color: #000; border-color: #ccc; }
  .data-table th { background: #f5f5f5; }
  body { background: #fff; }
  .wrapper { padding: 0; }
}

/* ── Frozen columns ── */
.data-table th.frozen-col, .data-table td.frozen-col {
  position: sticky; z-index: 11; background: var(--surface-900);
}
.data-table th.frozen-col { z-index: 12; }
.header-search { background:var(--surface-850); border:1px solid #2a2a3e; color:#e0e0e0; padding:5px 10px;
  border-radius:6px; font-size:0.72rem; outline:none; width:180px; }
.header-search:focus { border-color:var(--cobalt-600); }

/* ── Table ── */
.table-wrap { border:1px solid #1a1a2e; border-radius:var(--radius-lg); overflow-x:auto; }
.data-table { width:100%; min-width:600px; border-collapse:separate; border-spacing:0; table-layout:fixed; }
.data-table th {
  position:sticky; top:0; z-index:10; background:var(--surface-900); border-bottom:1px solid #2a2a3e;
  padding:6px 8px; text-align:left; font-size:0.65rem; font-weight:600; color:#9ca3af;
  text-transform:uppercase; letter-spacing:0.04em; white-space:nowrap; user-select:none;
  position:relative;
}
.data-table th.sortable { cursor:pointer; }
.data-table th.sortable:hover { color:var(--cobalt-400); }
.data-table th.sort-asc::after { content:' ▲'; color:var(--cobalt-400); font-size:9px; }
.data-table th.sort-desc::after { content:' ▼'; color:var(--cobalt-400); font-size:9px; }
.data-table th .resize-handle {
  position:absolute; top:0; right:0; bottom:0; width:5px; cursor:col-resize;
}
.data-table th .resize-handle:hover { background:var(--cobalt-600); }
.data-table td { padding:7px 8px; border-bottom:1px solid #1a1a2e; font-size:0.75rem;
  vertical-align:middle; max-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.data-table tbody tr { transition:background 0.12s; }
.data-table tbody tr:hover { background:rgba(79,70,229,0.07); }
.data-table tbody tr.selected { background:rgba(79,70,229,0.15); }
.data-table tbody tr.clickable { cursor:pointer; }
.col-checkbox { width:32px; text-align:center; }
.col-checkbox input { cursor:pointer; accent-color:var(--cobalt-500); }
.col-index-num { text-align:center; color:#6b7280; font-size:0.72rem; }

/* ── Actions ── */
.action-btn { display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px;
  border-radius:5px; border:1px solid #2a2a3e; cursor:pointer; font-size:0.62rem; color:#6b7280;
  background:transparent; transition:all 0.15s; margin:0 1px; }
.action-btn:hover { background:var(--cobalt-600); border-color:var(--cobalt-600); color:white; }

/* ── Column toggle ── */
.col-toggle-wrap { position:relative; display:inline-block; }
.col-toggle-dropdown {
  display:none; position:absolute; top:100%; right:0; z-index:50; margin-top:4px;
  background:var(--surface-900); border:1px solid #2a2a3e; border-radius:8px; padding:6px 0;
  min-width:200px; min-height:300px; max-height:400px; overflow-y:auto;
}
.col-toggle-dropdown.show { display:block; }
.col-toggle-dropdown label { display:flex; align-items:center; gap:6px; padding:4px 12px;
  font-size:0.72rem; color:#d1d5db; cursor:pointer; white-space:nowrap; }
.col-toggle-dropdown label:hover { background:rgba(79,70,229,0.1); }
.col-toggle-dropdown input { accent-color:var(--cobalt-500); }
.col-toggle-dropdown .settings-section { padding:4px 12px 2px; font-size:0.62rem; color:#6b7280; text-transform:uppercase; letter-spacing:0.04em; }
.col-toggle-dropdown .settings-radio { display:flex; align-items:center; gap:6px; padding:2px 12px; font-size:0.7rem; color:#d1d5db; cursor:pointer; }
.col-toggle-dropdown .settings-radio input { accent-color:var(--cobalt-500); margin:0; }
.col-toggle-divider { height:1px; background:#2a2a3e; margin:4px 0; }

/* ── Density ── */
.data-table.dense td { padding:2px 8px; font-size:0.7rem; }
.data-table.dense th { padding:3px 8px; font-size:0.6rem; }
.data-table.comfortable td { padding:10px 12px; font-size:0.82rem; }
.data-table.comfortable th { padding:10px 12px; font-size:0.72rem; }

/* ── Modal Panel ── */
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1000; justify-content:center; align-items:center; }
.modal-overlay.active { display:flex; }
.modal-panel { background:var(--surface-900); border:1px solid #2a2a3e; border-radius:12px; width:560px; max-width:90vw; max-height:80vh; overflow-y:auto; padding:20px 24px; animation:slideFadeIn 0.2s ease; }
.modal-panel h3 { font-size:1rem; color:#f0f0f0; margin:0 0 12px; }
.modal-panel .modal-close { position:absolute; top:12px; right:16px; background:none; border:none; color:#6b7280; cursor:pointer; font-size:1.2rem; }
.modal-panel .modal-field { display:flex; padding:4px 0; border-bottom:1px solid #1a1a2e; font-size:0.78rem; }
.modal-panel .modal-field .mf-label { color:#6b7280; width:80px; flex-shrink:0; }
.modal-panel .modal-field .mf-value { color:#e0e0e0; flex:1; word-break:break-all; }
.modal-panel .modal-field:last-child { border-bottom:none; }

/* ── Split View ── */
.wrapper.split-mode {
  display: grid;
  grid-template-columns: var(--spl-ratio, 40%) 5px 1fr;
  grid-template-rows: auto auto 1fr;
}
.wrapper.split-mode .table-tabs { grid-column: 1 / -1; }
.wrapper.split-mode .batch-bar { grid-column: 1 / -1; }
.wrapper.split-mode .table-main { overflow: auto; min-width: 200px; }
.wrapper.split-mode .split-drag { display: block !important; grid-column: 2; }
.wrapper.split-mode .split-preview { display: flex; }
.wrapper.split-mode .toast { display: none !important; }
.split-preview { display:none; flex-direction:column; background:var(--surface-900); border-left:1px solid #2a2a3e;
  min-width:200px; position:relative; }
.wrapper.split-mode .split-preview { display:flex; }
.split-preview-header { padding:10px 14px; border-bottom:1px solid #2a2a3e;
  font-size:0.82rem; font-weight:600; color:#f0f0f0;
  display:flex; align-items:center; gap:8px; }

    var cols = visibleCols();
    // 第 1 个可见非 actions 列 (用于默认分栏)
    var firstKeyCol = cols.find(function(c) { return c.type !== 'actions'; });
    var frozenOffsets = [];
    var fo = 0;
    cols.forEach(function(c) { frozenOffsets.push(c.freeze ? ' style="left:' + fo + 'px"' : ''); if (c.freeze) fo += 120; });

    tbody.innerHTML = pageData.map(function(row, pi) {
      var rowIdx = start + pi;
      var rowClass = [];
      if (selectedRows[rowIdx]) rowClass.push('selected');
      if (isRowClickable(row)) rowClass.push('clickable');
      var rowHtml = '<tr class="'+rowClass.join(' ')+'"'+(isRowClickable(row)?' onclick="handleRowClick('+rowIdx+')"':'')+'>';
      if (showRowSelect) {
        rowHtml += '<td class="col-checkbox"><input type="checkbox" '+(selectedRows[rowIdx]?'checked':'')+' onclick="event.stopPropagation();toggleRow('+rowIdx+')"></td>';
      }
      if (showIndex) {
        rowHtml += '<td class="col-index-num">' + (rowIdx + 1) + '</td>';
      }
      cols.forEach(function(col) {
        if (col.type === 'actions') {
          var stickyCls2 = col.stickyRight ? ' sticky-right' : '';
          rowHtml += '<td style="white-space:nowrap" class="'+stickyCls2.trim()+'">'+renderActions(col, row)+'</td>';
        } else {
          var val = row[col.key];
          if (col.type === 'pills') {
              var items = (val || '').toString().split(/[,，、/]+/).map(function(s){return s.trim();}).filter(Boolean);
              // pillFilter 默认开: 标签点击筛选, pillFilter: false 可关闭
              var pillsHtml = items.map(function(s){
                return '<span class="cell-pill'+(col.pillFilter !== false ? ' pill-clickable' : '')+'"'+
                  (col.pillFilter !== false ? ' onclick="event.stopPropagation();quickFilterBy(\''+escapeAttr(col.key)+'\',\''+escapeAttr(s)+'\',\'contains\')"' : '')+
                  '>'+escapeHtml(s)+'</span>';
              }).join('');
              var freezeCls = col.freeze ? ' frozen-col' : '';
              var stickyCls = col.stickyRight ? ' sticky-right' : '';
              var freezeStyle = frozenOffsets[cols.indexOf(col)] || '';
              // pills 列整格点击：onCellClick:'split' 时打开分栏（pill 标签点击仍为筛选，stopPropagation 隔离）
              var pillsTdOnclick = col.onCellClick === 'split' ? ' onclick="event.stopPropagation();openSplitAt('+rowIdx+')"' : '';
              rowHtml += '<td class="clickable-cell cell-pills'+(col.class?' '+col.class:'')+freezeCls+stickyCls+'"'+pillsTdOnclick+freezeStyle+'>'+pillsHtml+'</td>';
              return;
            }
            if (col.type === 'videos') {
              // 视频列：每视频一个 pill [图标] title (duration)；maxShow 折叠 "+N"，点击展开全部（不折叠回，re-render 重置）
              var videos = val;
              var vMaxShow = (col.videos && typeof col.videos.maxShow === 'number') ? col.videos.maxShow : 3;
              var vCount = Array.isArray(videos) ? videos.length : 0;
              var vVisible = Math.min(vCount, vMaxShow);
              var vHtml = '';
              for (var vi = 0; vi < vVisible; vi++) vHtml += renderVideoPill(videos[vi]);
              var vRestHtml = '';
              if (vCount > vVisible) {
                vRestHtml = '<span class="video-rest" style="display:none">';
                for (var vj = vVisible; vj < vCount; vj++) vRestHtml += renderVideoPill(videos[vj]);
                vRestHtml += '</span>';
              }
              var vMoreHtml = vCount > vVisible ? '<span class="video-pill video-more" onclick="event.stopPropagation();expandVideos(this)" title="展开全部">+' + (vCount - vVisible) + '</span>' : '';
              var freezeClsV = col.freeze ? ' frozen-col' : '';
              var stickyClsV = col.stickyRight ? ' sticky-right' : '';
              var freezeStyleV = frozenOffsets[cols.indexOf(col)] || '';
              rowHtml += '<td class="clickable-cell cell-pills'+(col.class?' '+col.class:'')+freezeClsV+stickyClsV+'"'+freezeStyleV+'>'+vHtml+vRestHtml+vMoreHtml+'</td>';
              return;
            }
            if (col.render) val = col.render(val, row);
          else if (col.format === 'thousands' && typeof val === 'number') val = val.toLocaleString('en-US');
          else if (col.escape) val = escapeHtml(String(val));
          else if (val === undefined || val === null) val = '';
          var freezeCls = col.freeze ? ' frozen-col' : '';
          var stickyCls = col.stickyRight ? ' sticky-right' : '';
          var freezeStyle = frozenOffsets[cols.indexOf(col)] || '';
          var qfKey = JSON.stringify(col.key).replace(/"/g, '&quot;');
          var qfVal = JSON.stringify(String(row[col.key]||'')).replace(/"/g, '&quot;');
          var tdOnclick = '';
          if (col.onCellClick === 'split') {
            tdOnclick = ' onclick="event.stopPropagation();openSplitAt('+rowIdx+')"';
          } else if (col.quickFilter === true) {
            // quickFilter 默认关: col.quickFilter === true 才启用单元格点击筛选
            tdOnclick = ' onclick="event.stopPropagation();quickFilterBy('+qfKey+','+qfVal+')"';
          } else if (col === firstKeyCol) {
            // 第 1 列默认分栏: 无其他 onclick handler 时打开 split
            tdOnclick = ' onclick="event.stopPropagation();openSplitAt('+rowIdx+')"';
          }
          rowHtml += '<td class="clickable-cell' + (col.class ? ' ' + col.class : '') + freezeCls + stickyCls + '"'+tdOnclick+freezeStyle+'>'+val+'</td>';
        }
      });
      rowHtml += '</tr>';
      // Expand detail row (accordion mode)
      if (expandedIdx === rowIdx) {
        var detailCols = COLUMNS.filter(function(c) { return c.key && c.type !== 'actions' && colVisibility[c.key] !== false; });
        rowHtml += '<tr class="expand-row"><td colspan="' + (showRowSelect ? cols.length + 1 : cols.length) + '">';
        rowHtml += '<div class="expand-grid">';
        detailCols.forEach(function(c) {
          var v = row[c.key]; if (v === null || v === undefined) v = '';
          var valHtml;
          if (Array.isArray(v) && c.type === 'videos') {
            // videos 数组特判：逐条渲染 [图标] title (duration) + url 链接（勿 String(v) → [object Object]）
            valHtml = renderVideoListHtml(v);
          } else {
            valHtml = escapeHtml(String(v));
          }
          rowHtml += '<div class="expand-item"><div class="ex-label">' + escapeHtml(c.label) + '</div><div class="ex-value">' + valHtml + '</div></div>';
        });
        rowHtml += '</div></td></tr>';
      }
      return rowHtml;
    }).join('');
    renderPager(totalPages);
  }

  function renderActions(col, row) {
    if (!col.actions) return '';
    return col.actions.map(function(act) {
      var onclick = '';
      if (act.copyKey) {
        onclick = 'event.stopPropagation();copyAction(' + JSON.stringify(row[act.copyKey] || '') + ')';
      } else if (act.hrefKey) {
        onclick = 'event.stopPropagation();window.open(' + JSON.stringify(row[act.hrefKey] || '').replace(/"/g, '&quot;') + ',"_blank","noopener,noreferrer")';
      } else if (act.handler) {
        onclick = 'event.stopPropagation();window.' + act.handler + '(event,' + JSON.stringify(row).replace(/\"/g, '&quot;') + ')';
      } else if (act.desc) {
        onclick = 'event.stopPropagation();showDemoAction(' + JSON.stringify((act.icon||'') + ' ' + act.label + ': ' + act.desc) + ')';
      }
      return '<button class="action-btn ' + (act.class||'') + '" onclick=\'' + onclick + '\' title="' + (act.label||'') + '">' + (act.icon || act.label) + '</button>';
    }).join('');
  }

  /* ── Demo action: show description toast ── */
  window.showDemoAction = function(msg) {
    showToast(msg);
  };

  function escapeAttr(s) { return String(s).replace(/'/g,"\\'").replace(/"/g,'&quot;'); }

  /* ── Videos column (col.type === 'videos') ── */
  // 平台图标映射：归一化 String(platform).trim().toLowerCase() 后匹配别名（抖音→douyin、B站→bilibili、YouTube→youtube）
  var VIDEO_PLATFORM_ICONS = {
    'douyin': '🎵', '抖音': '🎵',
    'bilibili': '📺', 'b站': '📺',
    'youtube': '▶️'
  };
  function videoPlatformIcon(platform) {
    var p = String(platform === undefined || platform === null ? '' : platform).trim().toLowerCase();
    return VIDEO_PLATFORM_ICONS[p] || '📹';
  }
  // pill 文案：[图标] title (duration)；title 缺省 → [图标] platform (duration)；均缺省 → [📹] (duration)
  function videoPillLabel(v) {
    var icon = videoPlatformIcon(v.platform);
    var dur = v.duration ? ' (' + v.duration + ')' : '';
    if (v.title) return icon + ' ' + v.title + dur;
    if (v.platform) return icon + ' ' + String(v.platform) + dur;
    return icon + dur;
  }
  // 单元格视频 pill：点击新标签页打开 url（noopener,noreferrer；onclick 转义沿用 actions 先例 JSON.stringify + &quot;）
  function renderVideoPill(v) {
    if (!v || typeof v !== 'object') return '';
    var url = v.url;
    if (url === undefined || url === null) return '';
    var label = videoPillLabel(v);
    var urlAttr = JSON.stringify(String(url)).replace(/\"/g, '&quot;');
    return '<span class="video-pill" title="' + escapeHtml(String(url)) + '" onclick="event.stopPropagation();window.open(' + urlAttr + ',\'_blank\',\'noopener,noreferrer\')">' + escapeHtml(label) + '</span>';
  }
  // 折叠 "+N"：点击展开全部（DOM 显示剩余 pill），不折叠回；跨 re-render 重置折叠态
  window.expandVideos = function(el) {
    var td = el.parentNode;
    var rest = td.querySelector('.video-rest');
    if (rest) rest.style.display = '';
    el.style.display = 'none';
  };
  // split 预览 / expand 行内展开：markdown 链接风格 [图标 title (duration)] —— label 为链接文本（点击打开 url），url 仅 hover title 可见
  function renderVideoListHtml(videos) {
    if (!Array.isArray(videos) || !videos.length) return '';
    return videos.map(function(v) {
      if (!v || typeof v !== 'object') return '';
      var url = v.url;
      var label = videoPillLabel(v);
      if (url) {
        var urlAttr = JSON.stringify(String(url)).replace(/\"/g, '&quot;');
        return '<div style="margin:2px 0;line-height:1.6">' +
          '<a class="video-split-link" href="javascript:void(0)" title="' + escapeHtml(String(url)) + '" onclick="event.stopPropagation();window.open(' + urlAttr + ',\'_blank\',\'noopener,noreferrer\')">' + escapeHtml(label) + '</a></div>';
      }
      return '<div style="margin:2px 0;line-height:1.6">' + escapeHtml(label) + '</div>';
    }).join('');
  }

  function getRowClickCol() {
    return COLUMNS.find(function(c){return c.onClick;});
  }

  function isRowClickable(row) {
    if (clickMode === 'tab') {
      var col = getRowClickCol();
      return col && col.onClick === 'url' && row.url;
    }
    // modal, split, or expand: any row is clickable
    return clickMode === 'modal' || clickMode === 'split' || clickMode === 'expand';
  }

  /* ── Stats ── */
  function updateStats() {
    document.getElementById('statTotal').textContent = DATA.length;
    var fp = document.getElementById('statFilteredPill');
    if (filtered.length !== DATA.length || quickFilter) {
      fp.style.display = 'inline-flex';
      document.getElementById('statFiltered').textContent = filtered.length;
    } else { fp.style.display = 'none'; }
    var sp = document.getElementById('statSelectedPill');
    if (showRowSelect) {
      var cnt = Object.keys(selectedRows).length;
      sp.style.display = cnt > 0 ? 'inline-flex' : 'none';
      document.getElementById('statSelected').textContent = cnt;
    }
    // Quick filter pill
    var qfEl = document.getElementById('quickFilterPill');
    if (quickFilter) {
      qfEl.style.display = 'inline-flex';
      var col = COLUMNS.find(function(c){return c.key===quickFilter.key;});
      qfEl.innerHTML = (col ? col.label : quickFilter.key) + ': ' + escapeHtml(quickFilter.value) + '<span class="fp-close" onclick="event.stopPropagation();clearQuickFilter()">✕</span>';
      qfEl.onclick = function() { clearQuickFilter(); };
    } else {
      qfEl.style.display = 'none';
    }
  }

  window.quickFilterBy = function(key, value, mode) {
    mode = mode || 'exact';
    if (quickFilter && quickFilter.key === key && quickFilter.value === value && (quickFilter.mode || 'exact') === mode) {
      quickFilter = null;  // toggle off
    } else {
      quickFilter = {key: key, value: value, mode: mode};
    }
    expandedIdx = -1;
    currentPage = 1;
    render();
  };

  window.clearQuickFilter = function() {
    quickFilter = null;
    currentPage = 1;
    render();
  };

  /* ── Pagination ── */
  function renderPager(totalPages) {
    var el = document.getElementById('pager');
    if (totalPages <= 1) { el.innerHTML = ''; return; }
    var h = '<button class="btn btn-ghost btn-sm" onclick="goPage(1)"'+(currentPage===1?' disabled':'')+'>‹‹</button>';
    h += '<button class="btn btn-ghost btn-sm" onclick="goPage('+(currentPage-1)+')"'+(currentPage===1?' disabled':'')+'>‹</button>';
    h += '<span class="text-xs text-gray" style="margin:0 8px;">'+currentPage+' / '+totalPages+'</span>';
    h += '<button class="btn btn-ghost btn-sm" onclick="goPage('+(currentPage+1)+')"'+(currentPage===totalPages?' disabled':'')+'>›</button>';
    h += '<button class="btn btn-ghost btn-sm" onclick="goPage('+totalPages+')\"'+(currentPage===totalPages?' disabled':'')+'>››</button>';
    el.innerHTML = h;
  }

  window.goPage = function(n) {
    var tp = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
    currentPage = Math.max(1, Math.min(n, tp));
    expandedIdx = -1;
    render();
  };

  /* ── Sort ── */
  function initThead() {
    var thead = document.getElementById('thead');
    var cols = visibleCols();
    // Ensure every column has an explicit width (Cinema-disciplined model)
    cols.forEach(function(c) {
      if (!c.width) c.width = c.type === 'actions' ? '100px' : '120px';
    });
    var frozenOffset = 0;
    var frozenStyles = [];
    cols.forEach(function(c) {
      var w = c.width ? parseInt(c.width) : 120;
      if (c.freeze) { frozenStyles.push('left:' + frozenOffset + 'px'); frozenOffset += w; }
      else { frozenStyles.push(''); }
    });
    thead.innerHTML = '<tr>' +
      (showIndex ? '<th class="col-index-num" style="width:42px">序号</th>' : '') +
      (showRowSelect ? '<th class="col-checkbox"><input type="checkbox" id="selectAll" onchange="toggleAll(event)"></th>' : '') +
      cols.map(function(c, ci) {
        var sortCls = '';
        if (c.sortable !== false && c.type !== 'actions') { sortCls = ' sortable'; if (sortKey === c.key) sortCls += sortAsc ? ' sort-asc' : ' sort-desc'; if (sortKey2 === c.key) sortCls += ' sort-asc'; }
        var freezeCls = c.freeze ? ' frozen-col' : '';
        var stickyCls = c.stickyRight ? ' sticky-right' : '';
        var freezeStyle = frozenStyles[ci] ? ' style="' + frozenStyles[ci] + '"' : '';
        return '<th class="' + sortCls + freezeCls + stickyCls + '"' + (c.sortable !== false ? ' onclick="sortBy(\'' + c.key + '\',event)"' : '') +
          ' style="width:' + c.width + '"' + freezeStyle + '>' + c.label + (columnResize ? '<span class="resize-handle" onmousedown="startResize(event,\'' + c.key + '\')"></span>' : '') + '</th>';
      }).join('') + '</tr>';
  }

  var sortKey2 = '', sortAsc2 = true;
  window.sortBy = function(key, event) {
    if (event && event.shiftKey) { if (sortKey2 === key) sortAsc2 = !sortAsc2; else { sortKey2 = key; sortAsc2 = true; } }
    else { if (sortKey === key) sortAsc = !sortAsc; else { sortKey = key; sortAsc = true; sortKey2 = ''; } }
    expandedIdx = -1; initThead(); render();
  };

  /* ── Row selection ── */
  window.toggleRow = function(idx) {
    if (selectedRows[idx]) delete selectedRows[idx]; else selectedRows[idx] = true;
    updateStats();
    render();
  };
  window.toggleAll = function(e) {
    var checked = e.target.checked;
    var start = (currentPage - 1) * PAGE_SIZE;
    for (var i = start; i < start + PAGE_SIZE && i < filtered.length; i++) {
      if (checked) selectedRows[i] = true; else delete selectedRows[i];
    }
    updateStats();
    render();
  };

  /* ── Row click ── */
  function handleRowClick(idx) {
    var row = filtered[idx];
    // tab mode: open in new tab (default)
    if (clickMode === 'tab') {
      var col = getRowClickCol();
      if (!col || col.onClick !== 'url' || !row.url) return;
      window.open(row.url, '_blank', 'noopener,noreferrer');
      return;
    }
    // modal mode: show popup
    if (clickMode === 'modal') {
      showModal(row);
      return;
    }
    // split mode: show preview panel
    if (clickMode === 'split') {
      activateSplit(row, idx);
      return;
    }
    // expand mode: toggle inline detail
    if (clickMode === 'expand') {
      if (expandedIdx === idx) {
        expandedIdx = -1;  // collapse
      } else {
        expandedIdx = idx;  // expand
      }
      render();
      return;
    }
  }
  window.handleRowClick = handleRowClick;

  /* ── Modal Panel ── */
  function showModal(row) {
    var cols = visibleCols({requireKey: true, excludeActions: true});
    var title = row[cols[0] && cols[0].key] || '详情';
    var html = '<div style="position:relative"><button class="modal-close" onclick="closeModal()" style="position:sticky;top:0;float:right;">✕</button><h3>'+escapeHtml(String(title))+'</h3>';
    html += cols.map(function(c) {
      var v = row[c.key]; if (v === null || v === undefined) v = '';
      return '<div class="modal-field"><span class="mf-label">'+escapeHtml(c.label)+'</span><span class="mf-value">'+escapeHtml(String(v))+'</span></div>';
    }).join('');
    html += '</div>';
    document.getElementById('modalPanel').innerHTML = html;
    document.getElementById('modalOverlay').classList.add('active');
  }
  window.showModal = showModal;
  window.closeModal = function() { document.getElementById('modalOverlay').classList.remove('active'); };

  // Generic action handlers for modal/split via action buttons
  window.skillModal = function(event, row) { showModal(row); };
  window.skillSplit = function(event, row) {
    // Find row index in filtered data for highlight
    for (var i = 0; i < filtered.length; i++) {
      if (filtered[i].name === row.name) { activateSplit(row, i); return; }
    }
    activateSplit(row, 0);
  };

  /* ── Skills-specific modal & split renderers ── */
  if (OPTIONS && OPTIONS.modalRenderer === 'skills') {
    window.skillModal = function(event, row) {
      var h = '<div style="position:relative">';
      h += '<button class="modal-close" onclick="closeModal()" style="position:sticky;top:0;float:right;background:none;border:none;color:#6b7280;font-size:1.2rem;cursor:pointer;z-index:1">✕</button>';
      h += '<h3 style="margin:0 0 14px;font-size:0.95rem;color:#f0f0f0">📋 Skill 详细信息</h3>';

      // Fields
      var fields = [
        {label:'名称', value: row.name},
        {label:'分类', value: row.category},
        {label:'作者', value: row.author || '-'},
        {label:'描述', value: row.description || '-'},
      ];
      fields.forEach(function(f) {
        h += '<div style="padding:5px 0;border-bottom:1px solid #1a1a2e;font-size:0.78rem;display:flex;gap:10px">';
        h += '<span style="color:#6b7280;min-width:60px;flex-shrink:0">'+escapeHtml(f.label)+'</span>';
        h += '<span style="color:#e0e0e0;word-break:break-all">'+escapeHtml(String(f.value))+'</span>';
        h += '</div>';
      });

      // Tags — computed from name words
      var tags = (row.name||'').split(/[-_]/).filter(function(s){return s.length>1;});
      h += '<div style="padding:5px 0;border-bottom:1px solid #1a1a2e;font-size:0.78rem;display:flex;gap:10px">';
      h += '<span style="color:#6b7280;min-width:60px;flex-shrink:0">标签</span>';
      h += '<span>';
      tags.forEach(function(t) {
        h += '<span style="display:inline-block;padding:1px 6px;border-radius:9999px;font-size:0.62rem;background:rgba(79,70,229,0.12);color:var(--cobalt-400);border:1px solid rgba(79,70,229,0.2);margin:1px">'+escapeHtml(t)+'</span>';
      });
      h += '</span></div>';

      // Version — tag style
      h += '<div style="padding:5px 0;border-bottom:1px solid #1a1a2e;font-size:0.78rem;display:flex;gap:10px">';
      h += '<span style="color:#6b7280;min-width:60px;flex-shrink:0">版本</span>';
      h += '<span style="display:inline-block;padding:1px 8px;border-radius:9999px;font-size:0.65rem;background:rgba(251,191,36,0.15);color:#fbbf24;border:1px solid rgba(251,191,36,0.3)">'+escapeHtml(row.version||'-')+'</span>';
      h += '</div>';

      // Path with copy button
      h += '<div style="padding:5px 0;border-bottom:1px solid #1a1a2e;font-size:0.78rem;display:flex;gap:10px">';
      h += '<span style="color:#6b7280;min-width:60px;flex-shrink:0">路径</span>';
      h += '<span style="color:#e0e0e0;font-size:0.7rem;word-break:break-all;flex:1">'+escapeHtml(row.skill_path||'')+'</span>';
      h += '<span onclick="event.stopPropagation();copyAction(\''+(row.skill_path||'').replace(/'/g,"\\'")+'\')" style="cursor:pointer;font-size:0.8rem;flex-shrink:0" title="拷贝路径">📋</span>';
      h += '</div>';

      // Profiles — tag style
      var profiles = (row.profiles||'').split(/,\\s*/).filter(Boolean);
      h += '<div style="padding:5px 0;border-bottom:1px solid #1a1a2e;font-size:0.78rem;display:flex;gap:10px">';
      h += '<span style="color:#6b7280;min-width:60px;flex-shrink:0">所属 Profile</span>';
      h += '<span>';
      profiles.forEach(function(p) {
        h += '<span style="display:inline-block;padding:1px 6px;border-radius:9999px;font-size:0.62rem;background:rgba(79,70,229,0.12);color:var(--cobalt-400);border:1px solid rgba(79,70,229,0.2);margin:1px">'+escapeHtml(p)+'</span>';
      });
      h += '</span></div>';

      // Chinese content & scripts
      var hasChinese = /[\u4e00-\u9fff]/.test(row.description||'') ? '✅ 是' : '❌ 否';
      var hasScript = (row.file_count||0) > 1 ? '✅ 是' : '❌ 否';
      h += '<div style="padding:5px 0;border-bottom:1px solid #1a1a2e;font-size:0.78rem;display:flex;gap:10px">';
      h += '<span style="color:#6b7280;min-width:60px;flex-shrink:0">中文内容</span>';
      h += '<span style="color:#e0e0e0">'+hasChinese+'</span>';
      h += '</div>';
      h += '<div style="padding:5px 0;border-bottom:1px solid #1a1a2e;font-size:0.78rem;display:flex;gap:10px">';

    function showSkillSplit(row, idx) {
      splitRow = row; splitIdx = idx;
      splitActive = true;
      var wrapper = document.querySelector('.wrapper');
      wrapper.classList.add('split-mode');
      initThead();
      render();
      // Render SKILL.md content
      var header = document.getElementById('splitPreviewHeader');
      header.innerHTML = '<button class="sp-nav" onclick="splitNav(-1)" title="上一个">▲</button>' +
        '<button class="sp-nav" onclick="splitNav(1)" title="下一个">▼</button>' +
        ' ' + escapeHtml(row.name||'详情') +
        '<button class="sp-close" onclick="closeSplit()">✕</button>';
      var body = document.getElementById('splitPreviewBody');
      body.innerHTML = '<div style="text-align:center;padding:40px;color:#6b7280">⏳ 加载中...</div>';
      // Try to fetch SKILL.md
      var mdUrl = '/skills/' + encodeURIComponent(row.category) + '/' + encodeURIComponent(row.name) + '/SKILL.md';
      fetch(mdUrl).then(function(resp) {
        if (resp.ok) return resp.text();
        throw new Error('HTTP ' + resp.status);
      }).then(function(text) {
        // Simple markdown → HTML
        var html = text
          .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
          .replace(/^### (.+)$/gm,'<h3 style="margin:1em 0 0.4em;font-size:0.85rem;color:#e0e0e0">$1</h3>')
          .replace(/^## (.+)$/gm,'<h2 style="margin:1.2em 0 0.5em;font-size:0.95rem;color:#f0f0f0">$1</h2>')
          .replace(/^# (.+)$/gm,'<h1 style="margin:1.4em 0 0.6em;font-size:1.1rem;color:#f0f0f0">$1</h1>')
          .replace(/`([^`]+)`/g,'<code style="background:#1a1a2e;padding:1px 4px;border-radius:3px;font-size:0.7rem">$1</code>')
          .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
          .replace(/\*(.+?)\*/g,'<i>$1</i>')
          .replace(/^\- (.+)$/gm,'<li style="margin-left:16px">$1</li>')
          .replace(/\n/g,'<br>');
        body.innerHTML = '<div style="font-size:0.75rem;line-height:1.7;color:#b0b0c0;padding:8px 0">'+html+'</div>';
      }).catch(function(err) {
        body.innerHTML = '<div style="text-align:center;padding:40px;color:#6b7280;font-size:0.75rem">⚠ 无法加载 SKILL.md<br><span style="font-size:0.62rem">'+escapeHtml(mdUrl)+'</span><br><span style="font-size:0.62rem">'+escapeHtml(err.message)+'</span></div>';
      });
      // Highlight
      var tbody = document.getElementById('tbody');
      var rows = tbody.querySelectorAll('tr');
      rows.forEach(function(r){ r.classList.remove('split-active'); });
      if (rows[idx]) rows[idx].classList.add('split-active');
    }

  /* ── Split drag ── */
  function initSplitDrag() {
    var drag = document.getElementById('splitDrag');

    drag.addEventListener('mousedown', function(e) {
      e.preventDefault();
      isDragging = true;
      drag.classList.add('active');
      document.addEventListener('mousemove', onDrag);
      document.addEventListener('mouseup', onDragEnd);
    });

    function onDrag(e) {
      if (!isDragging) return;
      var rect = wrapper.getBoundingClientRect();
      var ratio = ((e.clientX - rect.left) / rect.width) * 100;
      ratio = Math.max(25, Math.min(75, ratio));
      splitRatio = ratio;
      wrapper.style.setProperty('--spl-ratio', ratio+'%');
      try { localStorage.setItem('html-gen:table:split-ratio', ratio); } catch(e) {}
    }

    function onDragEnd() {
      isDragging = false;
      drag.classList.remove('active');
      document.removeEventListener('mousemove', onDrag);
      document.removeEventListener('mouseup', onDragEnd);
    }

  function initExport() {

  window.startResize = function(e, key) {
    e.stopPropagation(); e.preventDefault();
    _resizeCol = key;

    _resizeStartW = _resizeTh.offsetWidth;
    document.addEventListener('mousemove', onResizeMove);
    document.addEventListener('mouseup', onResizeUp);
  };
  function onResizeMove(e) {
    if (!_resizeCol) return;
    var delta = e.clientX - _resizeStartX;
    var newW = Math.max(40, _resizeStartW + delta);
    // Direct DOM update (no full thead rebuild — avoids flicker)
    if (_resizeTh) _resizeTh.style.width = newW + 'px';
  }
  function onResizeUp() {
    if (_resizeCol && _resizeTh) {
      var newW = _resizeTh.offsetWidth;
      var col = COLUMNS.find(function(c){return c.key===_resizeCol;});
      if (col) col.width = newW + 'px';
      // Persist to localStorage
      try {
        var saved = {};
        COLUMNS.forEach(function(c) { if (c.width) saved[c.key] = c.width; });
        localStorage.setItem(COL_WIDTHS_KEY, JSON.stringify(saved));
      } catch(e) {}
    }
    _resizeCol = null;
    _resizeTh = null;
    document.removeEventListener('mousemove', onResizeMove);
    document.removeEventListener('mouseup', onResizeUp);

    quickSearch.updateMatchCount();
  };

  // Keyboard: Enter/Esc handling inside popup
  window.qsHandleKey = function(e) {
    if (e.key === 'Enter') { e.preventDefault(); quickSearch.submit(); }
    else if (e.key === 'Escape') { e.preventDefault(); quickSearch.close(); }
  };

  // Global keyboard shortcuts
  document.addEventListener('keydown', function(e) {
    // Cmd+F / Ctrl+F
    if ((e.metaKey || e.ctrlKey) && e.key === 'f') {
      if (!showSearch) return;
      e.preventDefault();
      quickSearch.open();
    }
    // Esc when overlay active
    if (e.key === 'Escape' && quickSearch.active) {
      quickSearch.close();
    }
  });

  /* ── Keyboard Navigation ── */
  var kbFocusIdx = -1;
  document.addEventListener('keydown', function(e) {
    // Only when not in input
    if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') return;
    var tbody = document.getElementById('tbody');
    var rows = tbody.querySelectorAll('tr:not(.expand-row)');
    if (!rows.length) return;
    var pageRows = rows.length;
    if (e.key === 'ArrowDown') { e.preventDefault(); kbFocusIdx = kbFocusIdx < 0 ? 0 : Math.min(pageRows - 1, kbFocusIdx + 1); highlightKbRow(rows); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); kbFocusIdx = kbFocusIdx < 0 ? pageRows - 1 : Math.max(0, kbFocusIdx - 1); highlightKbRow(rows); }
    else if (e.key === 'Enter' && kbFocusIdx >= 0) { e.preventDefault(); var r = rows[kbFocusIdx]; if (r) r.click(); }
  });
  function highlightKbRow(rows) {
    rows.forEach(function(r, i) { r.classList.toggle('keyboard-focus', i === kbFocusIdx); });
    if (kbFocusIdx >= 0 && rows[kbFocusIdx]) rows[kbFocusIdx].scrollIntoView({block:'nearest'});
  }

  /* ── Batch Operations ── */
  function updateBatchBar() {
    if (!showRowSelect) return;
    var cnt = Object.keys(selectedRows).length;
    var bar = document.getElementById('batchBar');
    bar.classList.toggle('active', cnt > 0);
    document.getElementById('batchCount').textContent = '已选 ' + cnt + ' 条';
  }
  var origUpdateStats = updateStats;
  updateStats = function() { origUpdateStats(); updateBatchBar(); };
  window.selectAllFiltered = function() { filtered.forEach(function(r, i) { selectedRows[i] = true; }); render(); };
  window.clearSelection = function() { selectedRows = {}; kbFocusIdx = -1; render(); };
  window.exportSelectedCSV = function() {
    var selected = Object.keys(selectedRows).map(function(i) { return filtered[parseInt(i)]; }).filter(Boolean);
    if (!selected.length) { showToast('未选中任何行'); return; }
    var cols = visibleCols({excludeActions: true});
    var csv = '\uFEFF' + cols.map(function(c){return '"'+c.label+'"';}).join(',') + '\n' +
      selected.map(function(r){ return cols.map(function(c){ var v = r[c.key]||''; return '"'+String(v).replace(/"/g,'""')+'"'; }).join(','); }).join('\n');
    var blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'selected.csv'; a.click();
    showToast('已导出 ' + selected.length + ' 条');
  };

  /* ── Fullscreen ── */
  window.toggleFullscreen = function() {
    document.querySelector('.wrapper').classList.toggle('fullscreen');
    showToast(document.querySelector('.wrapper').classList.contains('fullscreen') ? '已进入全屏 (F 退出)' : '已退出全屏');
  };
  document.addEventListener('keydown', function(e) {
    if (e.key === 'f' && !e.metaKey && !e.ctrlKey && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
      e.preventDefault(); toggleFullscreen();
    }
  });

  /* ── View Presets ── */
  window.savePreset = function(name) {
    name = name || ('预设 ' + (new Date()).toLocaleTimeString());
    var presets = [];
    try { presets = JSON.parse(localStorage.getItem('html-gen:table:presets')) || []; } catch(e) {}
    var state = {density: density, clickMode: clickMode, splitRatio: splitRatio, colVisibility: colVisibility, sortKey: sortKey, sortAsc: sortAsc, name: name};
    var json = JSON.stringify(state);
    if (json.length > MAX_PRESET_SIZE) { showToast('预设过大，请减少列数'); return; }
    var existing = presets.findIndex(function(p){ return p.name === name; });
    if (existing >= 0) presets[existing] = state;
    else { if (presets.length >= MAX_PRESETS) presets.shift(); presets.push(state); }
    try { localStorage.setItem('html-gen:table:presets', JSON.stringify(presets)); } catch(e) { showToast('存储失败'); return; }
    showToast('已保存: ' + name);
  };
  window.loadPreset = function(name) {
    var presets = [];
    try { presets = JSON.parse(localStorage.getItem('html-gen:table:presets')) || []; } catch(e) {}
    var p = presets.find(function(p){ return p.name === name; });
    if (!p) { showToast('预设不存在: ' + name); return; }
    if (p.density) { density = p.density; applyDensity(); }
    if (p.clickMode) { clickMode = p.clickMode; }
    if (p.splitRatio) { splitRatio = p.splitRatio; document.querySelector('.wrapper').style.setProperty('--spl-ratio', p.splitRatio+'%'); }
    if (p.colVisibility) { colVisibility = p.colVisibility; }
    if (p.sortKey) { sortKey = p.sortKey; sortAsc = p.sortAsc || true; }
    initColToggle(); initThead(); render();
    showToast('已加载: ' + name);
  };
  window.deletePreset = function(name) {
    var presets = [];
    try { presets = JSON.parse(localStorage.getItem('html-gen:table:presets')) || []; } catch(e) {}
    presets = presets.filter(function(p){ return p.name !== name; });
    try { localStorage.setItem('html-gen:table:presets', JSON.stringify(presets)); } catch(e) {}
    initColToggle();
    showToast('已删除: ' + name);
  };

})();
</script>
</body>
</html>
