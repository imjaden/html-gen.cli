<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ═══════════════════════════════════════════
   style-guide.css
   Layer 1 — CSS 变量 + 基础组件
   来源：favorite-manager/index.html 深色主题
   版本：1.0(2026-07-01)
   ═══════════════════════════════════════════ */

:root {
  --cobalt-50: #eef2ff;
  --cobalt-100: #e0e7ff;
  --cobalt-400: #818cf8;
  --cobalt-500: #6366f1;
  --cobalt-600: #4f46e5;
  --cobalt-700: #4338ca;
  --cobalt-800: #3730a3;
  --cobalt-900: #312e81;
  --cobalt-950: #1e1b4b;
  --accent-400: #facc15;
  --accent-500: #eab308;
  --accent-600: #ca8a04;
  --surface-800: #1e1e2e;
  --surface-850: #181825;
  --surface-900: #11111b;
  --surface-950: #0a0a14;
  --text-primary: #f0f0f0;
  --text-body: #e0e0e0;
  --text-secondary: #9ca3af;
  --text-muted: #6b7280;
  --text-faint: #555555;
  --border-strong: #2a2a3e;
  --border-soft: #1a1a2e;
  --code-bg: #0d0d1a;
  --code-text: #b0b0c0;
  --code-cmd: #e0e0e0;
  --hero-title-from: #ffffff;
  --gh-corner-fill: rgba(0,0,0,0.41);
  --gh-octocat: var(--text-secondary);
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --radius-xl: 12px;
  --radius-full: 9999px;
}

/* ── Light Theme（浅色变量组；模板页另有局部覆盖，此处为基座） ── */
:root.light {
  --surface-950: #f5f5f5;
  --surface-900: #ffffff;
  --surface-850: #f0f0f0;
  --surface-800: #e8e8e8;
  --cobalt-950: #eef2ff;
  --cobalt-600: #6366f1;
  --cobalt-700: #4338ca;
  --cobalt-400: #6366f1;
  --cobalt-300: #818cf8;
  --text-primary: #1f2328;
  --text-body: #333333;
  --text-secondary: #57606a;
  --text-muted: #6e7681;
  --text-faint: #8b949e;
  --border-strong: #d0d7de;
  --border-soft: #e5e7eb;
  --code-bg: #f6f8fa;
  --code-text: #57606a;
  --code-cmd: #1f2328;
  --hero-title-from: #1f2328;
  --gh-corner-fill: rgba(0,0,0,0.75);
  --gh-octocat: #ffffff;
}
:root.light body { color: var(--text-body); background: var(--surface-950); }
:root.light h1 { color: var(--text-primary); }
:root.light h2 { color: var(--text-body); }
:root.light h3 { color: #333333; }
:root.light a { color: var(--cobalt-600); }
:root.light a:hover { color: var(--cobalt-700); }
:root.light code { background: rgba(0,0,0,0.06); color: #555555; }
:root.light pre { background: #f0f0f0; border-color: #dddddd; color: #333333; }

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  background: var(--surface-950);
  color: var(--text-body);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

h1 { font-size: 1.4rem; font-weight: 700; color: var(--text-primary); margin-bottom: 0.75rem; }
h2 { font-size: 1.15rem; font-weight: 600; color: var(--text-body); margin: 1.25rem 0 0.5rem; }
h3 { font-size: 1rem; font-weight: 600; color: #d0d0d0; margin: 1rem 0 0.4rem; }
p  { margin-bottom: 0.6rem; }
a { color: var(--cobalt-400); text-decoration: none; }
a:hover { color: var(--cobalt-500); text-decoration: underline; }
code {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  background: rgba(255,255,255,0.06);
  padding: 2px 6px;
  border-radius: var(--radius-sm);
}
pre {
  background: #0d0d1a;
  border: 1px solid #2a2a3e;
  border-radius: var(--radius-md);
  padding: 12px 16px;
  overflow-x: auto;
  margin: 0.75rem 0;
}
pre code { background: none; padding: 0; }

/* ── Data Table ── */
.data-table { width: 100%; border-collapse: collapse; }
.data-table th {
  position: sticky; top: 0; z-index: 10;
  background: var(--surface-900);
  border-bottom: 1px solid #2a2a3e;
  padding: 8px 10px; text-align: left; font-size: 0.7rem; font-weight: 600;
  color: #9ca3af; text-transform: uppercase; letter-spacing: 0.05em;
  white-space: nowrap; user-select: none;
}
.data-table th.sortable { cursor: pointer; }
.data-table th.sortable::after { content: ' \25bc'; font-size: 10px; color: #555; }
.data-table th.sort-asc::after { content: ' \25b2'; color: var(--cobalt-400); }
.data-table th.sort-desc::after { content: ' \25bc'; color: var(--cobalt-400); }
.data-table td {
  padding: 8px 10px; border-bottom: 1px solid #1a1a2e;
  font-size: 0.8rem; vertical-align: middle;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.data-table tr { transition: background 0.15s; }
.data-table tbody tr:hover { background: rgba(79,70,229,0.08); }
.data-table tbody tr.selected { background: rgba(79,70,229,0.15); }

/* ── Badges ── */
.badge-red    { background: #3b1f1f; color: #f87171; }
.badge-yellow { background: #3b351f; color: #fbbf24; }
.badge-blue   { background: #1e3a5f; color: #60a5fa; }
.badge-black  { background: #1a1a1a; color: #9ca3af; border: 1px solid #333; }
.badge { display: inline-block; padding: 1px 8px; border-radius: var(--radius-full); font-size: 0.7rem; margin: 1px; }

/* ── Tag Pill ── */
.tag-pill {
  display: inline-block; padding: 1px 8px;
  border-radius: var(--radius-full);
  font-size: 0.7rem; margin: 1px;
  cursor: pointer; transition: opacity 0.15s;
}
.tag-pill:hover { opacity: 0.8; }

/* ── Input ── */
.input-dark {
  background: #0f0f1a;
  border: 1px solid #2a2a3e;
  color: #e0e0e0;
  padding: 6px 12px;
  border-radius: var(--radius-md);
  outline: none;
  font-size: 0.85rem;
  font-family: inherit;
}
.input-dark:focus { border-color: var(--cobalt-600); box-shadow: 0 0 0 2px rgba(79,70,229,0.2); }
.input-dark::placeholder { color: #555; }

/* ── Buttons ── */
.btn {
  padding: 6px 14px; border-radius: var(--radius-md);
  border: none; cursor: pointer; font-size: 0.8rem;
  font-family: inherit;
  transition: all 0.15s;
}
.btn-primary { background: var(--cobalt-600); color: white; }
.btn-primary:hover { background: var(--cobalt-700); }
.btn-danger { background: #dc2626; color: white; }
.btn-danger:hover { background: #b91c1c; }
.btn-ghost {
  background: transparent; color: #9ca3af;
  border: 1px solid #2a2a3e;
}
.btn-ghost:hover { color: #e0e0e0; border-color: #555; }
.btn-sm { padding: 3px 10px; font-size: 0.72rem; }

/* ── Pager ── */
.pager { display: flex; gap: 4px; justify-content: center; align-items: center; margin-top: 16px; }
.pager button { min-width: 32px; }

/* ── Batch Bar ── */
.batch-bar {
  display: none;
  background: var(--cobalt-950);
  border: 1px solid var(--cobalt-700);
  border-radius: var(--radius-lg);
  padding: 10px 16px; margin-bottom: 12px;
  align-items: center; gap: 12px;
}
.batch-bar.active { display: flex; }

/* ── Modal ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.6);
  display: none; align-items: center; justify-content: center;
  z-index: 100;
}
.modal-overlay.active { display: flex; }
.modal-box {
  background: var(--surface-900);
  border-radius: var(--radius-xl);
  padding: 20px 24px;
  width: 420px; max-width: 90vw;
  border: 1px solid #2a2a3e;
}
.modal-box h3 { font-size: 0.9rem; font-weight: 700; color: #f0f0f0; margin-bottom: 12px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

/* ── Utility ── */
.card { background: var(--surface-900); border: 1px solid #1a1a2e; border-radius: var(--radius-lg); overflow: hidden; }
.wrapper { max-width: 1400px; margin: 0 auto; padding: 16px 20px; }
.flex { display: flex; }
.flex-1 { flex: 1; }
.gap-2 { gap: 8px; }
.gap-3 { gap: 12px; }
.mb-3 { margin-bottom: 12px; }
.text-xs { font-size: 0.75rem; }
.text-gray { color: #9ca3af; }
.w-full { width: 100%; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #2a2a3e; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #3a3a5e; }

</style>
<style>
/* ── Layout ── */
.kw-wrapper { display: flex; height: 100vh; overflow: hidden; }

/* ── Sidebar ── */
.kw-sidebar {
  width: 260px; min-width: 260px;
  background: var(--surface-900);
  border-right: 1px solid #2a2a3e;
  display: flex; flex-direction: column;
  overflow-y: auto;
  transition: width 0.25s, min-width 0.25s;
}
.kw-sidebar.collapsed { width: 48px; min-width: 48px; }
.kw-sidebar.collapsed .kw-sidebar-header,
.kw-sidebar.collapsed .kw-sections,
.kw-sidebar.collapsed .kw-sidebar-footer { display: none; }
.kw-sidebar-icon { display: none; font-size: 1.2rem; justify-content: center; padding: 14px 0 8px; }
.kw-sidebar.collapsed .kw-sidebar-icon { display: flex; }
.kw-sidebar-header {
  padding: 14px 16px 10px;
  border-bottom: 1px solid #2a2a3e;
  flex-shrink: 0;
}
.kw-sidebar-header .sidebar-title { font-size: 0.82rem; font-weight: 700; color: var(--cobalt-400); cursor: pointer; }
.kw-sidebar-header .sidebar-title:hover { color: var(--cobalt-300); }
.kw-sidebar-header .sub { font-size: 0.7rem; color: #6b7280; margin-top: 2px; }
.kw-sections { flex: 1; overflow-y: auto; padding: 6px 0; display: none; }
.kw-sections.active { display: block; }
.kw-section-title {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 16px 4px; font-size: 0.82rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.06em;
  color: #6b7280; cursor: pointer; user-select: none;
}
.kw-section-title:hover { color: #e0e0e0; }
.kw-section-title.active { color: var(--cobalt-400); }
.kw-section-title .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.kw-section-title .kw-section-icon { font-size: 0.9rem; flex-shrink: 0; }
/* 搜索/折叠功能隐藏（与顶部菜单同高同字体；按钮功能保留但不再展示） */
#kwSearchBtn, #collapseBtn { display: none !important; }
.kw-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 16px 8px 28px; cursor: pointer; transition: all 0.12s;
  border-left: 3px solid transparent; color: #9ca3af; font-size: 0.82rem;
}
.kw-item:hover { background: rgba(79,70,229,0.04); color: #e0e0e0; }
.kw-item.active { background: rgba(79,70,229,0.08); color: var(--cobalt-400); border-left-color: var(--cobalt-600); }
.kw-item .kw-item-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kw-item .kw-item-badge { font-size: 0.62rem; padding: 1px 6px; border-radius: 8px; font-weight: 600; letter-spacing: 0.02em; flex-shrink: 0; }

/* ── Sidebar Footer ── */
.kw-sidebar-footer { padding: 8px 12px; border-top: 1px solid #2a2a3e; display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.kw-sidebar-footer .sb-btn { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 6px; border: 1px solid #2a2a3e; background: transparent; color: #6b7280; cursor: pointer; font-size: 0.7rem; transition: all 0.15s; font-family: inherit; }
.kw-sidebar-footer .sb-btn:hover { background: rgba(79,70,229,0.1); color: #e0e0e0; }

/* ── Sidebar Search ── */
.kw-search-wrap { display: none; padding: 6px 12px; border-bottom: 1px solid #2a2a3e; }
.kw-search-wrap.active { display: block; }
.kw-search-wrap input { width: 100%; box-sizing: border-box; padding: 6px 10px; border: 1px solid #2a2a3e; border-radius: 6px; background: #0d0d1a; color: #e0e0e0; font-size: 0.72rem; outline: none; font-family: inherit; }
.kw-search-wrap input:focus { border-color: var(--cobalt-600); }
.kw-search-wrap input::placeholder { color: #555; }
.kw-item.filtered-out { display: none; }
.kw-section-title.filtered-out { display: none; }

/* ── Sidebar Resize ── */
.kw-sidebar { position: relative; }
.kw-sidebar-resize {
  position: absolute; right: -4px; top: 0; bottom: 0; width: 8px;
  cursor: col-resize; z-index: 20; transition: background 0.15s;
}
.kw-sidebar-resize:hover, .kw-sidebar-resize.active { background: var(--cobalt-600); opacity: 0.4; }

/* ── Top-Right Toolbar ── */
.kw-toolbar { position: fixed; top: 12px; right: 88px; z-index: 900; display: flex; align-items: center; gap: 2px; background: rgba(17,17,27,0.88); backdrop-filter: blur(12px); border: 1px solid #2a2a3e; border-radius: 28px; padding: 3px 5px; }
:root.light .kw-toolbar { background: rgba(255,255,255,0.88); border-color: #ddd; }
.kw-tb-btn { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; border: none; background: transparent; color: #9ca3af; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; font-family: inherit; }
.kw-tb-btn:hover { background: rgba(79,70,229,0.15); color: #e0e0e0; }
.kw-tb-btn.active { background: var(--cobalt-600); color: #fff; }
.kw-tb-divider { width: 1px; height: 18px; background: #2a2a3e; margin: 0 3px; }

/* ── Light Theme ── */
:root.light { --surface-950: #f5f5f5; --surface-900: #ffffff; --surface-850: #f0f0f0; --surface-800: #e8e8e8; --cobalt-950: #eef2ff; --cobalt-600: #6366f1; }
:root.light body { color: #333; background: #f5f5f5; }
:root.light .kw-sidebar { background: #fff; border-color: #e5e5e5; }
:root.light .kw-sidebar-header { border-color: #e5e5e5; }
:root.light .kw-sidebar-footer { border-color: #e5e5e5; }
:root.light .kw-sidebar-header .sidebar-title { color: #333; }
:root.light .kw-sidebar-header .sub { color: #999; }
:root.light .kw-item { color: #555; }
:root.light .kw-item:hover { background: rgba(79,70,229,0.03); color: #333; }
:root.light .kw-item.active { background: rgba(79,70,229,0.06); color: var(--cobalt-600); }
:root.light .kw-tab-bar { background: #fff; border-color: #e5e5e5; }
:root.light .kw-tab { color: #666; }
:root.light .kw-tab:hover { color: #333; }
:root.light .kw-tab.active { color: var(--cobalt-600); }
:root.light .kw-content { background: #f5f5f5; }
:root.light .kw-search-wrap { border-color: #e5e5e5; }
:root.light .kw-search-wrap input { background: #f5f5f5; border-color: #ddd; color: #333; }
:root.light .kw-welcome .w-title { color: #333; }

/* ── Main ── */
.kw-main { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }

/* ── Tab Bar (aligned with sidebar title) ── */
.kw-tab-bar {
  height: 48px; min-height: 48px;
  display: flex; align-items: stretch;
  background: var(--surface-900);
  border-bottom: 1px solid #2a2a3e;
  overflow-x: auto; overflow-y: hidden;
  flex-shrink: 0;
}
.kw-tab-bar::-webkit-scrollbar { height: 0; }
.kw-tab {
  display: flex; align-items: center; gap: 6px;
  padding: 0 20px; cursor: pointer; white-space: nowrap;
  font-size: 0.82rem; font-weight: 500;
  color: #9ca3af; border-bottom: 2px solid transparent;
  transition: all 0.15s; flex-shrink: 0; user-select: none;
}
.kw-tab:hover { background: rgba(79,70,229,0.04); color: #e0e0e0; }
.kw-tab.active { color: var(--cobalt-400); border-bottom-color: var(--cobalt-600); }
.kw-tab .kw-tab-icon { font-size: 0.9rem; }

/* ── Content area ── */
.kw-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--surface-950); }
.kw-body { flex: 1; overflow-y: auto; padding: 24px 32px; }

/* ── Welcome ── */
.kw-welcome { display: none; flex: 1; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 40px 20px; text-align: center; }
.kw-welcome.active { display: flex; }
.kw-welcome .w-title { font-size: 1.3rem; font-weight: 700; color: #e0e0e0; }
.kw-welcome .w-sub { font-size: 0.85rem; color: #6b7280; max-width: 440px; line-height: 1.7; }
.kw-welcome .w-legend { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
.kw-welcome .w-legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.78rem; color: #9ca3af; }
.kw-welcome .w-legend-item .ldot { width: 8px; height: 8px; border-radius: 50%; }

/* ── Content iframe ── */
.kw-frame-wrap { display: none; flex: 1; flex-direction: column; }
.kw-frame-wrap.active { display: flex; }
.kw-frame-wrap iframe { width: 100%; flex: 1; border: none; background: var(--surface-950); }

@media (max-width: 768px) {
  .kw-sidebar { display: none; position: fixed; top: 0; left: 0; width: 260px; height: 100vh; z-index: 100; }
  .kw-sidebar.open { display: flex; box-shadow: 4px 0 20px rgba(0,0,0,0.5); }
  .kw-body { padding: 16px; }
}

@media print {
  .kw-sidebar, .kw-tab-bar, .kw-toolbar, .github-corner, .github-corner-hit, .home-link { display: none !important; }
  .kw-body { color: #000; }
  .kw-welcome { display: none !important; }
  body { background: #fff; }
}

/* ── GitHub Corner ── */
.github-corner { position: fixed; top: 0; right: 0; z-index: 950; color: #9ca3af; pointer-events: none; }
.github-corner-hit { position: fixed; top: 36px; right: 0; width: 36px; height: 36px; z-index: 951; cursor: pointer; }
.github-corner:hover .octo-arm { animation: octocat-wave 560ms ease-in-out; }
@keyframes octocat-wave { 0%,100%{transform:rotate(0)} 20%,60%{transform:rotate(-25deg)} 40%,80%{transform:rotate(10deg)} }
  .home-link { position: fixed; top: 84px; right: 12px; z-index: 949; width: 36px; height: 36px; border-radius: 8px; background: rgba(0,0,0,0.41); display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 1rem; }
  .home-link:hover { background: rgba(0,0,0,0.6); }
  
.kw-sidebar::-webkit-scrollbar { width: 4px; }
.kw-sidebar::-webkit-scrollbar-thumb { background: #2a2a3e; border-radius: 2px; }
</style>
</head>

  const ITEMS  = [{"title": "公司画像", "group": "公司概况", "section": "公司概况", "badge": "概览", "url": "cloudwise/company-profile.html"}, {"title": "发展历程", "group": "公司概况", "section": "公司概况", "badge": "深度", "url": "cloudwise/company-history.html"}, {"title": "融资估值", "group": "公司概况", "section": "公司概况", "badge": "数据", "url": "cloudwise/funding-valuation.html"}, {"title": "管理团队", "group": "公司概况", "section": "公司概况", "badge": "概览", "url": "cloudwise/management-team.html"}, {"title": "产品矩阵", "group": "产品体系", "section": "产品体系", "badge": "概览", "url": "cloudwise/product-matrix.html"}, {"title": "核心产品", "group": "产品体系", "section": "产品体系", "badge": "深度", "url": "cloudwise/core-products.html"}, {"title": "解决方案", "group": "产品体系", "section": "产品体系", "badge": "数据", "url": "cloudwise/solutions.html"}, {"title": "商业模式", "group": "经营分析", "section": "经营分析", "badge": "深度", "url": "cloudwise/business-model.html"}, {"title": "客户与市场", "group": "经营分析", "section": "经营分析", "badge": "数据", "url": "cloudwise/customers-market.html"}, {"title": "竞争格局", "group": "经营分析", "section": "经营分析", "badge": "对比", "url": "cloudwise/competitive-landscape.html"}, {"title": "发展前景", "group": "经营分析", "section": "经营分析", "badge": "深度", "url": "cloudwise/growth-outlook.html"}, {"title": "合作伙伴", "group": "生态合作", "section": "生态合作", "badge": "概览", "url": "cloudwise/partners.html"}, {"title": "荣誉认证", "group": "生态合作", "section": "生态合作", "badge": "概览", "url": "cloudwise/awards.html"}, {"title": "开源项目", "group": "生态合作", "section": "生态合作", "badge": "数据", "url": "cloudwise/open-source.html"}, {"title": "云智慧 Castrel AI 健康巡检：把故障后的“救火”，变成业务受影响前的主动处置", "group": "新闻动态", "section": "2026-08", "badge": "动态", "desc": "<p>大多数IT团队都经历过这样的状态：仪表盘显示正常，告警保持静默，SLO 尚未跌破，但部分运行信号已经呈现持续恶化趋势。传统故障排查通常围绕已经发生的服务影响展开，难以覆盖这类业务尚未受到影响、风险却在持续积累的场景。 要系统性地处理这类风险，还需要一个面向事前风险治理的运维环节：健康巡检。 它通常定期执行，或在发现早期异常趋势时启动，关注风险是否正在积累、可能如何传导，以及何时需要采取行动。<\/p><p><a href=\"https://mp.weixin.qq.com/s/1C8OXFyvvtQYyy8FGb6a0w\" target=\"_blank\" rel=\"noopener noreferrer\">🔗 阅读原文<\/a><\/p>"}, {"title": "别急着上 AI，先把路修好｜云智慧亮相华北制造业 CIO 研讨会，共话 AI 赋能新未来", "group": "新闻动态", "section": "2026-08", "badge": "动态", "desc": "<p>近日，以「AI 赋能・智启新未来」为主题的华北制造业 CIO 研讨会在北京启幕，数百位制造企业 CIO 与 IT 掌舵人齐聚一堂，讨论一个绕不开的问题——AI 喊了三年，制造业如何更有价值的落地？ 云智慧携制造业全栈 AI 基础设施智能运维解决方案参会，带来主题演讲与展位展示，给出的回答朴素但锋利：别急着跑，先把路修好。<\/p><p><a href=\"https://mp.weixin.qq.com/s/6pA40jEUrIYQQelgovnWsw\" target=\"_blank\" rel=\"noopener noreferrer\">🔗 阅读原文<\/a><\/p>"}, {"title": "WRC 2026｜当机器人走出展馆，“可靠” 才是它真正的入场券", "group": "新闻动态", "section": "2026-08", "badge": "动态", "desc": "<p>8月19日至23日，2026 世界机器人大会（World Robot Conference，WRC）在北京举行。展馆里，每一台机器人都在展示自己 “能做什么”。而当掌声散去、灯光熄灭，真正的问题才刚刚浮现：当机器人走出展馆，走进数据中心的深夜走廊、走进变电站的高温环境、走进工业园区的复杂管线，它们还能不能一如既往地可靠工作？<\/p><p><a href=\"https://mp.weixin.qq.com/s/T1Q7xc4pj_hmaJW45BJONg\" target=\"_blank\" rel=\"noopener noreferrer\">🔗 阅读原文<\/a><\/p>"}, {"title": "轻帆云 AI 员工“上岗” WorkBuddy：IT 服务随叫随到", "group": "新闻动态", "section": "2026-08", "badge": "动态", "desc": "<p>2026年，中国办公智能体平台市场从概念预热转入爆发式增长。腾讯旗下全场景 AI 办公工作台 WorkBuddy 上线数月即领跑国内 PC 端办公智能体访问榜——据易观分析发布的《2026 Q2 中国办公智能体平台市场洞察报告》，其 6 月单月访问量达 2097 万，超第二三名之和。AI 办公工作台正逐步走入职场人的日常工作流。<\/p><p><a href=\"https://mp.weixin.qq.com/s/xc_ReHMjMZl01GIOxbucIg\" target=\"_blank\" rel=\"noopener noreferrer\">🔗 阅读原文<\/a><\/p>"}, {"title": "挑战香港中文大学团队 RCA 基准，云智慧 Castrel AI · RCA Studio 交出 82.8% 命中率", "group": "新闻动态", "section": "2026-08", "badge": "动态", "desc": "<p>近期，云智慧 AI SRE 实验室公布了一项测试结果：在香港中文大学与中山大学团队提出的公开 RCA 基准 Cloud-OpsBench 上， Castrel AI 的新一代 RCA Studio 完成 Train-Ticket 系统全量 204 个故障场景测试，综合根因命中率达到 82.8%，较基线63%的准确率提高了 19 个百分点。 这不是一次实验室里的静态模拟。<\/p><p><a href=\"https://mp.weixin.qq.com/s/sjSxDfIEbnYfCdApirAx1A\" target=\"_blank\" rel=\"noopener noreferrer\">🔗 阅读原文<\/a><\/p>"}, {"title": "从 SLO 到健康巡检：云智慧 Castrel AI 如何构建可视化、可验证的应用运行基线", "group": "新闻动态", "section": "2026-08", "badge": "动态", "desc": "<p>名词释义 SLO（Service Level Objective，服务等级目标）是企业为关键数字服务设定的可靠性目标，用于明确服务在一定周期内应达到的运行水平。它通常以可用性、延迟和正确率等与用户体验直接相关的指标来衡量，为服务监测和运维决策提供依据。 在实际运维中，企业通常会将 SLO 作为判断关键数字服务是否达到预期可靠性水平的依据。<\/p><p><a href=\"https://mp.weixin.qq.com/s/lK85YDQXilEzATJm_vjxKw\" target=\"_blank\" rel=\"noopener noreferrer\">🔗 阅读原文<\/a><\/p>"}, {"title": "从“会回答”到“能执行”：轻帆云 AI 员工如何重构 IT 服务台？", "group": "新闻动态", "section": "2026-08", "badge": "动态", "desc": "<p>在传统 ITSM 模式下，服务台往往是 IT 团队中负荷最重、沟通成本最高的节点。 大量模糊报障涌入，一线人员的精力被耗费在信息收集与手动派单上；后端工程师接手后，又常因上下文缺失反复追问，导致整体的服务响应与处理效率大打折扣。 这种低效背后隐藏着极高的业务复杂度：信息非结构化、处置链路长且需跨系统协同。要化解这一矛盾，不能仅靠流程优化，更需要引入全新的生产力要素。<\/p><p><a href=\"https://mp.weixin.qq.com/s/TM-tvnX7wiXhPbzsigB5qw\" target=\"_blank\" rel=\"noopener noreferrer\">🔗 阅读原文<\/a><\/p>"}, {"title": "这个“AI员工”，不是你想象中的AI员工", "group": "新闻动态", "section": "2026-08", "badge": "动态", "desc": "<p>全球的企业软件市场正在经历一场底层形态的更替。Gartner预测：到2026年底，40%的企业应用将集成任务型 AI 智能体，而2025年这一比例还不足5%。 在所有企业软件门类中，ITSM 或许是最先迎来这一变化的领域。理解这一判断，需要回到 ITSM 自身的演进脉络中。 01 从流程标准化到 AI 辅助，ITSM 的智能化演进 过去二十年，ITSM 的核心贡献在于实现了服务过程的标准化。<\/p><p><a href=\"https://mp.weixin.qq.com/s/v-FEJrR896OV9C92PptXiA\" target=\"_blank\" rel=\"noopener noreferrer\">🔗 阅读原文<\/a><\/p>"}, {"title": "【案例】旭阳集团×轻帆云：告别“人找人”，打造智能制造时代的集团级 IT 共享服务中心", "group": "新闻动态", "section": "2026-07", "badge": "动态", "desc": "<p>旭阳集团（下称“该集团”）创立于1995年，是一家以焦炭、化工为主业的大型能源化工集团，业务版图横跨国内外，生产园区遍布多地。随着数字化与智能制造进程的深入，该集团已上线包括MES、LIMS、PMS、ERP等在内的超100套核心IT系统，覆盖从生产制造到经营管理的各个环节。 但随着系统规模的扩大，如何为遍布各地园区的业务用户提供统一、高效的 IT 服务，成为摆在集团信息管理部门面前的现实课题。<\/p><p><a href=\"https://mp.weixin.qq.com/s/9wV_M21FZ49br9wSL9pDdA\" target=\"_blank\" rel=\"noopener noreferrer\">🔗 阅读原文<\/a><\/p>"}, {"title": "AI 正在进入真实世界：从 Physical AI 看企业智能化新路径", "group": "新闻动态", "section": "2026-07", "badge": "动态", "desc": "<p>作者：刘语然Melly 两百多位讲者，三百多家展台。主题词是 agentic，但地面上真正在动的东西是机器人。谁在台上讲物理世界、谁在展台上演、谁在真的开发票——答案不在同一批人身上。 7 月 18 到 19 日，AGI Summit 2026 在旧金山 Palace of Fine Arts 开了两天，回来之后给我最强的一个感觉是：Physical AI 的叙事和 Physical AI 的现金…<\/p><p><a href=\"https://mp.weixin.qq.com/s/EWg3Oo2Z3EafEvl6WcKp_w\" target=\"_blank\" rel=\"noopener noreferrer\">🔗 阅读原文<\/a><\/p>"}, {"title": "AGI Summit 2026 圆桌实录｜云智慧与OpenAI、Supermicro、Fireworks.AI等全球 AI 领军者共话：专用智能时代，AI 价值终将沉淀产业应用", "group": "新闻动态", "section": "2026-07", "badge": "动态", "desc": "<p>当通用大模型迈过能力竞争阶段，全球 AI 产业开始进入一个新的命题：未来 AI 真正的价值，将积累在哪一层？ 是持续突破模型能力边界？还是不断降低推理成本？又或是在应用层，让 AI 真正走进企业、走进业务、走进真实世界？<\/p><p><a href=\"https://mp.weixin.qq.com/s/fa-Kpjg9zG9stSjtj2irCA\" target=\"_blank\" rel=\"noopener noreferrer\">🔗 阅读原文<\/a><\/p>"}, {"title": "从工具到价值，轻帆云全栈产品矩阵：ITSM、CMDB、ITAM三位一体，AI 驱动智能运维新范式", "group": "新闻动态", "section": "2026-07", "badge": "动态", "desc": "<p>在数智化转型的浪潮中，企业 IT 基础设施正变得愈发庞大与复杂，传统运维模式逐渐暴露出五大困境——服务响应低效、流程固化僵硬、数据孤岛林立、知识散落流失、资产管理粗放： 这些问题并非孤立存在，仅靠叠加单点工具已触及效能天花板。<\/p><p><a href=\"https://mp.weixin.qq.com/s/dS7rB9puk_FIZ62fCsm91w\" target=\"_blank\" rel=\"noopener noreferrer\">🔗 阅读原文<\/a><\/p>"}, {"title": "AGI Summit 2026 圆满落幕：AI 终将走进真实世界，云智慧以全栈软硬实力诠释中国 AI 落地路径", "group": "新闻动态", "section": "2026-07", "badge": "动态", "desc": "<p>随着 AGI SUMMIT 2026 在美国旧金山艺术宫落幕，这场汇聚全球15000余名开发者、企业家、投资人与学术领袖的国际 AI 盛会，也向行业释放了一个清晰信号—— AI 的发展重心，正从&quot;更强的模型&quot;，迈向&quot;更真实的世界&quot;。<\/p><p><a href=\"https://mp.weixin.qq.com/s/L11kgHNP_7x7GN7HDQNFmQ\" target=\"_blank\" rel=\"noopener noreferrer\">🔗 阅读原文<\/a><\/p>"}];   // [{title, group, section?, badge?, url?, desc?}]

  let activeGroup = GROUPS.length > 0 ? GROUPS[0].key : '';
  let activeItem = null;
  const COLORS = ['#38bdf8','#34d399','#c084fc','#fb923c','#f472b6','#fbbf24','#818cf8'];
  const BADGE_COLORS = {
    '知道':{bg:'rgba(56,189,248,0.12)',color:'#38bdf8',border:'rgba(56,189,248,0.25)'},

    '能输出':{bg:'rgba(251,146,60,0.12)',color:'#fb923c',border:'rgba(251,146,60,0.25)'},
  };

  /* ═══════ i18n & Theme ═══════ */
  var _kwLang = (function() { try { var v = localStorage.getItem('html-gen:kw_lang'); return (v === 'zh' || v === 'en') ? v : 'zh'; } catch(e) { return 'zh'; } })();
  document.getElementById('kwLangZh').classList.toggle('active', _kwLang === 'zh');
  document.getElementById('kwLangEn').classList.toggle('active', _kwLang === 'en');

  window.setKwLang = function(lang) {
    if (lang !== 'zh' && lang !== 'en') return;
    _kwLang = lang;
    try { localStorage.setItem('html-gen:kw_lang', lang); } catch(e) {}
    document.getElementById('kwLangZh').classList.toggle('active', lang === 'zh');
    document.getElementById('kwLangEn').classList.toggle('active', lang === 'en');
    updateSub();

  var _kwTheme = (function() { try { return localStorage.getItem('html-gen:kw_theme') || 'dark'; } catch(e) { return 'dark'; } })();
  if (_kwTheme === 'light') document.documentElement.classList.add('light');
  document.getElementById('kwThemeBtn').textContent = _kwTheme === 'light' ? '☀️' : '🌙';

  window.toggleKwTheme = function() {
    var r = document.documentElement;
    var isLight = !r.classList.contains('light');
    r.classList.toggle('light', isLight);
    try { localStorage.setItem('html-gen:kw_theme', isLight ? 'light' : 'dark'); } catch(e) {}
    document.getElementById('kwThemeBtn').textContent = isLight ? '☀️' : '🌙';
  };

  function updateSub() {
    var sub = document.querySelector('.kw-sidebar-header .sub');
    if (sub) {
      var base = (sub.textContent || '').replace(/\s*共\s+\d+\s*条目.*/, '').trim();

      sub.textContent = (base ? base + ' · ' : '') + '共 ' + ITEMS.length + label;
    }
  }
  updateSub();

  // Title click → copy full URL（中文参数解码为原文，如 ?group=大明王朝1566）
  document.querySelector('.kw-sidebar-header .sidebar-title').addEventListener('click', function() {
    var m = this.title.match(/路径:\s*(.+)/);
    var target = m ? m[1].trim() : decodeURI(window.location.href);
    if (/^(https?:|\/|~\/)/.test(target)) {
      try { navigator.clipboard.writeText(target).catch(function(){}); } catch(e) {}
      showKwToast('已复制: ' + target);
    }
  });

  function showKwToast(msg) {
    var el = document.getElementById('kwToast');
    if (!el) { el = document.createElement('div'); el.id = 'kwToast'; el.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:8px 20px;background:var(--cobalt-950);color:#e0e0e0;border-radius:8px;font-size:0.78rem;z-index:9999;border:1px solid var(--cobalt-700);opacity:0;transition:opacity 0.2s;white-space:nowrap;pointer-events:none'; document.body.appendChild(el); }
    el.textContent = msg; el.style.opacity = '1';
    clearTimeout(el._hide); el._hide = setTimeout(function() { el.style.opacity = '0'; }, 2500);
  }

  // ── Render tabs ──
  function renderTabs() {
    var bar = document.getElementById('kwTabBar');
    bar.innerHTML = (GROUPS || []).map(function(g, i) {
      var c = COLORS[i % COLORS.length];
      return '<div class="kw-tab' + (g.key === activeGroup ? ' active' : '') + '" data-key="' + g.key + '" onclick="switchGroup(\'' + g.key + '\')">' +
        (g.icon ? '<span class="kw-tab-icon">' + g.icon + '</span>' : '<span class="kw-tab-icon" style="color:' + c + '">●</span>') +
        g.label + '</div>';
    }).join('');
    renderSidebar();
  }

  window.switchGroup = function(key) {
    activeGroup = key;
    try { localStorage.setItem('html-gen:kw_group', key); } catch(e) {}
    document.querySelectorAll('.kw-tab').forEach(function(t) { t.classList.toggle('active', t.dataset.key === key); });
    renderSidebar();
    // 跨组保持：优先选中当前 section 在同组同名 item（如 36计策 跨组跟随），否则第一个 item
    var targetItem = null;
    if (activeItem) {
      var secName = (function(){ var it = ITEMS.find(function(i){ return i.group === key && i.title === activeItem; }); return it ? it.title : null; })();
      targetItem = secName ? ITEMS.find(function(i) { return i.group === key && i.title === secName; }) : null;
    }
    if (!targetItem) {
      var curItem = ITEMS.find(function(i) { return i.group !== key && i.title === activeItem; });
      if (curItem) targetItem = ITEMS.find(function(i) { return i.group === key && i.title === curItem.title; });
    }
    var firstItem = targetItem || ITEMS.find(function(i) { return i.group === key; });
    if (firstItem) selectItem(activeGroup, firstItem.title);
  };

  // ── Render sidebar sections ──
  function renderSidebar() {
    var container = document.getElementById('kwSectionsContainer');
    var groupItems = ITEMS.filter(function(item) { return item.group === activeGroup; });
    var sections = {};
    groupItems.forEach(function(item) {
      var sec = item.section || item.group || 'default';
      if (!sections[sec]) sections[sec] = [];
      sections[sec].push(item);
    });
    var html = '';
    var keys = Object.keys(sections);
    keys.forEach(function(sec) {
      var ci = GROUPS.findIndex(function(g) { return g.key === activeGroup; });
      var c = COLORS[Math.max(0, ci) % COLORS.length];
      if (keys.length > 1) {
        var secIcon = sections[sec][0] && sections[sec][0].section_icon;
        html += '<div class="kw-section-title" onclick="selectSection(\'' + activeGroup.replace(/'/g,"\\'") + '\',\'' + sec.replace(/'/g,"\\'") + '\')">' +
          (secIcon ? '<span class="kw-section-icon">' + secIcon + '</span>' : '<span class="dot" style="background:' + c + '"></span>') + sec + '</div>';
      }
      // Single-item section matching section name: skip kw-item row (section title itself is the click target)
      var isSingleItem = sections[sec].length === 1 && sections[sec][0].title === sec;
      if (!isSingleItem) {
        sections[sec].forEach(function(item) {
        var badgeHtml = '';
        if (item.badge) {
          var bc = BADGE_COLORS[item.badge] || {bg:'rgba(255,255,255,0.04)',color:'#6b7280',border:'transparent'};
          badgeHtml = '<span class="kw-item-badge" style="background:'+bc.bg+';color:'+bc.color+';border:1px solid '+bc.border+'">'+item.badge+'</span>';
        }
        html += '<div class="kw-item" onclick="selectItem(\'' + activeGroup.replace(/'/g,"\\'") + '\',\'' + item.title.replace(/'/g,"\\'") + '\')"><span class="kw-item-text">' + item.title + '</span>' + badgeHtml + '</div>';
      });
      }
    });
    container.innerHTML = html || '<div style="padding:20px;text-align:center;color:#6b7280;font-size:0.78rem;">暂无内容</div>';
  }

  // ── Select section (click section title) ──
  window.selectSection = function(group, sec) {
    var item = ITEMS.find(function(i) { return i.group === group && i.section === sec; });
    if (!item) return;
    selectItem(group, item.title);
  };

  // ── Select item ──
  // URL 参数同步（拷贝 URL 可定位指定页签/条目）
  function syncUrl() {
    try {
      var u = new URL(window.location.href);
      if (activeGroup) u.searchParams.set('group', activeGroup);
      else u.searchParams.delete('group');
      if (activeItem && ITEMS.some(function(i){ return i.group === activeGroup && i.title === activeItem; }))
        u.searchParams.set('item', activeItem);
      else u.searchParams.delete('item');
      history.replaceState(null, '', u.toString());
    } catch(e) {}
  }

  window.selectItem = function(group, title) {
    activeItem = title;
    try { localStorage.setItem('html-gen:kw_item', title); } catch(e) {}
    document.querySelectorAll('.kw-item').forEach(function(el) { el.classList.toggle('active', el.querySelector('.kw-item-text').textContent === title); });
    var item = ITEMS.find(function(i) { return i.group === group && i.title === title; });
    if (!item) return;
    // 高亮所属 section（section-as-menu 单 item 模式无 kw-item 行，靠 section-title 呈现）
    var secName = item.section || item.title;
    document.querySelectorAll('.kw-section-title').forEach(function(el) {
      el.classList.toggle('active', el.textContent.indexOf(secName) !== -1);
    });
    document.getElementById('welcomePanel').classList.remove('active');
    document.getElementById('frameWrap').classList.add('active');
    var body = document.getElementById('kwBody'), frame = document.getElementById('contentFrame');
    if (item.url) { body.style.display = 'none'; frame.style.display = 'block'; frame.src = item.url + (item.url.indexOf('?') !== -1 ? '&' : '?') + (item.url.indexOf('overview') !== -1 ? 'width=wide&' : '') + 'sidebar=0&toolbar=0&t=' + Date.now(); }
    else if (item.desc) { frame.style.display = 'none'; body.style.display = 'block'; body.innerHTML = '<div style="color:#e0e0e0;line-height:1.8;font-size:0.88rem;">' + item.desc.replace(/\n/g,'<br>') + '</div>'; }
    else { frame.style.display = 'none'; body.style.display = 'block'; body.innerHTML = '<div style="color:#6b7280;text-align:center;padding:40px;">请配置 desc 内容</div>'; }
    syncUrl();
  };

  function renderLegend() {
    var el = document.getElementById('wLegend');
    el.innerHTML = (GROUPS || []).map(function(g, i) { var c = COLORS[i % COLORS.length]; return '<span class="w-legend-item"><span class="ldot" style="background:' + c + '"></span> ' + g.label + '</span>'; }).join('');
  }

  // Restore last state: URL 参数优先 > localStorage > 默认
  var urlParams = new URLSearchParams(location.search);
  var savedGroup = urlParams.get('group') || localStorage.getItem('html-gen:kw_group');
  var savedItem = urlParams.get('item') || localStorage.getItem('html-gen:kw_item');
  var groupValid = savedGroup && GROUPS.some(function(g) { return g.key === savedGroup; });
  var itemValid = savedItem && ITEMS.some(function(i) { return i.group === savedGroup && i.title === savedItem; });
  if (groupValid) {
    activeGroup = savedGroup; renderTabs();
    if (itemValid) { setTimeout(function() { selectItem(savedGroup, savedItem); }, 50); }
    else { renderSidebar(); renderLegend(); }  // 仅恢复页签（未点条目场景）
  } else {
    renderTabs();
    renderLegend();
  }

  /* ═══════ Sidebar Collapse ═══════ */
  var _collapsed = false;
  window.toggleSidebar = function() {
    _collapsed = !_collapsed;
    var sb = document.getElementById('kwSidebar'), btn = document.getElementById('collapseBtn');
    if (sb) sb.classList.toggle('collapsed', _collapsed);
    if (btn) btn.textContent = _collapsed ? '▶▶' : '◀◀';
    try { localStorage.setItem('html-gen:kw:collapsed', _collapsed); } catch(e) {}
  };
  try { if (localStorage.getItem('html-gen:kw:collapsed') === 'true') toggleSidebar(); } catch(e) {}

  document.addEventListener('keydown', function(e) {
    if (e.key === '[' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA' && document.activeElement.tagName !== 'IFRAME') {
      if (!e.metaKey && !e.ctrlKey) { e.preventDefault(); toggleSidebar(); }
    }
  });

  /* ── Sidebar Search ── */
  var _kwSearchActive = false, _kwSearchTimer;
  window.toggleKwSearch = function() {
    _kwSearchActive = !_kwSearchActive;
    var wrap = document.getElementById('kwSearchWrap');
    var input = document.getElementById('kwSearchInput');
    var btn = document.getElementById('kwSearchBtn');
    if (wrap) wrap.classList.toggle('active', _kwSearchActive);
    if (btn) btn.style.color = _kwSearchActive ? 'var(--cobalt-400)' : '';
    if (_kwSearchActive) {
      setTimeout(function() { input.focus(); input.select(); }, 50);
    } else {
      input.value = '';
      doKwFilter('');
    }
  };

  function doKwFilter(q) {
    var items = document.querySelectorAll('.kw-item');
    var titles = document.querySelectorAll('.kw-section-title');
    var hasMatch = false;
    items.forEach(function(el) {
      var text = (el.querySelector('.kw-item-text') || {}).textContent || '';
      var match = q.length < 2 || text.toLowerCase().indexOf(q) !== -1;
      el.classList.toggle('filtered-out', !match);
      if (match) hasMatch = true;
    });
    // Hide section titles if all their items are filtered out
    titles.forEach(function(title) {
      var next = title.nextElementSibling;
      var allHidden = true;
      while (next && !next.classList.contains('kw-section-title')) {
        if (!next.classList.contains('filtered-out')) { allHidden = false; break; }
        next = next.nextElementSibling;
      }
      title.classList.toggle('filtered-out', allHidden);
    });
  }

  document.getElementById('kwSearchInput').addEventListener('input', function() {
    var q = this.value.toLowerCase().trim();
    clearTimeout(_kwSearchTimer);
    _kwSearchTimer = setTimeout(function() { doKwFilter(q); }, 150);
  });

  document.getElementById('kwSearchInput').addEventListener('keydown', function(e) {
    if (e.key === 'Escape') { _kwSearchActive = true; toggleKwSearch(); }
    else if (e.key === 'Enter') {
      var firstVisible = document.querySelector('.kw-item:not(.filtered-out)');
      if (firstVisible) firstVisible.click();
      _kwSearchActive = true; toggleKwSearch();
    }
  });

  // Click away to close
  document.addEventListener('click', function(e) {
    if (_kwSearchActive && !e.target.closest('.kw-search-wrap') && e.target !== document.getElementById('kwSearchBtn')) {
      _kwSearchActive = true; toggleKwSearch();
    }
  });

  /* ── Sidebar Resize ── */
  (function() {
    var sb = document.getElementById('kwSidebar');
    var handle = document.getElementById('kwSbResize');
    var dragging = false;
    handle.addEventListener('mousedown', function(e) {
      e.preventDefault();
      dragging = true;
      handle.classList.add('active');
    });
    document.addEventListener('mousemove', function(e) {
      if (!dragging) return;
      var w = e.clientX;
      w = Math.max(200, Math.min(400, w));
      sb.style.width = w + 'px';
      sb.style.minWidth = w + 'px';
    });
    document.addEventListener('mouseup', function() {
      if (dragging) {
        dragging = false;
        handle.classList.remove('active');
        try { localStorage.setItem('html-gen:kw:sidebar-width', sb.style.width); } catch(e) {}
      }
    });
    try { var sw = localStorage.getItem('html-gen:kw:sidebar-width'); if (sw) { sb.style.width = sw; sb.style.minWidth = sw; } } catch(e) {}
  })();
})();
</script>
</body>
</html>
