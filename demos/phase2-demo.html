<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="https://www.jaden.tech/static/img/favicon.png" type="image/png">
<title>Phase 3 Demo — 密度/模态/分栏/行内展开</title>
<style>
/* ═══════════════════════════════════════════
   style-guide.css
   Layer 1 — CSS 变量 + 基础组件
   来源：favorite-manager/index.html 深色主题
   版本：1.0(2026-07-01)
   ═══════════════════════════════════════════ */

:root {
  --cobalt-50: #eef2ff;
  --cobalt-100: #e0e7ff;
  --cobalt-400: #818cf8;
  --cobalt-500: #6366f1;
  --cobalt-600: #4f46e5;
  --cobalt-700: #4338ca;
  --cobalt-800: #3730a3;
  --cobalt-900: #312e81;
  --cobalt-950: #1e1b4b;
  --accent-400: #facc15;
  --accent-500: #eab308;
  --accent-600: #ca8a04;
  --surface-800: #1e1e2e;
  --surface-850: #181825;
  --surface-900: #11111b;
  --surface-950: #0a0a14;
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --radius-xl: 12px;
  --radius-full: 9999px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  background: var(--surface-950);
  color: #e0e0e0;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

h1 { font-size: 1.4rem; font-weight: 700; color: #f0f0f0; margin-bottom: 0.75rem; }
h2 { font-size: 1.15rem; font-weight: 600; color: #e0e0e0; margin: 1.25rem 0 0.5rem; }
h3 { font-size: 1rem; font-weight: 600; color: #d0d0d0; margin: 1rem 0 0.4rem; }
p  { margin-bottom: 0.6rem; }
a { color: var(--cobalt-400); text-decoration: none; }
a:hover { color: var(--cobalt-500); text-decoration: underline; }
code {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  background: rgba(255,255,255,0.06);
  padding: 2px 6px;
  border-radius: var(--radius-sm);
}
pre {
  background: #0d0d1a;
  border: 1px solid #2a2a3e;
  border-radius: var(--radius-md);
  padding: 12px 16px;
  overflow-x: auto;
  margin: 0.75rem 0;
}
pre code { background: none; padding: 0; }

/* ── Data Table ── */
.data-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
.data-table th {
  position: sticky; top: 0; z-index: 10;
  background: var(--surface-900);
  border-bottom: 1px solid #2a2a3e;
  padding: 8px 10px; text-align: left; font-size: 0.7rem; font-weight: 600;
  color: #9ca3af; text-transform: uppercase; letter-spacing: 0.05em;
  white-space: nowrap; user-select: none;
}
.data-table th.sortable { cursor: pointer; }
.data-table th.sortable::after { content: ' \25bc'; font-size: 10px; color: #555; }
.data-table th.sort-asc::after { content: ' \25b2'; color: var(--cobalt-400); }
.data-table th.sort-desc::after { content: ' \25bc'; color: var(--cobalt-400); }
.data-table td {
  padding: 8px 10px; border-bottom: 1px solid #1a1a2e;
  font-size: 0.8rem; vertical-align: middle;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.data-table tr { transition: background 0.15s; }
.data-table tbody tr:hover { background: rgba(79,70,229,0.08); }
.data-table tbody tr.selected { background: rgba(79,70,229,0.15); }

/* ── Badges ── */
.badge-red    { background: #3b1f1f; color: #f87171; }
.badge-yellow { background: #3b351f; color: #fbbf24; }
.badge-blue   { background: #1e3a5f; color: #60a5fa; }
.badge-black  { background: #1a1a1a; color: #9ca3af; border: 1px solid #333; }
.badge { display: inline-block; padding: 1px 8px; border-radius: var(--radius-full); font-size: 0.7rem; margin: 1px; }

/* ── Tag Pill ── */
.tag-pill {
  display: inline-block; padding: 1px 8px;
  border-radius: var(--radius-full);
  font-size: 0.7rem; margin: 1px;
  cursor: pointer; transition: opacity 0.15s;
}
.tag-pill:hover { opacity: 0.8; }

/* ── Input ── */
.input-dark {
  background: #0f0f1a;
  border: 1px solid #2a2a3e;
  color: #e0e0e0;
  padding: 6px 12px;
  border-radius: var(--radius-md);
  outline: none;
  font-size: 0.85rem;
  font-family: inherit;
}
.input-dark:focus { border-color: var(--cobalt-600); box-shadow: 0 0 0 2px rgba(79,70,229,0.2); }
.input-dark::placeholder { color: #555; }

/* ── Buttons ── */
.btn {
  padding: 6px 14px; border-radius: var(--radius-md);
  border: none; cursor: pointer; font-size: 0.8rem;
  font-family: inherit;
  transition: all 0.15s;
}
.btn-primary { background: var(--cobalt-600); color: white; }
.btn-primary:hover { background: var(--cobalt-700); }
.btn-danger { background: #dc2626; color: white; }
.btn-danger:hover { background: #b91c1c; }
.btn-ghost {
  background: transparent; color: #9ca3af;
  border: 1px solid #2a2a3e;
}
.btn-ghost:hover { color: #e0e0e0; border-color: #555; }
.btn-sm { padding: 3px 10px; font-size: 0.72rem; }

/* ── Pager ── */
.pager { display: flex; gap: 4px; justify-content: center; align-items: center; margin-top: 16px; }
.pager button { min-width: 32px; }

/* ── Batch Bar ── */
.batch-bar {
  display: none;
  background: var(--cobalt-950);
  border: 1px solid var(--cobalt-700);
  border-radius: var(--radius-lg);
  padding: 10px 16px; margin-bottom: 12px;
  align-items: center; gap: 12px;
}
.batch-bar.active { display: flex; }

/* ── Modal ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.6);
  display: none; align-items: center; justify-content: center;
  z-index: 100;
}
.modal-overlay.active { display: flex; }
.modal-box {
  background: var(--surface-900);
  border-radius: var(--radius-xl);
  padding: 20px 24px;
  width: 420px; max-width: 90vw;
  border: 1px solid #2a2a3e;
}
.modal-box h3 { font-size: 0.9rem; font-weight: 700; color: #f0f0f0; margin-bottom: 12px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

/* ── Utility ── */
.card { background: var(--surface-900); border: 1px solid #1a1a2e; border-radius: var(--radius-lg); overflow: hidden; }
.wrapper { max-width: 1400px; margin: 0 auto; padding: 16px 20px; }
.flex { display: flex; }
.flex-1 { flex: 1; }
.gap-2 { gap: 8px; }
.gap-3 { gap: 12px; }
.mb-3 { margin-bottom: 12px; }
.text-xs { font-size: 0.75rem; }
.text-gray { color: #9ca3af; }
.w-full { width: 100%; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #2a2a3e; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #3a3a5e; }

</style>
<style>
/* ── Tabs ── */
.table-tabs { display:flex; gap:4px; margin-bottom:10px; overflow-x:auto; flex-wrap:nowrap; }
.table-tabs:empty { display:none; }
.tab-btn {
  padding:5px 14px; border-radius:6px 6px 0 0; cursor:pointer; font-size:0.72rem; font-weight:500;
  background:var(--surface-900); color:#6b7280; border:1px solid #1a1a2e; border-bottom:none;
  white-space:nowrap; transition:all 0.15s; user-select:none;
}
.tab-btn:hover { background:#1a1a2e; color:#d1d5db; }
.tab-btn.active { background:var(--cobalt-950); color:var(--cobalt-400); border-color:var(--cobalt-700); }
.tab-btn .count { display:inline-block; margin-left:4px; padding:1px 5px; border-radius:9999px;
  font-size:0.55rem; background:rgba(99,102,241,0.15); color:var(--cobalt-400); }
.tab-btn.active .count { background:rgba(99,102,241,0.25); }

/* ── Header bar ── */
.table-header { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
.table-header h1 { font-size:1rem; font-weight:700; margin:0; white-space:nowrap; }
.stat-pill { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:9999px;
  background:var(--surface-900); border:1px solid #1a1a2e; font-size:0.65rem; color:#9ca3af; white-space:nowrap; }
.stat-pill .num { color:var(--cobalt-400); font-weight:600; }
.header-search { background:var(--surface-850); border:1px solid #2a2a3e; color:#e0e0e0; padding:5px 10px;
  border-radius:6px; font-size:0.72rem; outline:none; width:180px; }
.header-search:focus { border-color:var(--cobalt-600); }

/* ── Table ── */
.table-wrap { border:1px solid #1a1a2e; border-radius:var(--radius-lg); overflow-x:auto; }
.data-table { width:100%; min-width:600px; border-collapse:collapse; table-layout:auto; }
.data-table th {
  position:sticky; top:0; z-index:10; background:var(--surface-900); border-bottom:1px solid #2a2a3e;
  padding:6px 8px; text-align:left; font-size:0.65rem; font-weight:600; color:#9ca3af;
  text-transform:uppercase; letter-spacing:0.04em; white-space:nowrap; user-select:none;
  position:relative;
}
.data-table th.sortable { cursor:pointer; }
.data-table th.sortable:hover { color:var(--cobalt-400); }
.data-table th.sort-asc::after { content:' ▲'; color:var(--cobalt-400); font-size:9px; }
.data-table th.sort-desc::after { content:' ▼'; color:var(--cobalt-400); font-size:9px; }
.data-table th .resize-handle {
  position:absolute; top:0; right:0; bottom:0; width:5px; cursor:col-resize;
}
.data-table th .resize-handle:hover { background:var(--cobalt-600); }
.data-table td { padding:5px 8px; border-bottom:1px solid #1a1a2e; font-size:0.75rem;
  vertical-align:middle; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.data-table tbody tr { transition:background 0.12s; }
.data-table tbody tr:hover { background:rgba(79,70,229,0.07); }
.data-table tbody tr.selected { background:rgba(79,70,229,0.15); }
.data-table tbody tr.clickable { cursor:pointer; }
.col-checkbox { width:32px; text-align:center; }
.col-checkbox input { cursor:pointer; accent-color:var(--cobalt-500); }
.col-index-num { text-align:center; color:#6b7280; font-size:0.72rem; }

/* ── Actions ── */
.action-btn { display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px;
  border-radius:5px; border:1px solid #2a2a3e; cursor:pointer; font-size:0.65rem; color:#6b7280;
  background:transparent; transition:all 0.15s; margin:0 1px; }
.action-btn:hover { background:var(--cobalt-600); border-color:var(--cobalt-600); color:white; }

/* ── Column toggle ── */
.col-toggle-wrap { position:relative; display:inline-block; }
.col-toggle-dropdown {
  display:none; position:absolute; top:100%; right:0; z-index:50; margin-top:4px;
  background:var(--surface-900); border:1px solid #2a2a3e; border-radius:8px; padding:6px 0;
  min-width:150px; max-height:260px; overflow-y:auto;
}
.col-toggle-dropdown.show { display:block; }
.col-toggle-dropdown label { display:flex; align-items:center; gap:6px; padding:4px 12px;
  font-size:0.72rem; color:#d1d5db; cursor:pointer; white-space:nowrap; }
.col-toggle-dropdown label:hover { background:rgba(79,70,229,0.1); }
.col-toggle-dropdown input { accent-color:var(--cobalt-500); }
.col-toggle-dropdown .settings-section { padding:4px 12px 2px; font-size:0.62rem; color:#6b7280; text-transform:uppercase; letter-spacing:0.04em; }
.col-toggle-dropdown .settings-radio { display:flex; align-items:center; gap:6px; padding:2px 12px; font-size:0.7rem; color:#d1d5db; cursor:pointer; }
.col-toggle-dropdown .settings-radio input { accent-color:var(--cobalt-500); margin:0; }
.col-toggle-divider { height:1px; background:#2a2a3e; margin:4px 0; }

/* ── Density ── */
.data-table.dense td { padding:2px 8px; font-size:0.7rem; }
.data-table.dense th { padding:3px 8px; font-size:0.6rem; }
.data-table.comfortable td { padding:10px 12px; font-size:0.82rem; }
.data-table.comfortable th { padding:10px 12px; font-size:0.72rem; }

/* ── Modal Panel ── */
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1000; justify-content:center; align-items:center; }
.modal-overlay.active { display:flex; }
.modal-panel { background:var(--surface-900); border:1px solid #2a2a3e; border-radius:12px; width:560px; max-width:90vw; max-height:80vh; overflow-y:auto; padding:20px 24px; animation:slideFadeIn 0.2s ease; }
.modal-panel h3 { font-size:1rem; color:#f0f0f0; margin:0 0 12px; }
.modal-panel .modal-close { position:absolute; top:12px; right:16px; background:none; border:none; color:#6b7280; cursor:pointer; font-size:1.2rem; }
.modal-panel .modal-field { display:flex; padding:4px 0; border-bottom:1px solid #1a1a2e; font-size:0.78rem; }
.modal-panel .modal-field .mf-label { color:#6b7280; width:80px; flex-shrink:0; }
.modal-panel .modal-field .mf-value { color:#e0e0e0; flex:1; word-break:break-all; }
.modal-panel .modal-field:last-child { border-bottom:none; }

/* ── Split View ── */
.wrapper.split-mode { display:flex; flex-direction:row; gap:0; }
.wrapper.split-mode .table-main { flex:0 0 var(--spl-ratio, 40%); min-width:200px; overflow:auto; }
.split-preview { display:none; flex-direction:column; background:var(--surface-900); border-left:1px solid #2a2a3e;
  min-width:200px; position:relative; }
.wrapper.split-mode .split-preview { display:flex; flex:1; }
.split-preview-header { padding:10px 14px; border-bottom:1px solid #2a2a3e;
  font-size:0.82rem; font-weight:600; color:#f0f0f0;
  display:flex; align-items:center; gap:8px; }
.split-preview-header .sp-close { margin-left:auto; background:none; border:none; color:#6b7280; cursor:pointer; font-size:1rem; }
.split-preview-body { flex:1; overflow:auto; padding:14px; }
.split-preview-body iframe { width:100%; height:70vh; border:none; }
.split-drag { display:none; width:5px; cursor:col-resize; flex-shrink:0; background:transparent; transition:background 0.15s; }
.wrapper.split-mode .split-drag { display:block; }
.split-drag:hover, .split-drag.active { background:var(--cobalt-600); }
.split-preview .kv-list { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:6px; }
.split-preview .kv-item { padding:4px 8px; border:1px solid #1a1a2e; border-radius:6px; }
.split-preview .kv-item .kv-label { font-size:0.62rem; color:#6b7280; }
.split-preview .kv-item .kv-value { font-size:0.78rem; color:#e0e0e0; word-break:break-all; }
.data-table tr.split-active { outline:2px solid var(--cobalt-500); }
.data-table tr.expand-row td { padding:10px 14px; background:rgba(79,70,229,0.06); border-top:1px solid var(--cobalt-700); }
.data-table tr.expand-row .expand-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:8px; }
.data-table tr.expand-row .expand-item { padding:6px 10px; border:1px solid #1a1a2e; border-radius:6px; }
.data-table tr.expand-row .expand-item .ex-label { font-size:0.62rem; color:#6b7280; }
.data-table tr.expand-row .expand-item .ex-value { font-size:0.78rem; color:#e0e0e0; word-break:break-all; }

/* ── Toast ── */
.toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); padding:8px 20px;
  background:var(--cobalt-950); color:#e0e0e0; border-radius:8px; font-size:0.78rem;
  z-index:9999; border:1px solid var(--cobalt-700); opacity:0; transition:opacity 0.2s; white-space:nowrap; pointer-events:none; }
.toast.show { opacity:1; }

/* ── Misc ── */
.empty-state { display:none; text-align:center; padding:48px 20px; color:#6b7280; }
.empty-state .icon { font-size:2rem; margin-bottom:8px; display:block; }
.flex-1 { flex:1; }

/* ── Quick Search Overlay (Cmd+F) ── */
.qs-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,0.5); backdrop-filter:blur(4px);
  display:none; justify-content:center; align-items:flex-start; padding-top:15vh; z-index:9999;
}
.qs-overlay.active { display:flex; }
.qs-modal {
  width:560px; max-width:90vw; background:var(--surface-900);
  border:1px solid var(--cobalt-700); border-radius:12px;
  box-shadow:0 20px 60px rgba(0,0,0,0.4); overflow:hidden;
  animation:qsSlideIn 0.18s ease-out;
}
@keyframes qsSlideIn { from{opacity:0;transform:translateY(-12px)} to{opacity:1;transform:translateY(0)} }
.qs-input-row { display:flex; align-items:center; padding:14px 18px; gap:10px; }
.qs-input-row .qs-icon { font-size:1.1rem; color:var(--cobalt-400); flex-shrink:0; }
.qs-input-row input {
  flex:1; border:none; outline:none; font-size:1rem; color:#e0e0e0;
  background:transparent; font-family:inherit;
}
.qs-input-row input::placeholder { color:#555; }
.qs-close-btn {
  padding:4px 12px; border-radius:6px; border:1px solid #2a2a3e;
  background:transparent; color:#9ca3af; cursor:pointer; font-size:0.72rem;
  transition:all 0.15s;
}
.qs-close-btn:hover { background:#2a2a3e; color:#e0e0e0; }
.qs-hint { display:flex; justify-content:space-between; padding:4px 18px 12px; font-size:0.62rem; color:#6b7280; }
</style>
</head>
<body>
<div class="wrapper">

<div class="table-tabs" id="tabsBar"></div>

<div class="table-main" id="tableMain">
<div class="table-header">
  <h1>Phase 3 Demo — 密度/模态/分栏/行内展开</h1>
  <span class="stat-pill"><span class="num" id="statTotal">0</span> 条</span>
  <span class="stat-pill" style="display:none" id="statFilteredPill"><span class="num" id="statFiltered">0</span> 已筛选</span>
  <span class="stat-pill" style="display:none" id="statSelectedPill"><span class="num" id="statSelected">0</span> 已选</span>
  <div class="flex-1"></div>
  <input class="header-search" id="searchInput" placeholder="搜索..." onkeydown="if(event.key==='Enter')doSearch()">
  
  <button class="btn btn-ghost btn-sm" id="exportBtn" title="导出 CSV" style="display:none">📥</button>
  <div class="col-toggle-wrap">
    <button class="btn btn-ghost btn-sm" id="colToggleBtn" title="设置">⚙️</button>
    <div class="col-toggle-dropdown" id="colToggleDropdown"></div>
  </div>
</div>

<div class="table-wrap">
  <table class="data-table">
    <colgroup id="colGroup"></colgroup>
    <thead id="thead"></thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty-state" id="emptyState"><span class="icon">📭</span><span>无匹配数据</span></div>
</div>

<div class="pager" id="pager"></div>
</div><!-- /table-main -->

<div class="split-drag" id="splitDrag"></div>
<div class="split-preview" id="splitPreview">
  <div class="split-preview-header" id="splitPreviewHeader"></div>
  <div class="split-preview-body" id="splitPreviewBody"></div>
</div>

<div class="toast" id="toast"></div>

</div><!-- /wrapper -->

<!-- Modal Panel -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal-panel" id="modalPanel"></div>
</div>

<!-- Cmd+F Quick Search Overlay -->
<div class="qs-overlay" id="qsOverlay" onclick="if(event.target===this)quickSearch.close()">
  <div class="qs-modal">
    <div class="qs-input-row">
      <span class="qs-icon">🔍</span>
      <input id="qsInput" placeholder="搜索..." onkeydown="qsHandleKey(event)" oninput="qsOnInput()">
      <button class="qs-close-btn" onclick="quickSearch.close()">Esc</button>
    </div>
    <div class="qs-hint">
      <span>Enter 搜索 · Esc 关闭</span>
      <span id="qsMatchCount"></span>
    </div>
  </div>
</div>

</div>

<script>
(function() {
  /* ═══════════════════════════════════════════
     Layout Table v2.0 — 增强版
     新增：Tabs/Sort指示/数字排序/中文排序/统计/操作列/Toast/
           列可见性/行选择/CSV导出/行点击/列宽拖拽/Tab记忆/实时搜索
     ═══════════════════════════════════════════ */

  const COLUMNS = [{"key": "name", "label": "项目", "sortable": true, "locale": "zh", "preview": true}, {"key": "stars", "label": "Stars", "sortable": true, "type": "number", "preview": true}, {"key": "lang", "label": "语言", "preview": true}, {"key": "desc", "label": "描述"}, {"key": "url", "label": "URL", "onClick": "url", "hide": true}];  // [{key,label,sortable?,width?,class?,type?('number'|'string'|'actions'),locale?,actions?,onClick?}]
  const DATA    = [{"name": "hermes-agent", "stars": 50200, "lang": "Python", "desc": "CLI-first AI Agent: 零配置 CLI AI 代理", "url": "https://hermes-agent.nousresearch.com"}, {"name": "llm-radar", "stars": 1280, "lang": "Python", "desc": "LLM 领域动态追踪与趋势分析", "url": "https://llm-radar.jaden.tech"}, {"name": "html-gen", "stars": 45, "lang": "Python", "desc": "零依赖 Markdown → HTML 生成器。支持 A/B/C/D 四种模板", "url": "https://github.com/jadenli/html-gen"}, {"name": "http-server-cli", "stars": 320, "lang": "Python", "desc": "零依赖 HTTP 静态文件服务器，支持 CORS 和 range 请求", "url": "https://github.com/jadenli/http-server-cli"}, {"name": "script-miner", "stars": 89, "lang": "Python", "desc": "Python 脚本挖掘工具，分析代码模式与依赖", "url": "https://github.com/jadenli/script-miner"}, {"name": "daily-tracker", "stars": 12, "lang": "Python", "desc": "每日习惯追踪 CLI 工具", "url": "https://github.com/jadenli/daily-tracker"}, {"name": "favorite-manager", "stars": 3, "lang": "Python", "desc": "跨平台收藏管理工具", "url": "https://github.com/jadenli/favorite-manager"}, {"name": "hermes-manager", "stars": 7, "lang": "Python", "desc": "Hermes Agent 会话管理工具", "url": "https://github.com/jadenli/hermes-manager"}];
  const TABS    = [];     // [{key,label,field?,match?}] or []
  const OPTIONS = {"exportCSV": true, "clickModes": ["tab", "modal", "split", "expand"]};  // {pageSize?,exportCSV?,rowSelect?,stats?,search?}

  const PAGE_SIZE = (OPTIONS && OPTIONS.pageSize) || 30;
  const showExport = OPTIONS && OPTIONS.exportCSV;
  const showRowSelect = OPTIONS && OPTIONS.rowSelect;
  const showSearch = OPTIONS ? OPTIONS.search !== false : true;

  let filtered = DATA.slice(), currentPage = 1, activeTab = '', sortKey = '', sortAsc = true;
  let selectedRows = {}, colVisibility = {};
  let density = 'default', clickMode = 'tab', splitRatio = 40, splitActive = false;
  let expandedIdx = -1;

  // Restore from localStorage
  try { density = localStorage.getItem('html-gen:table:density') || 'default'; } catch(e) {}
  try { clickMode = localStorage.getItem('html-gen:table:click-mode') || 'tab'; } catch(e) {}
  try { splitRatio = parseFloat(localStorage.getItem('html-gen:table:split-ratio')) || 40; } catch(e) {}

  /* ── Security: HTML escape ── */
  function escapeHtml(text) {
    var d = document.createElement('div');
    d.textContent = text;
    return d.innerHTML;
  }

  /* ── Visible columns (respects visibility toggle + split mode preview filter) ── */
  function visibleCols(opts) {
    opts = opts || {};
    return COLUMNS.filter(function(c) {
      if (opts.requireKey && !c.key) return false;
      if (opts.excludeActions && c.type === 'actions') return false;
      if (c.hide) return false;
      if (colVisibility[c.key] === false) return false;
      // split mode: only show preview columns
      if (splitActive && c.preview !== true) return false;
      return true;
    });
  }

  /* ── Tabs ── */
  function buildTabs() {
    const bar = document.getElementById('tabsBar');
    if (!TABS || !TABS.length) { bar.innerHTML = ''; return; }
    if (!activeTab) {
      try { activeTab = localStorage.getItem('htmlgen_tab'); } catch(e) {}
      if (!activeTab || !TABS.find(function(t){return t.key===activeTab})) activeTab = TABS[0].key;
    }
    bar.innerHTML = TABS.map(function(t) {
      var cnt = t.key === TABS[0].key ? DATA.length :
        DATA.filter(function(row) { return matchTab(row, t); }).length;
      return '<div class="tab-btn'+(t.key===activeTab?' active':'')+'" onclick="switchTab(\''+t.key+'\')">'+t.label+'<span class="count">'+cnt+'</span></div>';
    }).join('');
  }

  function matchTab(row, tab) {
    if (tab.match) return row[tab.match] === tab.key;
    if (tab.field) return row[tab.field] === tab.key;
    return (row.group || row.category || '') === tab.key;
  }

  /* ── Filter & Sort ── */
  function applyFilters() {
    var q = document.getElementById('searchInput').value.toLowerCase().trim();
    filtered = DATA.slice();
    // Tab filter
    if (activeTab && TABS && TABS.length && activeTab !== TABS[0].key) {
      var tab = TABS.find(function(t){return t.key===activeTab;});
      if (tab) filtered = filtered.filter(function(row){return matchTab(row, tab);});
    }
    // Search filter
    if (q) {
      filtered = filtered.filter(function(row) {
        return COLUMNS.some(function(col) {
          if (col.type === 'actions') return false;
          return String(row[col.key] || '').toLowerCase().indexOf(q) !== -1;
        });
      });
    }
    // Sort
    if (sortKey) {
      var col = COLUMNS.find(function(c){return c.key===sortKey;});
      var isNum = col && col.type === 'number';
      var loc = col && col.locale;
      filtered.sort(function(a, b) {
        var va = a[sortKey], vb = b[sortKey];
        if (va === undefined || va === null) va = '';
        if (vb === undefined || vb === null) vb = '';
        if (isNum) { va = parseFloat(va)||0; vb = parseFloat(vb)||0; return sortAsc ? va - vb : vb - va; }
        va = String(va); vb = String(vb);
        var cmp = loc ? va.localeCompare(vb, loc) : va.localeCompare(vb);
        return sortAsc ? cmp : -cmp;
      });
    }
  }

  /* ── Render ── */
  function render() {
    applyFilters();
    if (!sortKey && TABS && TABS.length) {
      // Default sort: keep original order within tab
    }
    updateStats();
    var totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
    if (currentPage > totalPages) currentPage = totalPages;
    var start = (currentPage - 1) * PAGE_SIZE;
    var pageData = filtered.slice(start, start + PAGE_SIZE);

    var emptyEl = document.getElementById('emptyState');
    if (filtered.length === 0) { emptyEl.style.display = 'block'; }
    else { emptyEl.style.display = 'none'; }

    var tbody = document.getElementById('tbody');
    if (!pageData.length) { tbody.innerHTML = ''; renderPager(totalPages); return; }

    var cols = visibleCols();

    tbody.innerHTML = pageData.map(function(row, pi) {
      var rowIdx = start + pi;
      var rowClass = [];
      if (selectedRows[rowIdx]) rowClass.push('selected');
      if (isRowClickable(row)) rowClass.push('clickable');
      var rowHtml = '<tr class="'+rowClass.join(' ')+'"'+(isRowClickable(row)?' onclick="handleRowClick('+rowIdx+')"':'')+'>';
      if (showRowSelect) {
        rowHtml += '<td class="col-checkbox"><input type="checkbox" '+(selectedRows[rowIdx]?'checked':'')+' onclick="event.stopPropagation();toggleRow('+rowIdx+')"></td>';
      }
      cols.forEach(function(col) {
        if (col.type === 'actions') {
          rowHtml += '<td style="white-space:nowrap">'+renderActions(col, row)+'</td>';
        } else {
          var val = row[col.key];
          if (col.render) val = col.render(val, row);
          else if (val === undefined || val === null) val = '';
          else if (col.escape) val = escapeHtml(String(val));
          rowHtml += '<td'+(col.class?' class="'+col.class+'"':'')+'>'+val+'</td>';
        }
      });
      rowHtml += '</tr>';
      // Expand detail row (accordion mode)
      if (expandedIdx === rowIdx) {
        var detailCols = COLUMNS.filter(function(c) { return c.key && c.type !== 'actions' && colVisibility[c.key] !== false; });
        rowHtml += '<tr class="expand-row"><td colspan="' + (showRowSelect ? cols.length + 1 : cols.length) + '">';
        rowHtml += '<div class="expand-grid">';
        detailCols.forEach(function(c) {
          var v = row[c.key]; if (v === null || v === undefined) v = '';
          rowHtml += '<div class="expand-item"><div class="ex-label">' + escapeHtml(c.label) + '</div><div class="ex-value">' + escapeHtml(String(v)) + '</div></div>';
        });
        rowHtml += '</div></td></tr>';
      }
      return rowHtml;
    }).join('');
    renderPager(totalPages);
  }

  function renderActions(col, row) {
    if (!col.actions) return '';
    return col.actions.map(function(act) {
      var onclick = '';
      if (act.copyKey) {
        onclick = 'event.stopPropagation();copyAction(' + JSON.stringify(row[act.copyKey] || '') + ')';
      } else if (act.hrefKey) {
        onclick = 'event.stopPropagation();window.open(' + JSON.stringify(row[act.hrefKey] || '') + ',"_blank")';
      } else if (act.handler) {
        onclick = 'event.stopPropagation();window.' + act.handler + '(event,' + JSON.stringify(row) + ')';
      } else if (act.desc) {
        onclick = 'event.stopPropagation();showDemoAction(' + JSON.stringify((act.icon||'') + ' ' + act.label + ': ' + act.desc) + ')';
      }
      return '<button class="action-btn ' + (act.class||'') + '" onclick="' + onclick + '" title="' + (act.label||'') + '">' + (act.icon || act.label) + '</button>';
    }).join('');
  }

  /* ── Demo action: show description toast ── */

  function escapeAttr(s) { return String(s).replace(/'/g,"\\'").replace(/"/g,'&quot;'); }

  function getRowClickCol() {
    return COLUMNS.find(function(c){return c.onClick;});
  }

  function isRowClickable(row) {
    if (clickMode === 'tab') {
      var col = getRowClickCol();
      return col && col.onClick === 'url' && row.url;
    }
    // modal, split, or expand: any row is clickable
    return clickMode === 'modal' || clickMode === 'split' || clickMode === 'expand';
  }

  /* ── Stats ── */
  function updateStats() {
    document.getElementById('statTotal').textContent = DATA.length;

  /* ── Pagination ── */
  function renderPager(totalPages) {
    var el = document.getElementById('pager');
    if (totalPages <= 1) { el.innerHTML = ''; return; }
    var h = '<button class="btn btn-ghost btn-sm" onclick="goPage(1)"'+(currentPage===1?' disabled':'')+'>‹‹</button>';
    h += '<button class="btn btn-ghost btn-sm" onclick="goPage('+(currentPage-1)+')"'+(currentPage===1?' disabled':'')+'>‹</button>';
    h += '<span class="text-xs text-gray" style="margin:0 8px;">'+currentPage+' / '+totalPages+'</span>';
    h += '<button class="btn btn-ghost btn-sm" onclick="goPage('+(currentPage+1)+')"'+(currentPage===totalPages?' disabled':'')+'>›</button>';
    h += '<button class="btn btn-ghost btn-sm" onclick="goPage('+totalPages+')\"'+(currentPage===totalPages?' disabled':'')+'>››</button>';
    el.innerHTML = h;
  }

  window.goPage = function(n) {
    var tp = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
    currentPage = Math.max(1, Math.min(n, tp));
    expandedIdx = -1;
    render();
  };

  /* ── Sort ── */
  function initThead() {
    var thead = document.getElementById('thead');
    var cg = document.getElementById('colGroup');
    var cols = visibleCols();
    cg.innerHTML = (showRowSelect ? '<col class="col-checkbox">' : '') +
      cols.map(function(c) {
        var w = c.width || (c.type==='actions'?'auto':'');
        return '<col'+(w?' style="width:'+w+'"':'')+'>';
      }).join('');
    thead.innerHTML = '<tr>' +
      (showRowSelect ? '<th class="col-checkbox"><input type="checkbox" id="selectAll" onchange="toggleAll(event)"></th>' : '') +
      cols.map(function(c, ci) {
        var sortCls = '';
        if (c.sortable !== false && c.type !== 'actions') {
          sortCls = ' sortable';
          if (sortKey === c.key) sortCls += sortAsc ? ' sort-asc' : ' sort-desc';

        return '<th class="'+sortCls+'"'+(c.sortable!==false?' onclick="sortBy(\''+c.key+'\')"':'')+
          (c.width && c.type !== 'actions'?' style="width:'+c.width+'"':'')+'>'+c.label+'<span class="resize-handle" onmousedown="startResize(event,\''+c.key+'\')"></span></th>';
      }).join('') + '</tr>';
  }

  window.sortBy = function(key) {
    if (sortKey === key) sortAsc = !sortAsc;

    initThead();
    render();
  };

  /* ── Row selection ── */
  window.toggleRow = function(idx) {
    if (selectedRows[idx]) delete selectedRows[idx]; else selectedRows[idx] = true;
    updateStats();
    render();
  };
  window.toggleAll = function(e) {
    var checked = e.target.checked;
    var start = (currentPage - 1) * PAGE_SIZE;
    for (var i = start; i < start + PAGE_SIZE && i < filtered.length; i++) {
      if (checked) selectedRows[i] = true; else delete selectedRows[i];
    }
    updateStats();
    render();
  };

  /* ── Row click ── */
  function handleRowClick(idx) {
    var row = filtered[idx];
    // tab mode: open in new tab (default)
    if (clickMode === 'tab') {
      var col = getRowClickCol();
      if (!col || col.onClick !== 'url' || !row.url) return;
      window.open(row.url, '_blank', 'noopener,noreferrer');
      return;
    }
    // modal mode: show popup
    if (clickMode === 'modal') {
      showModal(row);
      return;
    }
    // split mode: show preview panel
    if (clickMode === 'split') {
      activateSplit(row, idx);
      return;
    }
    // expand mode: toggle inline detail
    if (clickMode === 'expand') {
      if (expandedIdx === idx) {
        expandedIdx = -1;  // collapse
      } else {
        expandedIdx = idx;  // expand
      }
      render();
      return;
    }
  }
  window.handleRowClick = handleRowClick;

  /* ── Modal Panel ── */
  function showModal(row) {
    var cols = visibleCols({requireKey: true, excludeActions: true});
    var title = row[cols[0] && cols[0].key] || '详情';
    var html = '<div style="position:relative"><button class="modal-close" onclick="closeModal()" style="position:sticky;top:0;float:right;">✕</button><h3>'+escapeHtml(String(title))+'</h3>';
    html += cols.map(function(c) {
      var v = row[c.key]; if (v === null || v === undefined) v = '';
      return '<div class="modal-field"><span class="mf-label">'+escapeHtml(c.label)+'</span><span class="mf-value">'+escapeHtml(String(v))+'</span></div>';
    }).join('');
    html += '</div>';
    document.getElementById('modalPanel').innerHTML = html;
    document.getElementById('modalOverlay').classList.add('active');

  window.showModal = showModal;
  window.closeModal = function() { document.getElementById('modalOverlay').classList.remove('active'); };

  // Esc closes modal
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && document.getElementById('modalOverlay').classList.contains('active')) {
      closeModal();

  });

  /* ── Split View ── */
  var splitRow = null, splitIdx = -1;
  function activateSplit(row, idx) {
    splitRow = row; splitIdx = idx;
    splitActive = true;
    var wrapper = document.querySelector('.wrapper');
    wrapper.classList.add('split-mode');
    initThead();
    render();  // re-render with preview-only cols
    renderSplitPreview(row);
    // highlight active row
    var tbody = document.getElementById('tbody');
    var rows = tbody.querySelectorAll('tr');
    rows.forEach(function(r){ r.classList.remove('split-active'); });
    if (rows[idx]) rows[idx].classList.add('split-active');
  }
  window.activateSplit = activateSplit;
  window.closeSplit = function() {
    splitActive = false;
    var wrapper = document.querySelector('.wrapper');
    wrapper.classList.remove('split-mode');
    splitRow = null; splitIdx = -1;
    initThead();
    render();
    // clear highlight
    var rows = document.getElementById('tbody').querySelectorAll('tr');
    rows.forEach(function(r){ r.classList.remove('split-active'); });
  };

  function renderSplitPreview(row) {
    var header = document.getElementById('splitPreviewHeader');
    var body = document.getElementById('splitPreviewBody');
    // title from first column
    var titleCol = visibleCols({requireKey: true})[0];
    header.innerHTML = (titleCol ? escapeHtml(String(row[titleCol.key]||'')) : '详情') +
      '<button class="sp-close" onclick="closeSplit()">✕</button>';

    // render: url → iframe, desc → textContent, else kv-list
    if (row.url) {
      body.innerHTML = '<iframe src="'+escapeHtml(String(row.url))+'" sandbox="allow-same-origin"></iframe>';
    } else if (row.desc) {
      var d = document.createElement('div');
      d.textContent = row.desc;
      body.innerHTML = '';
      body.appendChild(d);
    } else {
      var cols = visibleCols({requireKey: true, excludeActions: true});
      body.innerHTML = '<div class="kv-list">'+cols.map(function(c) {
        var v = row[c.key]; if (v === null || v === undefined) v = '';
        return '<div class="kv-item"><div class="kv-label">'+escapeHtml(c.label)+'</div><div class="kv-value">'+escapeHtml(String(v))+'</div></div>';
      }).join('')+'</div>';
    }
  }

  /* ── Split drag ── */
  function initSplitDrag() {
    var drag = document.getElementById('splitDrag');
    var wrapper = document.querySelector('.wrapper');
    var isDragging = false;

    drag.addEventListener('mousedown', function(e) {
      e.preventDefault();
      isDragging = true;
      drag.classList.add('active');
      document.addEventListener('mousemove', onDrag);
      document.addEventListener('mouseup', onDragEnd);
    });

    function onDrag(e) {
      if (!isDragging) return;
      var rect = wrapper.getBoundingClientRect();
      var ratio = ((e.clientX - rect.left) / rect.width) * 100;
      ratio = Math.max(25, Math.min(75, ratio));
      splitRatio = ratio;
      wrapper.style.setProperty('--spl-ratio', ratio+'%');
      try { localStorage.setItem('html-gen:table:split-ratio', ratio); } catch(e) {}
    }

    function onDragEnd() {
      isDragging = false;
      drag.classList.remove('active');
      document.removeEventListener('mousemove', onDrag);
      document.removeEventListener('mouseup', onDragEnd);
    }
  }

  /* ── Density ── */
  function applyDensity() {
    var table = document.querySelector('.data-table');
    table.classList.remove('dense', 'comfortable');
    if (density === 'compact') table.classList.add('dense');
    else if (density === 'comfortable') table.classList.add('comfortable');
  }

  /* ── Actions ── */
  window.copyAction = function(text) {
    try {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(function(){showToast('已复制: '+text);});
      } else {
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
        document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta);
        showToast('已复制: '+text);
      }
    } catch(e) { showToast('复制失败'); }
  };

  /* ── Column visibility ── */
  function initColToggle() {
    var dd = document.getElementById('colToggleDropdown');
    var html = '';

    // density section — visible when split/modal available
    var validModes = (OPTIONS && OPTIONS.clickModes) || ['tab'];
    var hasSplit = validModes.indexOf('split') !== -1;
    var hasModal = validModes.indexOf('modal') !== -1;
    var hasExpand = validModes.indexOf('expand') !== -1;
    var tabCount = (hasSplit ? 1 : 0) + (hasModal ? 1 : 0) + (hasExpand ? 1 : 0) + 1;
    if (tabCount > 1 || density !== 'default') {
      html += '<div class="settings-section">密度</div>';
      ['default:标准', 'compact:紧凑', 'comfortable:舒适'].forEach(function(item) {
        var parts = item.split(':');
        html += '<label class="settings-radio"><input type="radio" name="density" value="'+parts[0]+'" '+(density===parts[0]?'checked':'')+' onchange="setDensity(\''+parts[0]+'\')">'+parts[1]+'</label>';
      });
    }

    // click mode section
    if (tabCount > 1) {
      html += '<div class="col-toggle-divider"></div><div class="settings-section">点击模式</div>';
      if (validModes.indexOf('tab') !== -1) html += '<label class="settings-radio"><input type="radio" name="clickMode" value="tab" '+(clickMode==='tab'?'checked':'')+' onchange="setClickMode(\'tab\')">🔗 新标签页</label>';
      if (validModes.indexOf('modal') !== -1) html += '<label class="settings-radio"><input type="radio" name="clickMode" value="modal" '+(clickMode==='modal'?'checked':'')+' onchange="setClickMode(\'modal\')">📋 弹出面板</label>';
      if (validModes.indexOf('split') !== -1) html += '<label class="settings-radio"><input type="radio" name="clickMode" value="split" '+(clickMode==='split'?'checked':'')+' onchange="setClickMode(\'split\')">📑 分栏预览</label>';
      if (validModes.indexOf('expand') !== -1) html += '<label class="settings-radio"><input type="radio" name="clickMode" value="expand" '+(clickMode==='expand'?'checked':'')+' onchange="setClickMode(\'expand\')">📂 行内展开</label>';
    }

    // column visibility
    html += '<div class="col-toggle-divider"></div>';
    html += COLUMNS.filter(function(c){return c.key && c.type !== 'actions';}).map(function(c) {
      var visible = colVisibility[c.key] !== false;

      e.stopPropagation();
      dd.classList.toggle('show');

  }

  /* ── CSV Export ── */
  function initExport() {
    var btn = document.getElementById('exportBtn');
    if (!showExport) return;
    btn.style.display = 'inline-flex';
    btn.onclick = function() {
      var cols = visibleCols({excludeActions: true});
      var header = cols.map(function(c){return '"'+c.label+'"';}).join(',');
      var rows = filtered.map(function(row) {
        return cols.map(function(c) {
          var v = row[c.key]; if (v === null || v === undefined) v = '';
          return '"'+String(v).replace(/"/g,'""')+'"';
        }).join(',');
      });
      var csv = '\uFEFF' + header + '\n' + rows.join('\n');
      var blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = 'export.csv'; a.click();
      URL.revokeObjectURL(url);
      showToast('已导出 '+filtered.length+' 条');
    };
  }

  /* ── Toast ── */
  var _toastTimer;
  function showToast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(function(){el.classList.remove('show');}, 2500);
  }
  window.showToast = showToast;

  /* ── Column resize ── */
  var _resizeCol, _resizeStartX, _resizeStartW;
  window.startResize = function(e, key) {
    e.stopPropagation(); e.preventDefault();
    _resizeCol = key;
    _resizeStartX = e.clientX;
    var th = e.target.parentElement;
    _resizeStartW = th.offsetWidth;
    document.addEventListener('mousemove', onResizeMove);
    document.addEventListener('mouseup', onResizeUp);
  };
  function onResizeMove(e) {
    if (!_resizeCol) return;
    var delta = e.clientX - _resizeStartX;
    var newW = Math.max(40, _resizeStartW + delta);
    var col = COLUMNS.find(function(c){return c.key===_resizeCol;});
    if (col) col.width = newW + 'px';
    initThead();
  }
  function onResizeUp() {
    _resizeCol = null;
    document.removeEventListener('mousemove', onResizeMove);
    document.removeEventListener('mouseup', onResizeUp);
  }

  /* ── Init ── */
  function init() {
    // Restore saved split ratio
    var wrapper = document.querySelector('.wrapper');
    wrapper.style.setProperty('--spl-ratio', splitRatio+'%');

    // Search visibility
    if (!showSearch) document.getElementById('searchInput').style.display = 'none';
    initColToggle();
    initExport();
    buildTabs();
    initThead();
    applyDensity();
    render();
    initSplitDrag();
  }
  init();

  /* ═══════════════════════════════════════════
     Quick Search — Cmd+F overlay
     ═══════════════════════════════════════════ */
  var quickSearch = {
    overlay: document.getElementById('qsOverlay'),
    input: document.getElementById('qsInput'),
    active: false,

    open: function() {
      if (!showSearch) return;
      // Copy current header search value to popup
      this.input.value = document.getElementById('searchInput').value;
      this.overlay.classList.add('active');
      this.active = true;
      this.updateMatchCount();
      setTimeout(function() { quickSearch.input.focus(); quickSearch.input.select(); }, 80);
    },

    close: function() {
      // Sync popup value back to header (don't trigger search)
      document.getElementById('searchInput').value = this.input.value;
      this.overlay.classList.remove('active');
      this.active = false;
    },

    submit: function() {
      // Sync + trigger search
      document.getElementById('searchInput').value = this.input.value;
      this.overlay.classList.remove('active');
      this.active = false;
      currentPage = 1;
      render();
    },

    updateMatchCount: function() {
      var el = document.getElementById('qsMatchCount');
      if (!el) return;
      var q = this.input.value.toLowerCase().trim();
      if (!q) { el.textContent = ''; return; }
      var cnt = DATA.filter(function(row) {
        return COLUMNS.some(function(col) {
          if (col.type === 'actions') return false;
          return String(row[col.key] || '').toLowerCase().indexOf(q) !== -1;
        });
      }).length;
      el.textContent = '匹配 ' + cnt + ' 条';
    }
  };

  // Input: live match count update (no header sync)
  window.qsOnInput = function() {
    quickSearch.updateMatchCount();
  };

  // Keyboard: Enter/Esc handling inside popup
  window.qsHandleKey = function(e) {
    if (e.key === 'Enter') { e.preventDefault(); quickSearch.submit(); }
    else if (e.key === 'Escape') { e.preventDefault(); quickSearch.close(); }
  };

  // Global keyboard shortcuts
  document.addEventListener('keydown', function(e) {
    // Cmd+F / Ctrl+F
    if ((e.metaKey || e.ctrlKey) && e.key === 'f') {
      if (!showSearch) return;
      e.preventDefault();
      quickSearch.open();
    }
    // Esc when overlay active
    if (e.key === 'Escape' && quickSearch.active) {
      quickSearch.close();
    }
  });
})();
</script>
</body>
</html>
