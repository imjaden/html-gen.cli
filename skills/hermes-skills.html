<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="https://www.jaden.tech/static/img/favicon.png" type="image/png">
<title>自有 Skills 清单</title>
<style>
/* ═══════════════════════════════════════════
   style-guide.css
   Layer 1 — CSS 变量 + 基础组件
   来源：favorite-manager/index.html 深色主题
   版本：1.0(2026-07-01)
   ═══════════════════════════════════════════ */

:root {
  --cobalt-50: #eef2ff;
  --cobalt-100: #e0e7ff;
  --cobalt-400: #818cf8;
  --cobalt-500: #6366f1;
  --cobalt-600: #4f46e5;
  --cobalt-700: #4338ca;
  --cobalt-800: #3730a3;
  --cobalt-900: #312e81;
  --cobalt-950: #1e1b4b;
  --accent-400: #facc15;
  --accent-500: #eab308;
  --accent-600: #ca8a04;
  --surface-800: #1e1e2e;
  --surface-850: #181825;
  --surface-900: #11111b;
  --surface-950: #0a0a14;
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --radius-xl: 12px;
  --radius-full: 9999px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  background: var(--surface-950);
  color: #e0e0e0;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

h1 { font-size: 1.4rem; font-weight: 700; color: #f0f0f0; margin-bottom: 0.75rem; }
h2 { font-size: 1.15rem; font-weight: 600; color: #e0e0e0; margin: 1.25rem 0 0.5rem; }
h3 { font-size: 1rem; font-weight: 600; color: #d0d0d0; margin: 1rem 0 0.4rem; }
p  { margin-bottom: 0.6rem; }
a { color: var(--cobalt-400); text-decoration: none; }
a:hover { color: var(--cobalt-500); text-decoration: underline; }
code {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  background: rgba(255,255,255,0.06);
  padding: 2px 6px;
  border-radius: var(--radius-sm);
}
pre {
  background: #0d0d1a;
  border: 1px solid #2a2a3e;
  border-radius: var(--radius-md);
  padding: 12px 16px;
  overflow-x: auto;
  margin: 0.75rem 0;
}
pre code { background: none; padding: 0; }

/* ── Data Table ── */
.data-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
.data-table th {
  position: sticky; top: 0; z-index: 10;
  background: var(--surface-900);
  border-bottom: 1px solid #2a2a3e;
  padding: 8px 10px; text-align: left; font-size: 0.7rem; font-weight: 600;
  color: #9ca3af; text-transform: uppercase; letter-spacing: 0.05em;
  white-space: nowrap; user-select: none;
}
.data-table th.sortable { cursor: pointer; }
.data-table th.sortable::after { content: ' \25bc'; font-size: 10px; color: #555; }
.data-table th.sort-asc::after { content: ' \25b2'; color: var(--cobalt-400); }
.data-table th.sort-desc::after { content: ' \25bc'; color: var(--cobalt-400); }
.data-table td {
  padding: 8px 10px; border-bottom: 1px solid #1a1a2e;
  font-size: 0.8rem; vertical-align: middle;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.data-table tr { transition: background 0.15s; }
.data-table tbody tr:hover { background: rgba(79,70,229,0.08); }
.data-table tbody tr.selected { background: rgba(79,70,229,0.15); }

/* ── Badges ── */
.badge-red    { background: #3b1f1f; color: #f87171; }
.badge-yellow { background: #3b351f; color: #fbbf24; }
.badge-blue   { background: #1e3a5f; color: #60a5fa; }
.badge-black  { background: #1a1a1a; color: #9ca3af; border: 1px solid #333; }
.badge { display: inline-block; padding: 1px 8px; border-radius: var(--radius-full); font-size: 0.7rem; margin: 1px; }

/* ── Tag Pill ── */
.tag-pill {
  display: inline-block; padding: 1px 8px;
  border-radius: var(--radius-full);
  font-size: 0.7rem; margin: 1px;
  cursor: pointer; transition: opacity 0.15s;
}
.tag-pill:hover { opacity: 0.8; }
/* ── Top category tag buttons ── */
.cat-tags { display: flex; gap: 4px; flex-wrap: wrap; margin: 4px 0 8px; }
.cat-tags:empty { display: none; }
.cat-tag {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 10px; border-radius: var(--radius-full);
  font-size: 0.68rem; cursor: pointer; transition: all 0.15s;
  background: var(--surface-900); border: 1px solid #2a2a3e; color: #9ca3af;
  user-select: none;
}
.cat-tag:hover { border-color: var(--cobalt-600); color: var(--cobalt-400); }
.cat-tag.active { background: var(--cobalt-950); border-color: var(--cobalt-700); color: var(--cobalt-400); }
.cat-tag .count {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 16px; height: 16px; padding: 0 4px;
  border-radius: 9999px; font-size: 0.55rem; font-weight: 600;
  background: rgba(99,102,241,0.15); color: var(--cobalt-400);
}
.cat-tag.active .count { background: rgba(99,102,241,0.25); }
.detail-table td:first-child { width: 80px !important; }
.detail-table td { padding: 6px 10px; border-bottom: 1px solid #1a1a2e; }


/* ── Input ── */
.input-dark {
  background: #0f0f1a;
  border: 1px solid #2a2a3e;
  color: #e0e0e0;
  padding: 6px 12px;
  border-radius: var(--radius-md);
  outline: none;
  font-size: 0.85rem;
  font-family: inherit;
}
.input-dark:focus { border-color: var(--cobalt-600); box-shadow: 0 0 0 2px rgba(79,70,229,0.2); }
.input-dark::placeholder { color: #555; }

/* ── Buttons ── */
.btn {
  padding: 6px 14px; border-radius: var(--radius-md);
  border: none; cursor: pointer; font-size: 0.8rem;
  font-family: inherit;
  transition: all 0.15s;
}
.btn-primary { background: var(--cobalt-600); color: white; }
.btn-primary:hover { background: var(--cobalt-700); }
.btn-danger { background: #dc2626; color: white; }
.btn-danger:hover { background: #b91c1c; }
.btn-ghost {
  background: transparent; color: #9ca3af;
  border: 1px solid #2a2a3e;
}
.btn-ghost:hover { color: #e0e0e0; border-color: #555; }
.btn-sm { padding: 3px 10px; font-size: 0.72rem; }

/* ── Pager ── */
.pager { display: flex; gap: 4px; justify-content: center; align-items: center; margin-top: 16px; }
.pager button { min-width: 32px; }

/* ── Batch Bar ── */
.batch-bar {
  display: none;
  background: var(--cobalt-950);
  border: 1px solid var(--cobalt-700);
  border-radius: var(--radius-lg);
  padding: 10px 16px; margin-bottom: 12px;
  align-items: center; gap: 12px;
}
.batch-bar.active { display: flex; }

/* ── Modal ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.6);
  display: none; align-items: center; justify-content: center;
  z-index: 100;
}
.modal-overlay.active { display: flex; }
.modal-box {
  background: var(--surface-900);
  border-radius: var(--radius-xl);
  padding: 20px 24px;
  width: 420px; max-width: 90vw;
  border: 1px solid #2a2a3e;
}
.modal-box h3 { font-size: 0.9rem; font-weight: 700; color: #f0f0f0; margin-bottom: 12px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

/* ── Utility ── */
.card { background: var(--surface-900); border: 1px solid #1a1a2e; border-radius: var(--radius-lg); overflow: hidden; }
.wrapper { max-width: 1400px; margin: 0 auto; padding: 16px 20px; }
.flex { display: flex; }
.flex-1 { flex: 1; }
.gap-2 { gap: 8px; }
.gap-3 { gap: 12px; }
.mb-3 { margin-bottom: 12px; }
.text-xs { font-size: 0.75rem; }
.text-gray { color: #9ca3af; }
.w-full { width: 100%; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #2a2a3e; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #3a3a5e; }

</style>
<style>
/* ── Tabs ── */
.table-tabs { display:flex; gap:4px; margin-bottom:10px; overflow-x:auto; flex-wrap:nowrap; }
.table-tabs:empty { display:none; }
.tab-btn {
  padding:5px 14px; border-radius:6px 6px 0 0; cursor:pointer; font-size:0.72rem; font-weight:500;
  background:var(--surface-900); color:#6b7280; border:1px solid #1a1a2e; border-bottom:none;
  white-space:nowrap; transition:all 0.15s; user-select:none;
}
.tab-btn:hover { background:#1a1a2e; color:#d1d5db; }
.tab-btn.active { background:var(--cobalt-950); color:var(--cobalt-400); border-color:var(--cobalt-700); }
.tab-btn .count { display:inline-block; margin-left:4px; padding:1px 5px; border-radius:9999px;
  font-size:0.55rem; background:rgba(99,102,241,0.15); color:var(--cobalt-400); }
.tab-btn.active .count { background:rgba(99,102,241,0.25); }

/* ── Header bar ── */
.table-header { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
.table-header h1 { font-size:1rem; font-weight:700; margin:0; white-space:nowrap; }
.stat-pill { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:9999px;
  background:var(--surface-900); border:1px solid #1a1a2e; font-size:0.65rem; color:#9ca3af; white-space:nowrap; }
.stat-pill .num { color:var(--cobalt-400); font-weight:600; }
.header-search { background:var(--surface-850); border:1px solid #2a2a3e; color:#e0e0e0; padding:5px 10px;
  border-radius:6px; font-size:0.72rem; outline:none; width:180px; }
.header-search:focus { border-color:var(--cobalt-600); }

/* ── Table ── */
.table-wrap { border:1px solid #1a1a2e; border-radius:var(--radius-lg); overflow-x:auto; }
.data-table { width:100%; min-width:600px; border-collapse:collapse; table-layout:auto; }
.data-table th {
  position:sticky; top:0; z-index:10; background:var(--surface-900); border-bottom:1px solid #2a2a3e;
  padding:6px 8px; text-align:left; font-size:0.65rem; font-weight:600; color:#9ca3af;
  text-transform:uppercase; letter-spacing:0.04em; white-space:nowrap; user-select:none;
  position:relative;
}
.data-table th.sortable { cursor:pointer; }
.data-table th.sortable:hover { color:var(--cobalt-400); }
.data-table th.sort-asc::after { content:' ▲'; color:var(--cobalt-400); font-size:9px; }
.data-table th.sort-desc::after { content:' ▼'; color:var(--cobalt-400); font-size:9px; }
.data-table th .resize-handle {
  position:absolute; top:0; right:0; bottom:0; width:5px; cursor:col-resize;
}
.data-table th .resize-handle:hover { background:var(--cobalt-600); }
.data-table td { padding:5px 8px; border-bottom:1px solid #1a1a2e; font-size:0.75rem;
  vertical-align:middle; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.data-table tbody tr { transition:background 0.12s; }
.data-table tbody tr:hover { background:rgba(79,70,229,0.07); }
.data-table tbody tr.selected { background:rgba(79,70,229,0.15); }
.data-table tbody tr.clickable { cursor:pointer; }
.col-checkbox { width:32px; text-align:center; }
.col-checkbox input { cursor:pointer; accent-color:var(--cobalt-500); }
.col-index-num { text-align:center; color:#6b7280; font-size:0.72rem; }

/* ── Actions ── */
.action-btn { display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px;
  border-radius:5px; border:1px solid #2a2a3e; cursor:pointer; font-size:0.65rem; color:#6b7280;
  background:transparent; transition:all 0.15s; margin:0 1px; }
.action-btn:hover { background:var(--cobalt-600); border-color:var(--cobalt-600); color:white; }

/* ── Column toggle ── */
.col-toggle-wrap { position:relative; display:inline-block; }
.col-toggle-dropdown {
  display:none; position:absolute; top:100%; right:0; z-index:50; margin-top:4px;
  background:var(--surface-900); border:1px solid #2a2a3e; border-radius:8px; padding:6px 0;
  min-width:150px; max-height:260px; overflow-y:auto;
}
.col-toggle-dropdown.show { display:block; }
.col-toggle-dropdown label { display:flex; align-items:center; gap:6px; padding:4px 12px;
  font-size:0.72rem; color:#d1d5db; cursor:pointer; white-space:nowrap; }
.col-toggle-dropdown label:hover { background:rgba(79,70,229,0.1); }
.col-toggle-dropdown input { accent-color:var(--cobalt-500); }

/* ── Toast ── */
.toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); padding:8px 20px;
  background:var(--cobalt-950); color:#e0e0e0; border-radius:8px; font-size:0.78rem;
  z-index:9999; border:1px solid var(--cobalt-700); opacity:0; transition:opacity 0.2s; white-space:nowrap; pointer-events:none; }
.toast.show { opacity:1; }

/* ── Misc ── */
.empty-state { display:none; text-align:center; padding:48px 20px; color:#6b7280; }
.empty-state .icon { font-size:2rem; margin-bottom:8px; display:block; }
.flex-1 { flex:1; }

/* ── Quick Search Overlay (Cmd+F) ── */
.qs-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,0.5); backdrop-filter:blur(4px);
  display:none; justify-content:center; align-items:flex-start; padding-top:15vh; z-index:9999;
}
.qs-overlay.active { display:flex; }
.qs-modal {
  width:560px; max-width:90vw; background:var(--surface-900);
  border:1px solid var(--cobalt-700); border-radius:12px;
  box-shadow:0 20px 60px rgba(0,0,0,0.4); overflow:hidden;
  animation:qsSlideIn 0.18s ease-out;
}
@keyframes qsSlideIn { from{opacity:0;transform:translateY(-12px)} to{opacity:1;transform:translateY(0)} }
.qs-input-row { display:flex; align-items:center; padding:14px 18px; gap:10px; }
.qs-input-row .qs-icon { font-size:1.1rem; color:var(--cobalt-400); flex-shrink:0; }
.qs-input-row input {
  flex:1; border:none; outline:none; font-size:1rem; color:#e0e0e0;
  background:transparent; font-family:inherit;
}
.qs-input-row input::placeholder { color:#555; }
.qs-close-btn {
  padding:4px 12px; border-radius:6px; border:1px solid #2a2a3e;
  background:transparent; color:#9ca3af; cursor:pointer; font-size:0.72rem;
  transition:all 0.15s;
}
.qs-close-btn:hover { background:#2a2a3e; color:#e0e0e0; }
.qs-hint { display:flex; justify-content:space-between; padding:4px 18px 12px; font-size:0.62rem; color:#6b7280; }
</style>
</head>
<body>
<div class="wrapper">

<div class="table-tabs" id="tabsBar"></div>

<div class="table-header">
  <h1 id="pageTitle">自有 Skills 清单</h1>
  <div class="cat-tags" id="catTags"></div>
  
  
  <div class="flex-1"></div>
  <input class="header-search" id="searchInput" placeholder="搜索..." onkeydown="if(event.key==='Enter')doSearch()">
  
  <button class="btn btn-ghost btn-sm" id="exportBtn" title="导出 CSV" style="display:none">📥</button>
  <div class="col-toggle-wrap">
    <button class="btn btn-ghost btn-sm" id="colToggleBtn" title="列可见性">⚙️</button>
    <div class="col-toggle-dropdown" id="colToggleDropdown"></div>
  </div>
</div>

<div class="table-wrap">
  <table class="data-table">
    <colgroup id="colGroup"></colgroup>
    <thead id="thead"></thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty-state" id="emptyState"><span class="icon">📭</span><span>无匹配数据</span></div>
</div>

<div class="pager" id="pager"></div>

<div class="toast" id="toast"></div>

<!-- Skill Detail Modal -->
<div class="modal-overlay" id="detailModal" onclick="if(event.target===this)closeDetailModal()">
  <div class="modal-box" style="width:560px;max-height:80vh;overflow-y:auto">
    <h3>📋 Skill 详细信息</h3>
    <table class="detail-table" style="width:100%;font-size:0.78rem;border-collapse:collapse">
      <tbody id="detailBody"></tbody>
    </table>
    <div class="modal-actions">
      <button class="btn btn-ghost btn-sm" onclick="closeDetailModal()">关闭</button>
    </div>
  </div>
</div>



<!-- Cmd+F Quick Search Overlay -->
<div class="qs-overlay" id="qsOverlay" onclick="if(event.target===this)quickSearch.close()">
  <div class="qs-modal">
    <div class="qs-input-row">
      <span class="qs-icon">🔍</span>
      <input id="qsInput" placeholder="搜索..." onkeydown="qsHandleKey(event)" oninput="qsOnInput()">
      <button class="qs-close-btn" onclick="quickSearch.close()">Esc</button>
    </div>
    <div class="qs-hint">
      <span>Enter 搜索 · Esc 关闭</span>
      <span id="qsMatchCount"></span>
    </div>
  </div>
</div>

</div>

  const TABS    = [];     // [{key,label,field?,match?}] or []

  let filtered = DATA.slice(), currentPage = 1, activeTab = '', sortKey = '', sortAsc = true;

  /* ── Security: HTML escape ── */
  function escapeHtml(text) {

  /* ── Tabs ── */
  function buildTabs() {
    const bar = document.getElementById('tabsBar');
    if (!TABS || !TABS.length) { bar.innerHTML = ''; return; }
    if (!activeTab) {
      try { activeTab = localStorage.getItem('htmlgen_tab'); } catch(e) {}
      if (!activeTab || !TABS.find(function(t){return t.key===activeTab})) activeTab = TABS[0].key;
    }
    bar.innerHTML = TABS.map(function(t) {
      var cnt = t.key === TABS[0].key ? DATA.length :
        DATA.filter(function(row) { return matchTab(row, t); }).length;
      return '<div class="tab-btn'+(t.key===activeTab?' active':'')+'" onclick="switchTab(\''+t.key+'\')">'+t.label+'<span class="count">'+cnt+'</span></div>';
    }).join('');
  }

  function matchTab(row, tab) {
    if (tab.match) return row[tab.match] === tab.key;
    if (tab.field) return row[tab.field] === tab.key;
    return (row.group || row.category || '') === tab.key;
  }

  /* ── Filter & Sort ── */
  function applyFilters() {
    var q = document.getElementById('searchInput').value.toLowerCase().trim();
    var catFilter = document.getElementById('catTags').getAttribute('data-active-cat') || '';
    filtered = DATA.slice();
    if (catFilter) {
      filtered = filtered.filter(function(row){return row.category === catFilter;});
    }
    // Tab filter
    if (activeTab && TABS && TABS.length && activeTab !== TABS[0].key) {
      var tab = TABS.find(function(t){return t.key===activeTab;});
      if (tab) filtered = filtered.filter(function(row){return matchTab(row, tab);});
    }
    // Search filter
    if (q) {
      filtered = filtered.filter(function(row) {
        return COLUMNS.some(function(col) {
          if (col.type === 'actions') return false;
          return String(row[col.key] || '').toLowerCase().indexOf(q) !== -1;
        });
      });
    }
    // Sort
    if (sortKey) {
      var col = COLUMNS.find(function(c){return c.key===sortKey;});
      var isNum = col && col.type === 'number';
      var loc = col && col.locale;
      filtered.sort(function(a, b) {
        var va = a[sortKey], vb = b[sortKey];
        if (va === undefined || va === null) va = '';
        if (vb === undefined || vb === null) vb = '';
        if (isNum) { va = parseFloat(va)||0; vb = parseFloat(vb)||0; return sortAsc ? va - vb : vb - va; }
        va = String(va); vb = String(vb);
        var cmp = loc ? va.localeCompare(vb, loc) : va.localeCompare(vb);
        return sortAsc ? cmp : -cmp;
      });
    }
  }

  /* ── Render ── */

    }

        rowHtml += '<td class="col-checkbox"><input type="checkbox" '+(selectedRows[rowIdx]?'checked':'')+' onclick="event.stopPropagation();toggleRow('+rowIdx+')"></td>';

      cols.forEach(function(col) {

          rowHtml += '<td style="white-space:nowrap">'+renderActions(col, row)+'</td>';

          rowHtml += '<td'+(col.class?' class="'+col.class+'"':'')+'>'+val+'</td>';

      var rows = filtered.map(function(row) {
        return cols.map(function(c) {
          var v = row[c.key]; if (v === null || v === undefined) v = '';
          return '"'+String(v).replace(/"/g,'""')+'"';
        }).join(',');
      });
      var csv = '\uFEFF' + header + '\n' + rows.join('\n');
      var blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = 'export.csv'; a.click();
      URL.revokeObjectURL(url);
      showToast('已导出 '+filtered.length+' 条');
    };
  }

  /* ── Toast ── */
  var _toastTimer;
  function showToast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(function(){el.classList.remove('show');}, 2500);
  }
  window.showToast = showToast;

  /* ── Column resize ── */
  var _resizeCol, _resizeStartX, _resizeStartW;
  window.startResize = function(e, key) {
    e.stopPropagation(); e.preventDefault();
    _resizeCol = key;
    _resizeStartX = e.clientX;
    var th = e.target.parentElement;
    _resizeStartW = th.offsetWidth;
    document.addEventListener('mousemove', onResizeMove);
    document.addEventListener('mouseup', onResizeUp);
  };
  function onResizeMove(e) {
    if (!_resizeCol) return;
    var delta = e.clientX - _resizeStartX;
    var newW = Math.max(40, _resizeStartW + delta);
    var col = COLUMNS.find(function(c){return c.key===_resizeCol;});
    if (col) col.width = newW + 'px';
    initThead();
  }
  function onResizeUp() {
    _resizeCol = null;
    document.removeEventListener('mousemove', onResizeMove);
    document.removeEventListener('mouseup', onResizeUp);
  }

  /* ── Init ── */
  function init() {
    COLUMNS[1].render = renderCategoryPill;
    COLUMNS[2].render = renderProfilePills;
    document.getElementById('pageTitle').textContent = '自有Skills清单（' + DATA.length + '个）';
    buildCatTags();
    // Search visibility
    if (!showSearch) document.getElementById('searchInput').style.display = 'none';
    initColToggle();
    initExport();
    buildTabs();
    initThead();
    render();
  }
  init();

  /* ═══════════════════════════════════════════
     Quick Search — Cmd+F overlay
     ═══════════════════════════════════════════ */
  var quickSearch = {
    overlay: document.getElementById('qsOverlay'),
    input: document.getElementById('qsInput'),
    active: false,

    open: function() {
      if (!showSearch) return;
      // Copy current header search value to popup
      this.input.value = document.getElementById('searchInput').value;
      this.overlay.classList.add('active');
      this.active = true;
      this.updateMatchCount();
      setTimeout(function() { quickSearch.input.focus(); quickSearch.input.select(); }, 80);
    },

    close: function() {
      // Sync popup value back to header (don't trigger search)
      document.getElementById('searchInput').value = this.input.value;
      this.overlay.classList.remove('active');
      this.active = false;
    },

    submit: function() {
      // Sync + trigger search
      document.getElementById('searchInput').value = this.input.value;
      this.overlay.classList.remove('active');
      this.active = false;
      currentPage = 1;
      render();
    },

    updateMatchCount: function() {
      var el = document.getElementById('qsMatchCount');
      if (!el) return;
      var q = this.input.value.toLowerCase().trim();
      if (!q) { el.textContent = ''; return; }
      var cnt = DATA.filter(function(row) {
        return COLUMNS.some(function(col) {
          if (col.type === 'actions') return false;
          return String(row[col.key] || '').toLowerCase().indexOf(q) !== -1;
        });
      }).length;
      el.textContent = '匹配 ' + cnt + ' 条';
    }
  };

  // Input: live match count update (no header sync)
  window.qsOnInput = function() {
    quickSearch.updateMatchCount();
  };

  // Keyboard: Enter/Esc handling inside popup
  window.qsHandleKey = function(e) {
    if (e.key === 'Enter') { e.preventDefault(); quickSearch.submit(); }
    else if (e.key === 'Escape') { e.preventDefault(); quickSearch.close(); }
  };

  // Global keyboard shortcuts
  document.addEventListener('keydown', function(e) {
    // Cmd+F / Ctrl+F
    if ((e.metaKey || e.ctrlKey) && e.key === 'f') {
      if (!showSearch) return;
      e.preventDefault();
      quickSearch.open();
    }
    // Esc when overlay active
    if (e.key === 'Escape' && quickSearch.active) {
      quickSearch.close();
    }
  });
})();
</script>
</body>
</html>
