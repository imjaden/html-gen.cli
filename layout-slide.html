<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="https://www.jaden.tech/static/img/favicon.png" type="image/png">
<title><!--TITLE--></title>
<link rel="stylesheet" href="style-guide.css">
<style>
.slide-wrapper { display: flex; min-height: 100vh; }
.slide-sidebar {
  width: 260px; min-width: 260px;
  background: var(--surface-900);
  border-right: 1px solid #2a2a3e;
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh;
  overflow-y: auto;
}
.slide-sidebar-header {
  padding: 16px 18px 12px;
  border-bottom: 1px solid #2a2a3e;
  flex-shrink: 0;
}
.slide-sidebar-header .slide-title { font-size: 13px; font-weight: 700; color: var(--cobalt-400); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.slide-sidebar-header .slide-title:hover { color: var(--cobalt-300); }
.slide-sidebar-header .sub { font-size: 11px; color: #6b7280; margin-top: 2px; }
.slide-sidebar-header .sub-row { display: flex; align-items: center; justify-content: space-between; }
.slide-h3-toggle { display: flex; align-items: center; gap: 4px; cursor: pointer; user-select: none; font-size: 0.65rem; color: #6b7280; white-space: nowrap; }
.slide-h3-toggle:hover { color: #9ca3af; }
.slide-h3-toggle.on { color: var(--cobalt-400); }

/* ── Sidebar Collapse ── */
.slide-sidebar { width: 260px; min-width: 260px; transition: width 0.25s, min-width 0.25s; }
.slide-sidebar.collapsed { width: 48px; min-width: 48px; }
.slide-sidebar { position: relative; }
.slide-sidebar-resize {
  position: absolute; right: -4px; top: 0; bottom: 0; width: 8px;
  cursor: col-resize; z-index: 20; transition: background 0.15s;
}
.slide-sidebar-resize:hover, .slide-sidebar-resize.active { background: var(--cobalt-600); opacity: 0.4; }
.slide-sidebar.collapsed .slide-title,
.slide-sidebar.collapsed .sub-row,
.slide-sidebar.collapsed .slide-h3-toggle,
.slide-sidebar.collapsed .slide-toc,
.slide-sidebar.collapsed .slide-sidebar-footer { display: none; }
.slide-sidebar-icon { display: none; font-size: 1.2rem; justify-content: center; padding: 14px 0 8px; }
.slide-sidebar.collapsed .slide-sidebar-icon { display: flex; }
.slide-sidebar-footer { padding: 8px 12px; border-top: 1px solid #2a2a3e; display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.slide-sidebar-footer .sb-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; border-radius: 6px; border: 1px solid #2a2a3e;
  background: transparent; color: #6b7280; cursor: pointer; font-size: 0.7rem;
  transition: all 0.15s; font-family: inherit;
}
.slide-sidebar-footer .sb-btn:hover { background: rgba(79,70,229,0.1); color: #e0e0e0; }
.sb-collapse-btn { margin-left: auto; }

/* ── TOC Search ── */
.slide-toc-search { display: none; padding: 6px 12px; border-bottom: 1px solid #2a2a3e; }
.slide-toc-search.active { display: block; }
.slide-toc-search input { width: 100%; box-sizing: border-box; padding: 6px 10px; border: 1px solid #2a2a3e; border-radius: 6px; background: #0d0d1a; color: #e0e0e0; font-size: 0.72rem; outline: none; font-family: inherit; }
.slide-toc-search input:focus { border-color: var(--cobalt-600); }
.slide-toc-search input::placeholder { color: #555; }
:root.light .slide-toc-search { border-color: #e5e5e5; }
:root.light .slide-toc-search input { background: #f5f5f5; border-color: #ddd; color: #333; }
.slide-toc a.filtered-out { display: none; }
.toc-h3 { display: none; }
.toc-h3.show { display: block; }
.slide-toc .toc-h3 { display: none; }
.slide-toc .toc-h3.show { display: block; }
.slide-toc { flex: 1; overflow-y: auto; padding: 8px 0; }
.slide-toc a {
  display: block; padding: 7px 18px 7px 0;
  font-size: 0.8rem; color: #9ca3af; text-decoration: none;
  border-left: 3px solid transparent; transition: all 0.15s;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.slide-toc a:hover { background: rgba(79,70,229,0.06); color: #e0e0e0; }
.slide-toc a.active {
  background: rgba(79,70,229,0.1); color: var(--cobalt-400);
  border-left-color: var(--cobalt-600);
}
.slide-toc .toc-h2 { padding-left: 16px; font-size: 0.75rem; }
.slide-toc .toc-h3 { padding-left: 28px; font-size: 0.72rem; color: #6b7280; }

.slide-main { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; position: relative; }
.slide-page-num {
  position: absolute; top: 12px; right: 20px; font-size: 0.7rem; color: #6b7280;
  z-index: 5; opacity: 1; transition: opacity 0.5s;
}
.slide-page-num.fade { opacity: 0; }
.slide-page {
  flex: 1; overflow-y: auto; padding: 24px 40px 48px;
  animation: slideFadeIn 0.22s ease;
}
@keyframes slideFadeIn { from{opacity:0;transform:translateX(6px)} to{opacity:1;transform:translateX(0)} }

/* ── Cover Page ── */
.slide-cover { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.slide-cover h1 { font-size: 1.6rem; margin-bottom: 8px; color: #f0f0f0; }
.slide-cover .slide-cover-sub { font-size: 0.95rem; color: var(--cobalt-400); margin-bottom: 6px; }
.slide-cover .slide-cover-meta { font-size: 0.75rem; color: #6b7280; margin-bottom: 12px; }
.slide-cover .slide-cover-meta code { font-size: 0.72rem; background: rgba(255,255,255,0.04); padding: 1px 5px; }
.slide-cover .slide-cover-count { font-size: 0.8rem; color: #9ca3af; }

/* ── Content Styles ── */
.slide-page h2 { font-size: 1.25rem; font-weight: 600; color: #e0e0e0; margin: 0 0 1rem 0; }
.slide-page h3 { font-size: 1.05rem; font-weight: 600; color: #d0d0d0; margin: 0.5rem 0 0.3rem; }
.slide-page p { font-size: 0.88rem; line-height: 1.8; margin: 0.5rem 0; }
.slide-page ul, .slide-page ol { margin: 0.6rem 0; padding-left: 1.5rem; }
.slide-page li { line-height: 1.8; margin: 3px 0; }
.slide-page table { border-collapse: collapse; margin: 0.75rem 0; width: 100%; font-size: 0.8rem; }
.slide-page th, .slide-page td { border: 1px solid #2a2a3e; padding: 8px 12px; text-align: left; }
.slide-page th { background: #0d0d1a; font-weight: 600; color: #9ca3af; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.03em; }
.slide-page tr:nth-child(even) { background: rgba(255,255,255,0.02); }
.slide-page tr:hover { background: rgba(79,70,229,0.06); }
.slide-page code { font-family: var(--font-mono); font-size: 0.78rem; background: rgba(255,255,255,0.06); padding: 2px 6px; border-radius: 3px; }
.slide-page pre { background: #0d0d1a; border: 1px solid #2a2a3e; border-radius: var(--radius-md); padding: 14px 16px; overflow-x: auto; margin: 0.75rem 0; }
.slide-page pre code { background: none; padding: 0; font-size: 0.78rem; }
.slide-page blockquote { border-left: 3px solid var(--cobalt-600); margin: 0.75rem 0; padding: 8px 16px; background: rgba(79,70,229,0.06); color: #b0b0c0; }
.slide-page hr { border: none; border-top: 1px solid #2a2a3e; margin: 0.5rem 0; }
.slide-page img { max-width: 100%; border-radius: var(--radius-md); margin: 1rem 0; }

/* ── H3 Column Mode ── */
.slide-columns { display: flex; gap: 24px; height: 100%; }
.slide-columns.cols-2 > .slide-col { flex: 1; min-width: 0; }
.slide-columns.cols-3 > .slide-col { flex: 1; min-width: 0; }
.slide-col { overflow-y: auto; }
.slide-col h3 { font-size: 1rem; font-weight: 600; color: var(--cobalt-400); margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid #2a2a3e; }
.slide-col h3:first-child { margin-top: 0; }

/* ── Performance Warning ── */
.perf-warning {
  margin: 0 40px 8px; padding: 8px 14px; border-radius: 6px;
  background: rgba(251,191,36,0.1); border: 1px solid rgba(251,191,36,0.25);
  color: #fbbf24; font-size: 0.72rem; display: none;
}

/* ── Navigation Dots ── */
.slide-nav { display: flex; justify-content: center; align-items: center; gap: 10px; padding: 8px 16px 12px; }
.slide-dots { display: flex; gap: 5px; align-items: center; }
.slide-dot {
  width: 7px; height: 7px; border-radius: 50%; background: #3a3a5e;
  cursor: pointer; transition: all 0.2s; flex-shrink: 0;
}
.slide-dot.active { background: var(--cobalt-400); width: 22px; border-radius: 4px; }
.slide-dot.visited { background: #555; }
.slide-nav-title { font-size: 0.68rem; color: #6b7280; max-width: 400px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ── Top-Right Toolbar ── */
.top-toolbar {
  position: fixed; top: 12px; right: 16px; z-index: 900;
  display: flex; align-items: center; gap: 2px;
  background: rgba(17,17,27,0.88); backdrop-filter: blur(12px);
  border: 1px solid #2a2a3e; border-radius: 28px;
  padding: 3px 5px;
}
:root.light .top-toolbar { background: rgba(255,255,255,0.88); border-color: #ddd; }
.tb-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; border-radius: 50%; border: none;
  background: transparent; color: #9ca3af; cursor: pointer;
  font-size: 0.85rem; transition: all 0.2s; font-family: inherit;
}
.tb-btn:hover { background: rgba(79,70,229,0.15); color: #e0e0e0; }
.tb-btn.active { background: var(--cobalt-600); color: #fff; }
.tb-divider { width: 1px; height: 18px; background: #2a2a3e; margin: 0 3px; }

/* ── Light Theme ── */
:root.light {
  --surface-950: #f5f5f5; --surface-900: #ffffff; --surface-850: #f0f0f0;
  --surface-800: #e8e8e8; --cobalt-950: #eef2ff; --cobalt-600: #6366f1;
}
:root.light body { color: #333; background: #f5f5f5; }
:root.light .slide-sidebar { background: #fff; border-color: #e5e5e5; }
:root.light .slide-sidebar-header { border-color: #e5e5e5; }
:root.light .slide-toc a { color: #666; }
:root.light .slide-toc a:hover { background: rgba(79,70,229,0.04); color: #333; }
:root.light .slide-toc a.active { background: rgba(79,70,229,0.08); color: var(--cobalt-600); }
:root.light .slide-page h2 { color: #222; }
:root.light .slide-page h3 { color: #333; }
:root.light .slide-page p, :root.light .slide-page li { color: #444; }
:root.light .slide-page code { background: rgba(0,0,0,0.06); color: #555; }
:root.light .slide-page pre { background: #f0f0f0; border-color: #ddd; color: #333; }
:root.light .slide-page blockquote { background: rgba(79,70,229,0.04); color: #555; border-color: var(--cobalt-400); }
:root.light .slide-page table th { background: #f0f0f0; color: #555; }
:root.light .slide-page table td { border-color: #ddd; }
:root.light .slide-page hr { border-color: #ddd; }
:root.light .slide-cover h1 { color: #222; }
:root.light .slide-cover .slide-cover-sub { color: var(--cobalt-600); }
:root.light .slide-nav { background: #f5f5f5; }
:root.light .slide-dot { background: #ccc; }
:root.light .slide-dot.visited { background: #999; }
:root.light .perf-warning { background: rgba(251,191,36,0.08); }

@media (max-width: 768px) {
  .slide-sidebar { display: none; }
  .slide-page { padding: 16px 20px 40px; }
}
</style>
</head>
<body>
<div class="slide-wrapper">

  <aside class="slide-sidebar" id="sidebar">
    <div class="slide-sidebar-resize" id="sbResize"></div>
    <div class="slide-sidebar-icon">🎞️</div>
    <div class="slide-sidebar-header">
      <div class="slide-title" title="<!--TITLE-->" id="slideTitle">🎞️ <!--TITLE--></div>
      <div class="sub-row">
        <div class="sub"><!--SUBTITLE--></div>
        <div class="slide-h3-toggle" id="h3Toggle" onclick="toggleH3()">H3</div>
      </div>
    </div>
    <nav class="slide-toc" id="toc"></nav>
    <!-- TOC Search -->
    <div class="slide-toc-search" id="tocSearchWrap">
      <input type="text" id="tocSearchInput" placeholder="搜索章节..." onkeydown="tocSearchKey(event)">
    </div>
    <div class="slide-sidebar-footer">
      <button class="sb-btn" id="tocSearchBtn" onclick="toggleTocSearch()" title="搜索 TOC">🔍</button>
      <span style="flex:1"></span>
      <button class="sb-btn sb-collapse-btn" id="collapseBtn" onclick="toggleSidebar()" title="折叠侧边栏">◀◀</button>
    </div>
  </aside>

  <div class="slide-main" id="slideMain">
    <div class="perf-warning" id="perfWarning"><!--PERF_WARNING--></div>
    <div class="slide-page-num" id="slidePageNum"></div>
    <div class="slide-page" id="slidePage"></div>
  </div>

</div>

<div class="slide-nav" id="slideNav">
  <div class="slide-dots" id="slideDots"></div>
  <div class="slide-nav-title" id="slideNavTitle"></div>
</div>

<!-- Top-Right Toolbar -->
<div class="top-toolbar" id="topToolbar">
  <button class="tb-btn active" id="langZh" onclick="setLang('zh')" title="中文">🇨🇳</button>
  <button class="tb-btn" id="langEn" onclick="setLang('en')" title="English">🇺🇸</button>
  <span class="tb-divider"></span>
  <button class="tb-btn" id="themeBtn" onclick="toggleTheme()" title="切换主题">🌙</button>
</div>

<!-- Hidden: content source for DOM cloning -->
<div style="display:none">
  <div class="doc-header">
    <h1><!--TITLE--></h1>
    <div class="meta"><!--METADATA--></div>
  </div>
  <div id="docBody"><!--CONTENT--></div>
</div>

<script>
(function() {
  const body = document.getElementById('docBody');
  const toc  = document.getElementById('toc');
  const headings = body.querySelectorAll('h2, h3');
  const tocItems = [];

  /* ═══════ i18n & Theme ═══════ */
  var _lang = localStorage.getItem('html-gen:layoutslide_lang');
  _lang = (_lang === 'zh' || _lang === 'en') ? _lang : 'zh';
  var L = {
    zh: { pages: '共 {n} 页', current: '{m} / {n}' },
    en: { pages: '{n} pages', current: '{m} / {n}' }
  };
  function t(key, params) {
    var s = L[_lang][key];
    Object.keys(params).forEach(function(k) { s = s.replace('{' + k + '}', params[k]); });
    return s;
  }
  // Init lang buttons
  document.getElementById('langZh').classList.toggle('active', _lang === 'zh');
  document.getElementById('langEn').classList.toggle('active', _lang === 'en');

  window.setLang = function(lang) {
    if (lang !== 'zh' && lang !== 'en') return;
    _lang = lang;
    localStorage.setItem('html-gen:layoutslide_lang', lang);
    document.getElementById('langZh').classList.toggle('active', lang === 'zh');
    document.getElementById('langEn').classList.toggle('active', lang === 'en');
    if (typeof slide !== 'undefined' && slide._updateSub) slide._updateSub();
  };

  // Theme init + toggle
  var _theme = localStorage.getItem('html-gen:layoutslide_theme');
  if (_theme === 'light') document.documentElement.classList.add('light');
  document.getElementById('themeBtn').textContent = (_theme === 'light') ? '☀️' : '🌙';

  window.toggleTheme = function() {
    var r = document.documentElement;
    var isLight = !r.classList.contains('light');
    r.classList.toggle('light', isLight);
    localStorage.setItem('html-gen:layoutslide_theme', isLight ? 'light' : 'dark');
    document.getElementById('themeBtn').textContent = isLight ? '☀️' : '🌙';
  };

  // Title click → copy path
  document.getElementById('slideTitle').addEventListener('click', function() {
    var metaEl = document.querySelector('.doc-header .meta');
    var m = metaEl ? metaEl.textContent.match(/路径:\s*(.+)/) : null;
    var path = m ? m[1].trim() : document.title;
    path = path.replace(/^\/Users\/[^/]+/, '~').replace(/^\/home\/[^/]+/, '~');
    var done = function() { showToast('已复制: ' + path); };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(path).then(done).catch(function() {
        fallbackCopy(path); done();
      });
    } else { fallbackCopy(path); done(); }
  });

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
  }

  function showToast(msg) {
    var el = document.getElementById('slideToast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'slideToast';
      el.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:8px 20px;background:var(--cobalt-950);color:#e0e0e0;border-radius:8px;font-size:0.78rem;z-index:9999;border:1px solid var(--cobalt-700);opacity:0;transition:opacity 0.2s;white-space:nowrap;pointer-events:none';
      document.body.appendChild(el);
    }
    el.textContent = msg; el.style.opacity = '1';
    clearTimeout(el._hide);
    el._hide = setTimeout(function() { el.style.opacity = '0'; }, 2500);
  }

  /* ═══════ Slide Mode ═══════ */
  var slide = {
    currentPage: 0,
    pages: [],
    _h2Index: {},
    _fadeTimer: null,

    init: function() {
      var self = this;
      var h2s = body.querySelectorAll('h2');
      var coverTitle = document.querySelector('.doc-header h1').textContent;
      var coverSub = (document.querySelector('.slide-sidebar-header .sub').textContent || '').trim();
      var coverMetaEl = document.querySelector('.doc-header .meta');
      var coverMeta = coverMetaEl ? coverMetaEl.innerHTML : '';

      // Cover page
      this.pages.push({ type: 'cover', title: coverTitle, subtitle: coverSub, meta: coverMeta });

      // h2 pages — detect h3 children for column mode
      h2s.forEach(function(h2, pi) {
        var section = { type: 'h2', title: h2.textContent, id: h2.id, nodes: [], h3s: [] };
        var el = h2.nextElementSibling;
        var currentH3 = null;
        while (el && el.tagName !== 'H2') {
          if (el.tagName === 'H3') {
            if (currentH3) section.h3s.push(currentH3);
            currentH3 = { title: el.textContent, id: el.id, nodes: [] };
          } else if (currentH3) {
            currentH3.nodes.push(el.cloneNode(true));
          } else {
            section.nodes.push(el.cloneNode(true));
          }
          el = el.nextElementSibling;
        }
        if (currentH3) section.h3s.push(currentH3);
        self.pages.push(section);
        self._h2Index[h2.id] = pi + 1;
      });

      // Update sidebar header
      var logoEl = document.querySelector('.slide-sidebar-header .slide-title');
      if (logoEl) {
        var txt = logoEl.textContent.replace(/^🎞️\s*/, '');
        if (txt.length > 30) txt = txt.substring(0, 30) + '…';
        logoEl.textContent = '🎞️ ' + txt;
      }
      var subEl = document.querySelector('.slide-sidebar-header .sub');
      if (subEl) {
        this._subBase = subEl.textContent.trim();
      }
      this._updateSub();

      this.buildDots();
      this.restoreProgress();

      // Show perf warning if present
      var pw = document.getElementById('perfWarning');
      if (pw && pw.textContent.trim()) pw.style.display = 'block';

      this.goTo(this.currentPage);
    },

    goTo: function(n) {
      if (n < 0 || n >= this.pages.length) return;
      this.currentPage = n;
      this.renderPage(n);
      this.saveProgress();
      this._syncToc();
      this._updateDots();
      this._showPageNum();
      this._updateSub();
    },

    next: function() { if (this.currentPage < this.pages.length - 1) this.goTo(this.currentPage + 1); },
    prev: function() { if (this.currentPage > 0) this.goTo(this.currentPage - 1); },

    renderPage: function(n) {
      var page = this.pages[n];
      var container = document.getElementById('slidePage');
      while (container.firstChild) container.removeChild(container.firstChild);

      if (page.type === 'cover') {
        container.className = 'slide-page slide-cover';
        var h1 = document.createElement('h1'); h1.textContent = page.title; container.appendChild(h1);
        if (page.subtitle) { var s = document.createElement('div'); s.className = 'slide-cover-sub'; s.textContent = page.subtitle; container.appendChild(s); }
        var m = document.createElement('div'); m.className = 'slide-cover-meta'; m.innerHTML = page.meta; container.appendChild(m);
        var c = document.createElement('div'); c.className = 'slide-cover-count'; c.textContent = '共 ' + (this.pages.length - 1) + ' 节'; container.appendChild(c);
      } else {
        container.className = 'slide-page';
        // h3 column mode: 2+ h3s → side-by-side columns
        if (page.h3s && page.h3s.length >= 2) {
          var h2 = document.createElement('h2'); h2.textContent = page.title; container.appendChild(h2);
          var cols = document.createElement('div');
          cols.className = 'slide-columns cols-' + Math.min(page.h3s.length, 3);
          page.h3s.forEach(function(h3s) {
            var col = document.createElement('div'); col.className = 'slide-col';
            var h3 = document.createElement('h3'); h3.textContent = h3s.title; col.appendChild(h3);
            h3s.nodes.forEach(function(n) { col.appendChild(n.cloneNode(true)); });
            cols.appendChild(col);
          });
          container.appendChild(cols);
          // If there are also top-level nodes (before first h3), show them above columns
          if (page.nodes.length > 0) {
            var topDiv = document.createElement('div');
            page.nodes.forEach(function(n) { topDiv.appendChild(n.cloneNode(true)); });
            container.insertBefore(topDiv, cols);
          }
        } else {
          // Single column: full width (h3 降级 or no h3)
          var h2 = document.createElement('h2'); h2.textContent = page.title; container.appendChild(h2);
          page.nodes.forEach(function(node) { container.appendChild(node.cloneNode(true)); });
          if (page.h3s) {
            page.h3s.forEach(function(h3s) {
              var h3 = document.createElement('h3'); h3.textContent = h3s.title; container.appendChild(h3);
              h3s.nodes.forEach(function(n) { container.appendChild(n.cloneNode(true)); });
            });
          }
        }
      }
    },

    buildDots: function() {
      var self = this;
      var dots = document.getElementById('slideDots');
      if (!dots) return;
      dots.innerHTML = '';
      this.pages.forEach(function(p, i) {
        var dot = document.createElement('div'); dot.className = 'slide-dot'; dot.title = p.title;
        dot.addEventListener('click', function() { self.goTo(i); });
        dots.appendChild(dot);
      });
      this._updateDots();
    },

    _updateDots: function() {
      var el = document.getElementById('slideDots'); if (!el) return;
      var dots = el.children;
      for (var i = 0; i < dots.length; i++) {
        dots[i].classList.remove('active', 'visited');
        if (i === this.currentPage) dots[i].classList.add('active');
        else if (i < this.currentPage) dots[i].classList.add('visited');
      }
      var t = document.getElementById('slideNavTitle'); if (t) t.textContent = this.pages[this.currentPage].title;
    },

    _showPageNum: function() {
      var el = document.getElementById('slidePageNum'); if (!el) return;
      el.textContent = (this.currentPage + 1) + ' / ' + this.pages.length;
      el.classList.remove('fade'); clearTimeout(this._fadeTimer);
      this._fadeTimer = setTimeout(function() { el.classList.add('fade'); }, 3000);
    },

    _syncToc: function() {
      if (this.currentPage === 0) { tocItems.forEach(function(a) { a.classList.remove('active'); }); return; }
      var page = this.pages[this.currentPage];
      tocItems.forEach(function(a) { a.classList.toggle('active', a.dataset.target === page.id); });
    },

    _updateSub: function() {
      var subEl = document.querySelector('.slide-sidebar-header .sub');
      if (!subEl || this._subBase === undefined) return;
      var total = this.pages.length - 1;
      var text = this.currentPage === 0
        ? t('pages', {n: total})
        : t('current', {m: this.currentPage, n: total});
      subEl.textContent = (this._subBase ? this._subBase + ' · ' : '') + text;
    },

    saveProgress: function() { try { localStorage.setItem('html-gen:layoutslide_page', this.currentPage); } catch(e) {} },

    restoreProgress: function() {
      try { var n = parseInt(localStorage.getItem('html-gen:layoutslide_page'), 10); if (isNaN(n) || n < 0 || n >= this.pages.length) n = 0; this.currentPage = n; } catch(e) { this.currentPage = 0; }
    }
  };

  /* ═══════ TOC Search ═══════ */
  var _tocSearchActive = false, _tocSearchTimer;
  window.toggleTocSearch = function() {
    _tocSearchActive = !_tocSearchActive;
    var wrap = document.getElementById('tocSearchWrap');
    var input = document.getElementById('tocSearchInput');
    var btn = document.getElementById('tocSearchBtn');
    if (wrap) wrap.classList.toggle('active', _tocSearchActive);
    if (btn) btn.style.color = _tocSearchActive ? 'var(--cobalt-400)' : '';
    if (_tocSearchActive) {
      setTimeout(function() { input.focus(); input.select(); }, 50);
    } else {
      input.value = '';
      doTocFilter('');
    }
  };

  function doTocFilter(q) {
    tocItems.forEach(function(a) {
      a.classList.toggle('filtered-out', q.length >= 2 && a.textContent.toLowerCase().indexOf(q) === -1);
    });
  }

  document.getElementById('tocSearchInput').addEventListener('input', function() {
    var q = this.value.toLowerCase().trim();
    clearTimeout(_tocSearchTimer);
    _tocSearchTimer = setTimeout(function() { doTocFilter(q); }, 150);
  });

  window.tocSearchKey = function(e) {
    if (e.key === 'Escape') {
      _tocSearchActive = true; toggleTocSearch(); // force close
    } else if (e.key === 'Enter') {
      var q = document.getElementById('tocSearchInput').value.toLowerCase().trim();
      if (q.length >= 2) {
        var match = tocItems.find(function(a){ return !a.classList.contains('filtered-out'); });
        if (match) match.click();
        toggleTocSearch();
      }
    }
  };

  // Click away to close
  document.addEventListener('click', function(e) {
    if (_tocSearchActive && !e.target.closest('.slide-toc-search') && e.target !== document.getElementById('tocSearchBtn')) {
      _tocSearchActive = true; toggleTocSearch();
    }
  });

  /* ═══════ TOC ═══════ */
  headings.forEach(function(h, i) {
    if (!h.id) h.id = 'section-' + i;
    var anchor = document.createElement('a');
    anchor.className = 'anchor-link'; anchor.textContent = '\u00b6'; anchor.href = '#' + h.id;
    anchor.addEventListener('click', function(e) {
      e.preventDefault();
      var url = window.location.href.split('#')[0] + '#' + h.id;
      navigator.clipboard.writeText(url);
      anchor.textContent = '\u2713';
      setTimeout(function() { anchor.textContent = '\u00b6'; }, 1500);
    });
    h.appendChild(anchor);
    var level = h.tagName.toLowerCase().replace('h', '');
    var link = document.createElement('a');
    link.href = '#' + h.id; link.textContent = h.textContent;
    link.className = 'toc-h' + level; link.dataset.target = h.id;
    link.addEventListener('click', function(e) {
      e.preventDefault();
      var idx = slide._h2Index[h.id];
      if (idx !== undefined) slide.goTo(idx);
    });
    toc.appendChild(link);
    tocItems.push(link);
  });

  /* ═══════ Keyboard ═══════ */
  document.addEventListener('keydown', function(e) {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); slide.next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); slide.prev(); }
    else if (e.key === ' ' && !e.shiftKey) { e.preventDefault(); slide.next(); }
    else if (e.key === ' ' && e.shiftKey) { e.preventDefault(); slide.prev(); }
    else if (e.key === 'Home') { e.preventDefault(); slide.goTo(0); }
    else if (e.key === 'End') { e.preventDefault(); slide.goTo(slide.pages.length - 1); }
    else if (e.key === 'f' || e.key === 'F') {
      e.preventDefault();
      if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen();
    }
  });

  /* ═══════ H3 Toggle ═══════ */
  var _h3Visible = false;
  window.toggleH3 = function() {
    _h3Visible = !_h3Visible;
    var btn = document.getElementById('h3Toggle');
    if (btn) { btn.classList.toggle('on', _h3Visible); btn.textContent = _h3Visible ? 'H3 ✓' : 'H3'; }
    try { localStorage.setItem('html-gen:sidebar:h3-visible', _h3Visible); } catch(e) {}
    var h3s = document.querySelectorAll('.toc-h3');
    for (var i = 0; i < h3s.length; i++) { h3s[i].classList.toggle('show', _h3Visible); }
  };

  // Restore H3 state
  try {
    var savedH3 = localStorage.getItem('html-gen:sidebar:h3-visible');
    if (savedH3 === 'true') { _h3Visible = true; document.getElementById('h3Toggle').classList.add('on'); document.getElementById('h3Toggle').textContent = 'H3 ✓'; }
  } catch(e) {}

  /* ═══════ Sidebar Collapse ═══════ */
  var _sidebarCollapsed = false;
  window.toggleSidebar = function() {
    _sidebarCollapsed = !_sidebarCollapsed;
    var sb = document.getElementById('sidebar');
    var btn = document.getElementById('collapseBtn');
    if (sb) sb.classList.toggle('collapsed', _sidebarCollapsed);
    if (btn) btn.textContent = _sidebarCollapsed ? '▶▶' : '◀◀';
    try { localStorage.setItem('html-gen:sidebar:collapsed', _sidebarCollapsed); } catch(e) {}
  };

  // Restore collapse state
  try {
    var savedCollapsed = localStorage.getItem('html-gen:sidebar:collapsed');
    if (savedCollapsed === 'true') toggleSidebar();
  } catch(e) {}

  // [ shortcut — collapse sidebar (skip in inputs)
  document.addEventListener('keydown', function(e) {
    if (e.key === '[' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
      if (!e.metaKey && !e.ctrlKey) { e.preventDefault(); toggleSidebar(); }
    }
  });

  /* ── Sidebar Resize ── */
  (function() {
    var sb = document.getElementById('sidebar');
    var handle = document.getElementById('sbResize');
    var dragging = false;
    handle.addEventListener('mousedown', function(e) {
      e.preventDefault();
      dragging = true;
      handle.classList.add('active');
    });
    document.addEventListener('mousemove', function(e) {
      if (!dragging) return;
      var w = e.clientX;
      w = Math.max(200, Math.min(400, w));
      sb.style.width = w + 'px';
      sb.style.minWidth = w + 'px';
    });
    document.addEventListener('mouseup', function() {
      if (dragging) {
        dragging = false;
        handle.classList.remove('active');
        try { localStorage.setItem('html-gen:slide:sidebar-width', sb.style.width); } catch(e) {}
      }
    });
    try { var sw = localStorage.getItem('html-gen:slide:sidebar-width'); if (sw) { sb.style.width = sw; sb.style.minWidth = sw; } } catch(e) {}
  })();

  slide.init();
})();
</script>
</body>
</html>
