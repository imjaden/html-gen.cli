<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="https://www.jaden.tech/static/img/favicon.png" type="image/png">
<title><!--TITLE--></title>
<link rel="stylesheet" href="style-guide.css">
<style>
.doc-wrapper { display: flex; min-height: 100vh; }
.doc-sidebar {
  width: 260px; min-width: 260px;
  background: var(--surface-900);
  border-right: 1px solid #2a2a3e;
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh;
  overflow-y: auto;
  transition: width 0.25s, min-width 0.25s;
}
.doc-sidebar.collapsed { width: 48px; min-width: 48px; }
.doc-sidebar.collapsed .doc-sidebar-header,
.doc-sidebar.collapsed .doc-toc,
.doc-sidebar.collapsed .doc-sidebar-footer { display: none; }
.doc-sidebar-icon { display: none; font-size: 1.2rem; justify-content: center; padding: 14px 0 8px; }
.doc-sidebar.collapsed .doc-sidebar-icon { display: flex; }
.doc-sidebar-header {
  padding: 16px 18px 12px;
  border-bottom: 1px solid #2a2a3e;
  flex-shrink: 0;
}
.doc-sidebar-header .sidebar-title { font-size: 13px; font-weight: 700; color: var(--cobalt-400); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.doc-sidebar-header .sidebar-title:hover { color: var(--cobalt-300); }
.doc-sidebar-header .sub { font-size: 11px; color: #6b7280; margin-top: 2px; }
.doc-sidebar-header .sub-row { display: flex; align-items: center; justify-content: space-between; }
.doc-h3-toggle { display: flex; align-items: center; gap: 4px; cursor: pointer; user-select: none; font-size: 0.65rem; color: #6b7280; white-space: nowrap; }
.doc-h3-toggle:hover { color: #9ca3af; }
.doc-h3-toggle.on { color: var(--cobalt-400); }
.doc-toc { flex: 1; overflow-y: auto; padding: 8px 0; }
.doc-toc ul { list-style: none; padding: 0; margin: 0; }
.doc-toc a {
  display: block;
  padding: 7px 18px 7px 0;
  font-size: 0.8rem; color: #9ca3af;
  text-decoration: none;
  border-left: 3px solid transparent;
  transition: all 0.15s;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.doc-toc a:hover { background: rgba(79,70,229,0.06); color: #e0e0e0; }
.doc-toc a.active {
  background: rgba(79,70,229,0.1);
  color: var(--cobalt-400);
  border-left-color: var(--cobalt-600);
}
.doc-toc .toc-h2 { padding-left: 16px; font-size: 0.75rem; }
.doc-toc .toc-h3 { padding-left: 28px; font-size: 0.72rem; color: #6b7280; display: none; }
.doc-toc .toc-h3.show { display: block; }

.doc-main { flex: 1; min-width: 0; overflow-y: auto; }
.doc-header {
  padding: 0 80px;
  margin-top: 30px;
  position: sticky; top: 0; z-index: 10;
  background: var(--surface-950);
}
.doc-header h1 { font-size: 1.3rem; font-weight: 700; color: #f0f0f0; margin: 0; }
.doc-header .meta { font-size: 0.75rem; color: #6b7280; line-height: 1.6; margin-top: 6px; }
.doc-header .meta code { font-size: 0.72rem; background: rgba(255,255,255,0.04); padding: 1px 5px; }
.doc-body { padding: 0 80px; max-width: 960px; padding-bottom: 40px; }

.doc-body h1 { font-size: 1.5rem; font-weight: 700; color: #f0f0f0; margin: 0.25rem 0 0.5rem; padding-bottom: 8px; border-bottom: 1px solid #2a2a3e; }
.doc-body h1:first-child { margin-top: 0; }
.doc-body h2 { font-size: 1.25rem; font-weight: 600; color: #e0e0e0; margin: 1rem 0 1rem 0; }
.doc-body h3 { font-size: 1.05rem; font-weight: 600; color: #d0d0d0; margin: 0.5rem 0 0.3rem; }
.doc-body p { font-size: 0.88rem; line-height: 1.8; margin: 0.5rem 0; }
.doc-body ul, .doc-body ol { margin: 0.6rem 0; padding-left: 1.5rem; }
.doc-body li { line-height: 1.8; margin: 3px 0; }
.doc-body table { border-collapse: collapse; margin: 0.75rem 0; width: 100%; font-size: 0.8rem; }
.doc-body th, .doc-body td { border: 1px solid #2a2a3e; padding: 8px 12px; text-align: left; }
.doc-body th { background: #0d0d1a; font-weight: 600; color: #9ca3af; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.03em; }
.doc-body tr:nth-child(even) { background: rgba(255,255,255,0.02); }
.doc-body tr:hover { background: rgba(79,70,229,0.06); }
.doc-body code { font-family: var(--font-mono); font-size: 0.78rem; background: rgba(255,255,255,0.06); padding: 2px 6px; border-radius: 3px; }
.doc-body pre { position: relative; background: #0d0d1a; border: 1px solid #2a2a3e; border-radius: var(--radius-md); padding: 14px 16px; overflow-x: auto; margin: 0.75rem 0; }
.doc-body pre code { background: none; padding: 0; font-size: 0.78rem; }
.copy-btn { position: absolute; top: 6px; right: 6px; background: rgba(255,255,255,0.06); border: 1px solid #2a2a3e; color: #9ca3af; padding: 3px 8px; border-radius: var(--radius-sm); font-size: 0.65rem; cursor: pointer; font-family: inherit; transition: all 0.15s; opacity: 0; }
pre:hover .copy-btn { opacity: 1; }
.copy-btn:hover { background: rgba(79,70,229,0.2); color: var(--cobalt-400); border-color: var(--cobalt-600); }
.doc-body blockquote { border-left: 3px solid var(--cobalt-600); margin: 0.75rem 0; padding: 8px 16px; background: rgba(79,70,229,0.06); color: #b0b0c0; }
.doc-body hr { border: none; border-top: 1px solid #2a2a3e; margin: 0.5rem 0; }
.doc-body img { max-width: 100%; border-radius: var(--radius-md); margin: 1rem 0; }
.doc-footer { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #2a2a3e; font-size: 0.75rem; color: #6b7280; }

.progress-bar { position: fixed; top: 0; left: 0; width: 0; height: 2px; background: var(--cobalt-600); z-index: 999; transition: width 0.1s linear; }

.lightbox { display: none; position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; cursor: zoom-out; }
.lightbox.active { display: flex; }
.lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 8px; box-shadow: 0 8px 40px rgba(0,0,0,0.5); cursor: default; }
.lightbox .lb-close { position: fixed; top: 16px; right: 20px; font-size: 28px; color: #aaa; cursor: pointer; line-height: 1; }
.lightbox .lb-close:hover { color: #fff; }
.doc-body img { cursor: zoom-in; }

.anchor-link { opacity: 0; text-decoration: none; color: var(--cobalt-500); font-size: 0.75em; margin-left: 4px; font-weight: 400; transition: opacity 0.15s; }
h2:hover .anchor-link, h3:hover .anchor-link { opacity: 1; }
.anchor-link:hover { color: var(--cobalt-400); }

.code-with-lines { counter-reset: line; padding-left: 0; }
.code-with-lines .line::before { counter-increment: line; content: counter(line); display: inline-block; width: 2.5em; min-width: 2.5em; text-align: right; padding-right: 1em; color: #4a5568; user-select: none; }

.doc-body blockquote.callout { border-left-width: 4px; padding: 10px 16px; margin: 0.75rem 0; }
.doc-body blockquote.callout strong { font-weight: 700; }
.doc-body blockquote.callout.note { border-left-color: var(--cobalt-500); background: rgba(79,70,229,0.08); color: #c0c4f0; }
.doc-body blockquote.callout.tip { border-left-color: #34d399; background: rgba(52,211,153,0.08); color: #a7f3d0; }
.doc-body blockquote.callout.warning { border-left-color: #fbbf24; background: rgba(251,191,36,0.08); color: #fde68a; }
.doc-body blockquote.callout.danger { border-left-color: #f87171; background: rgba(248,113,113,0.08); color: #fecaca; }

/* ── Sidebar Footer ── */
.doc-sidebar-footer { padding: 8px 12px; border-top: 1px solid #2a2a3e; display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.doc-sidebar-footer .sb-btn { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 6px; border: 1px solid #2a2a3e; background: transparent; color: #6b7280; cursor: pointer; font-size: 0.7rem; transition: all 0.15s; font-family: inherit; }
.doc-sidebar-footer .sb-btn:hover { background: rgba(79,70,229,0.1); color: #e0e0e0; }

/* ── Top-Right Toolbar ── */
.top-toolbar { position: fixed; top: 12px; right: 16px; z-index: 900; display: flex; align-items: center; gap: 2px; background: rgba(17,17,27,0.88); backdrop-filter: blur(12px); border: 1px solid #2a2a3e; border-radius: 28px; padding: 3px 5px; }
:root.light .top-toolbar { background: rgba(255,255,255,0.88); border-color: #ddd; }
.tb-btn { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; border: none; background: transparent; color: #9ca3af; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; font-family: inherit; }
.tb-btn:hover { background: rgba(79,70,229,0.15); color: #e0e0e0; }
.tb-btn.active { background: var(--cobalt-600); color: #fff; }
.tb-divider { width: 1px; height: 18px; background: #2a2a3e; margin: 0 3px; }

/* ── Light Theme ── */
:root.light { --surface-950: #f5f5f5; --surface-900: #ffffff; --surface-850: #f0f0f0; --surface-800: #e8e8e8; --cobalt-950: #eef2ff; --cobalt-600: #6366f1; }
:root.light body { color: #333; background: #f5f5f5; }
:root.light .doc-sidebar { background: #fff; border-color: #e5e5e5; }
:root.light .doc-sidebar-header { border-color: #e5e5e5; }
:root.light .doc-sidebar-footer { border-color: #e5e5e5; }
:root.light .doc-toc a { color: #666; }
:root.light .doc-toc a:hover { background: rgba(79,70,229,0.04); color: #333; }
:root.light .doc-toc a.active { background: rgba(79,70,229,0.08); color: var(--cobalt-600); }
:root.light .doc-body h2 { color: #222; }
:root.light .doc-body h3 { color: #333; }
:root.light .doc-body p, :root.light .doc-body li { color: #444; }
:root.light .doc-body code { background: rgba(0,0,0,0.06); color: #555; }
:root.light .doc-body pre { background: #f0f0f0; border-color: #ddd; color: #333; }
:root.light .doc-body blockquote { background: rgba(79,70,229,0.04); color: #555; border-color: var(--cobalt-400); }
:root.light .doc-body table th { background: #f0f0f0; color: #555; }
:root.light .doc-body table td { border-color: #ddd; }
:root.light .doc-body hr { border-color: #ddd; }
:root.light .doc-header { background: #f5f5f5; }
:root.light .doc-header h1 { color: #222; }

@media (max-width: 768px) {
  .doc-sidebar { display: none; }
  .doc-sidebar.open { display: flex; position: fixed; top: 0; left: 0; width: 260px; height: 100vh; z-index: 50; box-shadow: 4px 0 20px rgba(0,0,0,0.5); }
  .doc-body { padding: 0 16px 40px; }
  .doc-header { padding: 0 16px; }
}
</style>
</head>
<body>
<div class="progress-bar" id="progressBar"></div>
<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
  <span class="lb-close" onclick="closeLightbox()">✕</span>
  <img id="lightboxImg" src="" alt="">
</div>

<!-- Top-Right Toolbar -->
<div class="top-toolbar" id="topToolbar">
  <button class="tb-btn active" id="langZh" onclick="setLang('zh')" title="中文">🇨🇳</button>
  <button class="tb-btn" id="langEn" onclick="setLang('en')" title="English">🇺🇸</button>
  <span class="tb-divider"></span>
  <button class="tb-btn" id="themeBtn" onclick="toggleTheme()" title="切换主题">🌙</button>
</div>

<div class="doc-wrapper">
  <aside class="doc-sidebar" id="sidebar">
    <div class="doc-sidebar-icon">📄</div>
    <div class="doc-sidebar-header">
      <div class="sidebar-title" title="<!--TITLE-->" id="sidebarTitle">📄 <!--TITLE--></div>
      <div class="sub-row">
        <div class="sub"><!--SUBTITLE--></div>
        <div class="doc-h3-toggle" id="h3Toggle" onclick="toggleH3()">H3</div>
      </div>
    </div>
    <nav class="doc-toc" id="toc"></nav>
    <div class="doc-sidebar-footer">
      <button class="sb-btn" onclick="alert('TOC 搜索功能开发中')" title="搜索 TOC (开发中)">🔍</button>
      <span style="flex:1"></span>
      <button class="sb-btn" id="collapseBtn" onclick="toggleSidebar()" title="折叠侧边栏">◀◀</button>
    </div>
  </aside>
  <div class="doc-main" id="docMain">
    <div class="doc-header">
      <h1><!--TITLE--></h1>
      <div class="meta"><!--METADATA--></div>
    </div>
    <div class="doc-body" id="docBody"><!--CONTENT--></div>
  </div>
</div>
<script>
(function() {
  const body = document.getElementById('docBody');
  const toc  = document.getElementById('toc');
  const headings = body.querySelectorAll('h2, h3');
  const tocItems = [];

  /* ═══════ i18n & Theme ═══════ */
  var _lang = localStorage.getItem('html-gen:doc_lang');
  _lang = (_lang === 'zh' || _lang === 'en') ? _lang : 'zh';
  var L = { zh: { pages: '共 {n} 节' }, en: { pages: '{n} sections' } };
  function t(key, params) { var s = L[_lang][key]; Object.keys(params).forEach(function(k) { s = s.replace('{'+k+'}', params[k]); }); return s; }
  document.getElementById('langZh').classList.toggle('active', _lang === 'zh');
  document.getElementById('langEn').classList.toggle('active', _lang === 'en');

  window.setLang = function(lang) {
    if (lang !== 'zh' && lang !== 'en') return;
    _lang = lang;
    try { localStorage.setItem('html-gen:doc_lang', lang); } catch(e) {}
    document.getElementById('langZh').classList.toggle('active', lang === 'zh');
    document.getElementById('langEn').classList.toggle('active', lang === 'en');
    updateSub();
  };

  var _theme = localStorage.getItem('html-gen:doc_theme');
  if (_theme === 'light') document.documentElement.classList.add('light');
  document.getElementById('themeBtn').textContent = (_theme === 'light') ? '☀️' : '🌙';

  window.toggleTheme = function() {
    var r = document.documentElement;
    var isLight = !r.classList.contains('light');
    r.classList.toggle('light', isLight);
    try { localStorage.setItem('html-gen:doc_theme', isLight ? 'light' : 'dark'); } catch(e) {}
    document.getElementById('themeBtn').textContent = isLight ? '☀️' : '🌙';
  };

  // Title click → copy path (via meta text)
  document.getElementById('sidebarTitle').addEventListener('click', function() {
    var metaEl = document.querySelector('.doc-header .meta');
    var m = metaEl ? metaEl.textContent.match(/路径:\s*(.+)/) : null;
    if (m && /^(https?:|\/|~\/)/.test(m[1])) {
      var path = m[1].trim();
      try { navigator.clipboard.writeText(path).catch(function(){}); } catch(e) {}
      showToast('已复制: ' + path);
    }
  });

  function showToast(msg) {
    var el = document.getElementById('docToast'); if (!el) { el = document.createElement('div'); el.id = 'docToast'; el.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:8px 20px;background:var(--cobalt-950);color:#e0e0e0;border-radius:8px;font-size:0.78rem;z-index:9999;border:1px solid var(--cobalt-700);opacity:0;transition:opacity 0.2s;white-space:nowrap;pointer-events:none'; document.body.appendChild(el); }
    el.textContent = msg; el.style.opacity = '1';
    clearTimeout(el._hide); el._hide = setTimeout(function() { el.style.opacity = '0'; }, 2500);
  }

  // Section count
  var _h2Count = body.querySelectorAll('h2').length;
  function updateSub() {
    var subEl = document.querySelector('.doc-sidebar-header .sub');
    if (!subEl) return;
    var base = (subEl.textContent || '').replace(/\s*共\s*\d+\s*节.*|\s*\d+\s*sections.*/, '').trim();
    var text = t('pages', {n: _h2Count});
    subEl.textContent = (base ? base + ' · ' : '') + text;
  }
  updateSub();

  /* ═══════ H3 Toggle ═══════ */
  var _h3Visible = false;
  window.toggleH3 = function() {
    _h3Visible = !_h3Visible;
    var btn = document.getElementById('h3Toggle');
    if (btn) { btn.classList.toggle('on', _h3Visible); btn.textContent = _h3Visible ? 'H3 ✓' : 'H3'; }
    try { localStorage.setItem('html-gen:doc:h3-visible', _h3Visible); } catch(e) {}
    var h3s = document.querySelectorAll('.toc-h3');
    for (var i = 0; i < h3s.length; i++) h3s[i].classList.toggle('show', _h3Visible);
  };
  try { if (localStorage.getItem('html-gen:doc:h3-visible') === 'true') { _h3Visible = true; document.getElementById('h3Toggle').classList.add('on'); document.getElementById('h3Toggle').textContent = 'H3 ✓'; } } catch(e) {}

  /* ═══════ Sidebar Collapse ═══════ */
  var _sidebarCollapsed = false;
  window.toggleSidebar = function() {
    _sidebarCollapsed = !_sidebarCollapsed;
    var sb = document.getElementById('sidebar'); var btn = document.getElementById('collapseBtn');
    if (sb) sb.classList.toggle('collapsed', _sidebarCollapsed);
    if (btn) btn.textContent = _sidebarCollapsed ? '▶▶' : '◀◀';
    try { localStorage.setItem('html-gen:doc:sidebar-collapsed', _sidebarCollapsed); } catch(e) {}
    setTimeout(function() { updateProgress(); }, 300);
  };
  try { if (localStorage.getItem('html-gen:doc:sidebar-collapsed') === 'true') toggleSidebar(); } catch(e) {}

  document.addEventListener('keydown', function(e) {
    if (e.key === '[' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
      if (!e.metaKey && !e.ctrlKey) { e.preventDefault(); toggleSidebar(); }
    }
  });

  /* ═══════ TOC ═══════ */
  headings.forEach(function(h, i) {
    if (!h.id) h.id = 'section-' + i;
    var anchor = document.createElement('a'); anchor.className = 'anchor-link'; anchor.textContent = '\u00b6'; anchor.href = '#' + h.id;
    anchor.addEventListener('click', function(e) { e.preventDefault(); var url = window.location.href.split('#')[0] + '#' + h.id; navigator.clipboard.writeText(url); anchor.textContent = '\u2713'; setTimeout(function() { anchor.textContent = '\u00b6'; }, 1500); });
    h.appendChild(anchor);
    var level = h.tagName.toLowerCase().replace('h', '');
    var link = document.createElement('a'); link.href = '#' + h.id; link.textContent = h.textContent; link.className = 'toc-h' + level; link.dataset.target = h.id;
    link.addEventListener('click', function(e) { e.preventDefault(); var t = document.getElementById(this.dataset.target); if (t) t.scrollIntoView({ behavior: 'smooth' }); });
    toc.appendChild(link); tocItems.push(link);
  });

  function onScroll() {
    var current = ''; headings.forEach(function(h) { if (h.getBoundingClientRect().top <= 100) current = h.id; });
    tocItems.forEach(function(a) { a.classList.toggle('active', a.dataset.target === current); });
  }
  window.addEventListener('scroll', onScroll, { passive: true }); onScroll();

  body.querySelectorAll('pre').forEach(function(pre) {
    var btn = document.createElement('button'); btn.className = 'copy-btn'; btn.textContent = '复制';
    btn.addEventListener('click', function() {
      var code = pre.querySelector('code'); var text = code ? code.textContent : pre.textContent;
      function done() { btn.textContent = '已复制'; setTimeout(function() { btn.textContent = '复制'; }, 2000); }
      if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(text).then(done).catch(fallback); } else { fallback(); }
      function fallback() { var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; ta.style.pointerEvents = 'none'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); done(); }
    });
    pre.appendChild(btn);
  });

  body.querySelectorAll('pre code').forEach(function(code) {
    var text = code.textContent; var lines = text.split('\n'); if (lines.length > 0 && lines[lines.length-1] === '') lines.pop(); if (lines.length < 2) return;
    code.textContent = ''; lines.forEach(function(line, idx) { var span = document.createElement('span'); span.className = 'line'; span.textContent = line; code.appendChild(span); if (idx < lines.length-1) code.appendChild(document.createTextNode('\n')); });
    code.classList.add('code-with-lines');
  });

  var main = document.getElementById('docMain'); var bar = document.getElementById('progressBar');
  function updateProgress() { var p = main.scrollTop / (main.scrollHeight - main.clientHeight); bar.style.width = (p * 100) + '%'; }
  main.addEventListener('scroll', updateProgress, { passive: true }); updateProgress();

  var lb = document.getElementById('lightbox'); var lbImg = document.getElementById('lightboxImg');
  body.querySelectorAll('img').forEach(function(img) { img.addEventListener('click', function(e) { e.stopPropagation(); lbImg.src = this.src; lb.classList.add('active'); }); });
  window.closeLightbox = function(e) { if (!e || e.target === lb || e.target === document.querySelector('.lb-close')) lb.classList.remove('active'); };
  document.addEventListener('keydown', function(e) { if (e.key === 'Escape' && lb.classList.contains('active')) lb.classList.remove('active'); });
})();
</script>
</body>
</html>
