[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "html-gen-cli"
dynamic = ["version"]
description = "Zero-dependency Markdown/JSON → self-contained HTML generator (doc/slide/table/knowledge), dark theme, Chinese-first"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["html", "markdown", "json", "template", "generator", "cli"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: HTML",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://github.com/imjaden/html-gen.cli"

[project.scripts]
html-gen = "html_gen:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["html_gen"]

[tool.setuptools.package-data]
html_gen = ["*.html", "*.css", "*.py", "skills/**/*"]

[tool.setuptools.dynamic]
version = {attr = "html_gen.__version__"}
